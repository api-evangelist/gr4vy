aid: gr4vy
name: Gr4vy
description: Gr4vy is a cloud-native payment orchestration platform delivered as dedicated, per-merchant infrastructure.
  A single REST API and a PCI DSS Level 1 vault connect merchants and platforms to hundreds of payment services,
  payment methods, anti-fraud providers, digital wallets and gift-card services, with no-code Flow routing rules,
  network tokens, 3-D Secure, payouts, payment links, reporting and webhooks. Gr4vy publishes an OpenAPI 3.1 contract,
  Speakeasy-generated server SDKs in six languages, mobile and web checkout components (Embed, Secure Fields), a
  native CLI, a Postman collection, a docs MCP server, an A2A agent card and an Agent Skill.
url: https://raw.githubusercontent.com/api-evangelist/gr4vy/refs/heads/main/apis.yml
x-type: company
x-source: harvest:payments
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-20 (local-v3; was harvest)
