openapi: 3.2.0
info:
  title: Gr4vy Buyers API
  version: '1.0'
  description: 'Operations tagged Buyers across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Buyers
  description: 'In Gr4vy, a buyer represents your customer, the shopper who''s performing

    a checkout and making a purchase.


    A buyer can be used by you to:


    * Display a human readable name (`display_name`) for a buyer in the Gr4vy

    admin panel

    * Associate multiple stored payment methods with a single user

    * Initialize **Gr4vy Embed** with the buyer ID, automatically displaying the

    buyer''s previously stored payment methods, allowing for faster checkout.'
paths:
  /buyers:
    get:
      operationId: list-buyers
      summary: List buyers
      description: Returns a list of buyers.
      tags:
      - Buyers
      parameters:
      - schema:
          type: string
          example: John
        in: query
        name: search
        deprecated: true
        description: '***Please do not use this query parameter in a production application, as this API call is

          very inefficient and may negatively impact transaction performance.***


          Filters the results to only the buyers for which the `display_name`, `email_address`

          or `external_identifier` matches this value. This field allows for a case insensitive

          partial match, matching any buyer for which any of the fields partially or

          completely matches.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that exactly matches this value.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      responses:
        '200':
          description: Returns a list of buyers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyers'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: new-buyer
      summary: New buyer
      description: 'Adds a buyer, allowing for payment methods and transactions to be associated

        to this buyer.'
      tags:
      - Buyers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerRequest'
            examples:
              Create a buyer:
                value:
                  external_identifier: '412231123'
                  display_name: John L.
      responses:
        '201':
          description: Returns the buyer that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '409':
          description: Returns an error if duplicate resource has been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409DuplicateRecord'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /buyers/{buyer_id}:
    parameters:
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: buyer_id
      in: path
      required: true
      description: The unique ID for a buyer.
    get:
      operationId: get-buyer
      summary: Get buyer
      description: Gets the information about a buyer.
      tags:
      - Buyers
      responses:
        '200':
          description: Returns the information about a buyer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      operationId: update-buyer
      summary: Update buyer
      description: Updates a buyer's details.
      tags:
      - Buyers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerUpdate'
            examples:
              Update a buyer:
                value:
                  external_identifier: '42623266'
                  display_name: John D.
      responses:
        '200':
          description: Returns the updated buyer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Buyer'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
        '409':
          description: Returns an error if duplicate resource has been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409DuplicateRecord'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-buyer
      summary: Delete buyer
      description: 'Deletes a buyer record. Any associated stored payment methods will remain

        in the system but no longer associated to the buyer.'
      tags:
      - Buyers
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /buyers/{buyer_id}/shipping-details:
    parameters:
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: buyer_id
      in: path
      required: true
      description: The unique ID for a buyer.
    get:
      operationId: list-buyer-shipping-details
      summary: List buyer shipping details
      description: Retrieve all shipping details for a buyer.
      tags:
      - Buyers
      responses:
        '200':
          description: Returns all associated shipping details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingDetails'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: new-buyer-shipping-detail
      summary: New buyer shipping detail
      description: Adds a buyer shipping detail.
      tags:
      - Buyers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingDetailRequest'
      responses:
        '201':
          description: Returns the shipping detail that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingDetail'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /buyers/{buyer_id}/shipping-details/{shipping_detail_id}:
    parameters:
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: buyer_id
      in: path
      required: true
      description: The unique ID for a buyer.
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: shipping_detail_id
      in: path
      required: true
      description: The unique ID for a buyer's shipping detail.
    put:
      operationId: update-buyer-shipping-detail
      summary: Update buyer shipping details
      description: Updates shipping detail for a buyer.
      tags:
      - Buyers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingDetailUpdateRequest'
      responses:
        '200':
          description: Returns the updated shipping detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingDetail'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-buyer-shipping-detail
      summary: Delete buyer shipping detail
      description: Deletes a buyer shipping detail.
      tags:
      - Buyers
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /buyers/billing-details:
    get:
      operationId: get-buyer-billing-details
      summary: Get buyer billing details
      description: 'Gets the information about a buyer''s billing details. Note that only one

        of either buyer''s ID or external identifier may be passed as a

        query parameter, and not both.'
      tags:
      - Buyers
      x-internal: true
      parameters:
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: buyer_id
        description: 'Filters the results to only the items for which the `buyer` has an

          `id` that matches this value.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: buyer_external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that matches this value.'
      responses:
        '200':
          description: Returns the information about a buyer's billing details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingDetails'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      operationId: update-buyer-billing-details
      summary: Update buyer billing details
      description: 'Updates the billing details of a buyer. Note that only one of either

        buyer''s ID or external identifier may be passed as a query

        parameter, and not both.'
      tags:
      - Buyers
      x-internal: true
      parameters:
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: buyer_id
        description: 'Filters the results to only the items for which the `buyer` has an

          `id` that matches this value.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: buyer_external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that matches this value.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingDetailsUpdateRequest'
      responses:
        '200':
          description: Returns the updated billing details of the buyer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingDetails'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    ShippingDetail:
      title: Shipping detail
      type: object
      description: Shipping detail for a buyer.
      x-tags:
      - Buyers
      properties:
        type:
          type: string
          description: The type of this resource. Is always `shipping-details`.
          example: shipping-details
          enum:
          - shipping-details
        id:
          type: string
          format: uuid
          description: The unique ID for a buyer's shipping detail.
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        buyer_id:
          type: string
          format: uuid
          description: The unique ID for a buyer.
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        first_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first name(s) or given name of the buyer.
          example: John
        last_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: Lunn
          description: The last name, or family name, of the buyer.
        email_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 320
          description: The email address of the buyer.
          example: john@example.com
        phone_number:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 1
          maxLength: 50
          description: 'The phone number of the buyer. This number is formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        address:
          type:
          - object
          - 'null'
          description: The physical shipping address associated to this buyer.
          allOf:
          - $ref: '#/components/schemas/Address'
    BillingDetailsUpdateRequest:
      title: Billing Details (Update)
      type: object
      x-tags:
      - Buyers
      properties:
        first_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first name(s) or given name for the buyer.
          example: John
        last_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: Lunn
          description: The last name, or family name, of the buyer.
        email_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 320
          description: The email address for the buyer.
          example: john@example.com
        phone_number:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 1
          maxLength: 50
          description: 'The phone number for the buyer which should be formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        address:
          type:
          - object
          - 'null'
          description: The billing address for the buyer.
          allOf:
          - $ref: '#/components/schemas/Address'
        tax_id:
          type:
          - object
          - 'null'
          description: The tax ID information associated with the billing details.
          allOf:
          - $ref: '#/components/schemas/TaxId'
    BuyerRequest:
      title: Buyer (Create)
      type: object
      description: A request to create a buyer.
      x-tags:
      - Buyers
      properties:
        external_identifier:
          type:
          - string
          - 'null'
          description: An external identifier that can be used to match the buyer against your own records. This value needs to be unique for all buyers.
          example: user-789123
          minLength: 1
          maxLength: 200
        display_name:
          type:
          - string
          - 'null'
          description: A unique name for this buyer which is used in the Gr4vy admin panel to give a buyer a human readable name.
          example: John L.
          minLength: 1
          maxLength: 200
        billing_details:
          type:
          - object
          - 'null'
          description: The optional billing details to associate with a buyer.
          allOf:
          - $ref: '#/components/schemas/BillingDetailsRequest'
        account_number:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: '1234567'
          description: The source account number to perform an account funding transaction.
    BuyerUpdate:
      title: Buyer (Update)
      type: object
      description: A request to update a buyer.
      x-tags:
      - Buyers
      properties:
        external_identifier:
          type:
          - string
          - 'null'
          description: An external identifier that can be used to match the buyer against your own records. This value needs to be unique for all buyers.
          example: user-789123
          minLength: 1
          maxLength: 200
        display_name:
          type:
          - string
          - 'null'
          description: A unique name for this buyer which is used in the Gr4vy admin panel to give a buyer a human readable name.
          example: John L.
          minLength: 1
          maxLength: 200
        billing_details:
          type:
          - object
          - 'null'
          description: The billing details of the buyer.
          allOf:
          - $ref: '#/components/schemas/BillingDetailsUpdateRequest'
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    ShippingDetails:
      title: Shipping details
      type: object
      description: A list of shipping details.
      x-tags:
      - Transactions
      properties:
        items:
          type: array
          description: A list of shipping details.
          items:
            $ref: '#/components/schemas/ShippingDetail'
    ShippingDetailRequest:
      title: Shipping detail (Create)
      type: object
      description: Shipping detail associated to a buyer.
      x-tags:
      - Buyers
      properties:
        first_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first name(s) or given name for the buyer.
          example: John
        last_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: Lunn
          description: The last name, or family name, of the buyer.
        email_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 320
          description: The email address for the buyer.
          example: john@example.com
        phone_number:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 1
          maxLength: 50
          description: 'The phone number for the buyer which should be formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        address:
          description: The physical shipping address associated to this buyer.
          allOf:
          - $ref: '#/components/schemas/Address'
    ShippingDetailUpdateRequest:
      title: Shipping detail (Update)
      type: object
      x-tags:
      - Buyers
      properties:
        first_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first name(s) or given name for the buyer.
          example: John
        last_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: Lunn
          description: The last name, or family name, of the buyer.
        email_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 320
          description: The email address for the buyer.
          example: john@example.com
        phone_number:
          type:
          - string
          - 'null'
