openapi: 3.2.0
info:
  title: Gr4vy Card Details API
  version: '1.0'
  description: 'Operations tagged Card Details across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Card Details
  description: Endpoints to retrieve details of a card by utilising a BIN lookup table.
  x-internal: true
paths:
  /card-details:
    get:
      operationId: get-card-details
      summary: Get card details
      description: 'Retrieves details about a card using either that

        card''s BIN or for stored cards the `payment_method_id`.'
      tags:
      - Card Details
      x-internal: true
      x-speakeasy-ignore: true
      parameters:
      - schema:
          type: string
          example: USD
        in: query
        name: currency
        required: true
        description: 'Filters the results to only the items which support this currency code. A

          currency is formatted as 3-letter ISO currency code.'
      - schema:
          type: integer
          example: 500
        in: query
        name: amount
        description: Used by the Flow engine to filter the results based on the transaction amount.
      - schema:
          type: string
          minLength: 8
          maxLength: 8
          example: '42424242'
        in: query
        name: bin
        description: The first 8 digits (the BIN) of the card.
      - schema:
          type: string
          example: US
        in: query
        name: country
        description: 'Filters the results to only the items which support this country code. A

          country is formatted as 2-letter ISO country code.'
      - schema:
          type: string
          example: capture
          enum:
          - authorize
          - capture
        in: query
        name: intent
        description: The intent of the transaction.
      - schema:
          type: boolean
          example: true
        in: query
        name: is_subsequent_payment
        description: 'Used by the Flow engine to filter available options based on the value

          of the `is_subsequent_payment` flag.'
      - schema:
          type: boolean
          example: true
        in: query
        name: merchant_initiated
        description: 'Used by the Flow engine to filter available options based on the value

          of the `merchant_initiated` flag.'
      - schema:
          type: string
          example: '{"restricted_items": "True"}'
        in: query
        name: metadata
        description: 'Used by the Flow engine to filter available options based on various

          client-defined parameters. If present, this must be a string representing

          a valid JSON dictionary.'
      - schema:
          type: string
          example: 46973e9d-88a7-44a6-abfe-be4ff0134ff4
          format: uuid
        in: query
        name: payment_method_id
        description: Filters for transactions that have a payment method with an ID that matches exactly with the provided value.
      - schema:
          type: string
          example: recurring
          enum:
          - ecommerce
          - moto
          - recurring
          - installment
          - card_on_file
        in: query
        name: payment_source
        description: 'Used by the Flow engine to filter available options based on the

          payment source.'
      responses:
        '200':
          description: Returns information about a card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetails'
        '400':
          description: Returns an error if any of the query parameters are not recognised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    RequiredFields:
      title: Required Fields
      type: object
      description: The fields that are required to process a transaction for this payment option.
      properties:
        first_name:
          type: boolean
          description: The first (given) name of the buyer.
          readOnly: true
        last_name:
          type: boolean
          description: The last (family) name of the buyer.
          readOnly: true
        email_address:
          type: boolean
          description: The email address of the buyer.
          readOnly: true
        phone_number:
          type: boolean
          description: The phone number of the buyer.
          readOnly: true
        address:
          type: object
          description: The billing address of the buyer.
          properties:
            city:
              type: boolean
              description: The city for the billing address.
              readOnly: true
            country:
              type: boolean
              description: The country for the billing address.
              readOnly: true
            postal_code:
              type: boolean
              description: The postal code or zip code for the billing address.
              readOnly: true
            state:
              type: boolean
              description: The state, county, or province for the billing address.
              readOnly: true
            house_number_or_name:
              type: boolean
              description: 'The house number or name for the billing address. Not all payment

                services use this field but some do.'
              readOnly: true
            line1:
              type: boolean
              description: The first line of the billing address.
              readOnly: true
        tax_id:
          type: boolean
          description: The tax id code associated with the billing details.
          readOnly: true
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    CardDetails:
      title: Card Details
      type: object
      description: Details about a card.
      properties:
        type:
          type: string
          description: '`card-detail`.'
          example: card-detail
          enum:
          - card-detail
        id:
          type: string
          format: bin
          minLength: 8
          maxLength: 8
          description: 'The 8 digit BIN of the card. When looking up card details using a

            `payment_method_id` this value will be `null`.'
          example: '42424242'
        card_type:
          type: string
          description: The type of card.
          example: credit
          enum:
          - credit
          - debit
        scheme:
          description: The scheme/brand of the card.
          type:
          - string
          - 'null'
          example: visa
          enum:
          - accel
          - amex
          - bancontact
          - carte-bancaire
          - cirrus
          - culiance
          - dankort
          - diners-club
          - discover
          - eftpos-australia
          - elo
          - hipercard
          - jcb
          - maestro
          - mastercard
          - mir
          - nyce
          - other
          - pulse
          - rupay
          - star
          - uatp
          - unionpay
          - visa
          - null
        scheme_icon_url:
          type: string
          description: An icon to display for the card scheme.
          example: https://api.sandbox.example.gr4vy.app/assets/card-scheme-definitions/visa.svg
        country:
          type: string
          description: The 2-letter ISO code of the issuing country of the card.
          example: US
        required_fields:
          $ref: '#/components/schemas/RequiredFields'
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    TransactionPaymentSource:
      type: string
      enum:
      - ecommerce
      - moto
      - recurring
      - installment
      - card_on_file
      title: TransactionPaymentSource
      description: The way payment method information made it to this transaction.
