openapi: 3.2.0
info:
  title: Gr4vy Webhook subscriptions API
  version: '1.0'
  description: 'Operations tagged Webhook subscriptions across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Webhook Subscriptions
  description: Endpoints related to the management of subscriptions for endpoints to receive webhooks.
paths:
  /webhook-subscriptions:
    get:
      operationId: list-webhook-subscriptions
      summary: List webhook subscriptions
      description: Returns a list of endpoints that we will send webhooks to.
      tags:
      - Webhook Subscriptions
      parameters:
      - schema:
          type: string
          maxLength: 255
          example: default
        in: header
        name: X-Gr4vy-Merchant-Account-ID
        description: 'The ID of the merchant account to act upon. When not  or provided, this value

          will default to the first merchant account a user has access to. This value

          can be set to `*` on some APIs to fetch resources from all merchant accounts.'
      responses:
        '200':
          description: Returns a list of webhook subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptions'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: new-webhook-subscription
      summary: New webhook subscription
      description: Adds a new endpoint to send webhooks to.
      tags:
      - Webhook Subscriptions
      parameters:
      - schema:
          type: string
          maxLength: 255
          example: default
        in: header
        name: X-Gr4vy-Merchant-Account-ID
        description: 'The ID of the merchant account to act upon. When not  or provided, this value

          will default to the first merchant account a user has access to. This value

          can be set to `*` on some APIs to fetch resources from all merchant accounts.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionRequest'
      responses:
        '200':
          description: Returns the new webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /webhook-subscriptions/{webhook_subscription_id}:
    parameters:
    - schema:
        type: string
        example: 8fd77b13-a5e3-43de-bd54-26a8a714ac18
      name: webhook_subscription_id
      in: path
      required: true
      description: The ID for the webhook subscription.
    get:
      operationId: get-webhook-subscription
      summary: Get webhook subscription
      description: Returns a single endpoint that we will send webhooks to.
      tags:
      - Webhook Subscriptions
      parameters:
      - schema:
          type: string
          maxLength: 255
          example: default
        in: header
        name: X-Gr4vy-Merchant-Account-ID
        description: 'The ID of the merchant account to act upon. When not  or provided, this value

          will default to the first merchant account a user has access to. This value

          can be set to `*` on some APIs to fetch resources from all merchant accounts.'
      responses:
        '200':
          description: Returns a webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      operationId: update-webhook-subscription
      summary: Update webhook subscription
      description: Updates a webhook subscription.
      tags:
      - Webhook Subscriptions
      parameters:
      - schema:
          type: string
          maxLength: 255
          example: default
        in: header
        name: X-Gr4vy-Merchant-Account-ID
        description: 'The ID of the merchant account to act upon. When not  or provided, this value

          will default to the first merchant account a user has access to. This value

          can be set to `*` on some APIs to fetch resources from all merchant accounts.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
      responses:
        '200':
          description: Returns the updated webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-webhook-subscription
      summary: Delete a webhook subscription
      description: 'Deletes a webhook subscription, removing any delivery of webhooks

        to the associated endpoint.'
      tags:
      - Webhook Subscriptions
      parameters:
      - schema:
          type: string
          maxLength: 255
          example: default
        in: header
        name: X-Gr4vy-Merchant-Account-ID
        description: 'The ID of the merchant account to act upon. When not  or provided, this value

          will default to the first merchant account a user has access to. This value

          can be set to `*` on some APIs to fetch resources from all merchant accounts.'
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /webhook-subscriptions/{webhook_subscription_id}/rotate-secret:
