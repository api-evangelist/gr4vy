      security:
      - OAuth2PasswordBearer:
        - webhook-subscriptions.write
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the webhook subscription
          examples:
          - ef9496d8-53a5-4aad-8ca2-00eb68334389
