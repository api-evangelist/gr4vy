      responses:
        '200':
          description: Returns the updated webhook subscription with the new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          description: Returns an error if the request was badly formatted, missing required fields or the webhook subscription already has a secret being rotated.
