components:
  schemas:
    WebhookSubscriptionRotateSecretRequest:
      title: Rotate secret of a webhook subscription.
      type: object
      description: A request to rotate the secret of a webhook subscription.
      x-tags:
      - Request Bodies
      properties:
        delta:
          type:
          - integer
          - 'null'
          description: 'Delta time in minutes to expire existing secret if any.

            If not set or set to zero it will expire immediately.'
          example: 1440
          minimum: 0
          maximum: 99999999
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    WebhookSubscriptionRequest:
      title: Webhook subscription (Create)
      type: object
      x-tags:
      - Webhook subscriptions
      properties:
        active:
          type: boolean
          example: true
          description: 'Defines if this subscription is currently active or not. When deactivated,

            webhook events are not sent to the endpoint configured for this subscription.'
        url:
          type: string
          format: uri
          description: The URL of the endpoint to deliver webhook events to.
          example: https://example.com/webhooks
        authentication:
          allOf:
          - $ref: '#/components/schemas/WebhookSubscriptionAuthentication'
    WebhookSubscriptions:
      title: Webhook subscriptions
      type: object
      x-tags:
      - Webhook subscriptions
      properties:
        items:
          type: array
          description: A list of webhook subscriptions.
          items:
            $ref: '#/components/schemas/WebhookSubscription'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
