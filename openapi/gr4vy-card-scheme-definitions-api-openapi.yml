openapi: 3.2.0
info:
  title: Gr4vy Card Scheme Definitions API
  version: '1.0'
  description: 'Operations tagged Card Scheme Definitions across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Card Scheme Definitions
  description: Card Scheme definitions provide display information to a card scheme.
paths:
  /card-scheme-definitions:
    get:
      operationId: list-card-scheme-definitions
      summary: List card scheme definitions
      description: Returns a list of all available card scheme definitions.
      tags:
      - Card Scheme Definitions
      responses:
        '200':
          description: Returns a list of card scheme definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSchemeDefinitions'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
