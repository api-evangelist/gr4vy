openapi: 3.2.0
info:
  title: Gr4vy Buyers - Payment methods API
  description: The Gr4vy API.
  version: 1.0.0
tags:
- name: Buyers - Payment methods
  description: Query payment methods for buyers.
paths:
  /buyers/payment-methods:
    get:
      tags:
      - Buyers - Payment methods
      summary: List payment methods for a buyer
      description: List all the stored payment methods for a specific buyer.
      operationId: list_buyer_payment_methods
      security:
      - OAuth2PasswordBearer:
        - payment-methods.read
        - embed
      parameters:
      - name: buyer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: The ID of the buyer to query payment methods for.
          examples:
          - fe26475d-ec3e-4884-9553-f7356683f7f9
          title: Buyer Id
        description: The ID of the buyer to query payment methods for.
      - name: buyer_external_identifier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The external identifier of the buyer to query payment methods for.
          examples:
          - buyer-12345
          title: Buyer External Identifier
        description: The external identifier of the buyer to query payment methods for.
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - const: last_used_at
            type: string
          - const: usage_count
            type: string
          - const: cit_last_used_at
            type: string
          - const: cit_usage_count
            type: string
          - type: 'null'
          description: The field to sort the payment methods by.
          examples:
          - last_used_at
          title: Sort By
        description: The field to sort the payment methods by.
      - name: order_by
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          description: The direction to sort the payment methods in.
          examples:
          - desc
          default: desc
          title: Order By
        description: The direction to sort the payment methods in.
      - name: country
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
            examples:
            - DE
            - GB
            - US
          - type: 'null'
          description: The country code to filter payment methods by. This only applies to payment methods with a `country` value.
          examples:
          - US
          title: Country
        description: The country code to filter payment methods by. This only applies to payment methods with a `country` value.
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
            examples:
            - EUR
            - GBP
            - USD
          - type: 'null'
          description: The currency code to filter payment methods by. This only applies to payment methods with a `currency` value.
          examples:
          - USD
          title: Currency
        description: The currency code to filter payment methods by. This only applies to payment methods with a `currency` value.
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSummaries'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: list
      x-speakeasy-group: buyers.payment-methods
components:
  schemas:
    Error401:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `unauthorized`
          default: unauthorized
          examples:
          - unauthorized
        status:
          type: integer
          title: Status
          description: Always `401`.
          default: 401
          examples:
          - 401
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: No valid API authentication found
          examples:
          - No valid API authentication found
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error401
    Mode:
      type: string
      enum:
      - card
      - redirect
      - applepay
      - googlepay
      - checkout-session
      - click-to-pay
      - gift-card
      - bank
      - paze
      title: Mode
    Error403:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `forbidden`
          default: forbidden
          examples:
          - forbidden
        status:
          type: integer
          title: Status
          description: Always `403`.
          default: 403
          examples:
          - 403
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error403
    ErrorLocation:
      type: string
      enum:
      - query
      - body
      - path
      - header
      - unknown
      title: ErrorLocation
    Error500:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `server_error`
          default: server_error
          examples:
          - server_error
        status:
          type: integer
          title: Status
          description: Always `500`.
          default: 500
          examples:
          - 500
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Request could not be processed
          examples:
          - Request could not be processed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error500
    Error405:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `method_not_allowed`
          default: method_not_allowed
          examples:
          - method_not_allowed
        status:
          type: integer
          title: Status
          description: Always `405`.
          default: 405
          examples:
          - 405
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Method Not Allowed
          examples:
          - Method Not Allowed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error405
    PaymentMethodSummary:
      properties:
        type:
          type: string
          const: payment-method
          title: Type
          description: Always `payment-method`.
          default: payment-method
          examples:
          - payment-method
        approval_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Approval Url
          description: The optional URL that the buyer needs to be redirected to to further authorize their payment.
          examples:
          - https://gr4vy.app/redirect/12345
        country:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
            examples:
            - DE
            - GB
            - US
          - type: 'null'
          title: Country
          description: The 2-letter ISO code of the country this payment method can be used for. If this value is null the payment method may be used in multiple countries.
          examples:
          - US
        currency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
            examples:
            - EUR
            - GBP
            - USD
          - type: 'null'
          title: Currency
          description: The ISO-4217 currency code that this payment method can be used for. If this value is null the payment method may be used for multiple currencies.
          examples:
          - USD
        details:
          anyOf:
          - $ref: '#/components/schemas/PaymentMethodDetailsCard'
          - type: 'null'
          description: Details for credit or debit card payment method.
        expiration_date:
          anyOf:
          - type: string
            maxLength: 5
            minLength: 5
            pattern: ^\d{2}/\d{2}$
          - type: 'null'
          title: Expiration Date
          description: The expiration date for the payment method.
          examples:
          - 12/30
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Fingerprint
          description: The unique hash derived from the payment method identifier (e.g. card number).
          examples:
          - a50b85c200ee0795d6fd33a5c66f37a4564f554355c5b46a756aac485dd168a4
        label:
          anyOf:
          - type: string
            maxLength: 320
            minLength: 0
          - type: 'null'
          title: Label
          description: A label for the card or the account. For a paypal payment method this is the user's email address. For a card it is the last 4 digits of the card.
          examples:
          - '1234'
        last_replaced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Replaced At
          description: The date and time when this card was last replaced by the account updater.
          examples:
          - '2013-07-16T19:23:00.000+00:00'
        method:
          $ref: '#/components/schemas/Method'
          description: The type of this payment method.
          examples:
          - card
        mode:
          anyOf:
          - $ref: '#/components/schemas/Mode'
          - type: 'null'
          description: The mode to use with this payment method.
          examples:
          - card
        scheme:
          anyOf:
          - $ref: '#/components/schemas/CardScheme'
          - type: 'null'
          description: The scheme of the card. Only applies to card payments.
          examples:
          - visa
        id:
          type: string
          format: uuid
          title: Id
          description: The ID for the payment method.
          examples:
          - ef9496d8-53a5-4aad-8ca2-00eb68334389
        merchant_account_id:
          type: string
          title: Merchant Account Id
          description: The ID of the merchant account this buyer belongs to.
          examples:
          - default
        additional_schemes:
          anyOf:
          - items:
              $ref: '#/components/schemas/CardScheme'
            type: array
          - type: 'null'
          title: Additional Schemes
          description: Additional schemes of the card besides the primary scheme. Only applies to card payment methods.
          examples:
          - - eftpos-australia
        cit_last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cit Last Used At
          description: The timestamp when this payment method was last used in a transaction for client initiated transactions.
          examples:
          - '2013-07-16T19:23:00.000+00:00'
        cit_usage_count:
          type: integer
          title: Cit Usage Count
          description: The number of times this payment method has been used in transactions for client initiated transactions.
          examples:
          - 50
        has_replacement:
          type: boolean
          title: Has Replacement
          description: Whether this card has a pending replacement that hasn't been applied yet.
          examples:
          - false
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: The timestamp when this payment method was last used in a transaction.
          examples:
          - '2013-07-16T19:23:00.000+00:00'
        usage_count:
          type: integer
          title: Usage Count
          description: The number of times this payment method has been used in transactions.
          examples:
          - 100
        scheme_transaction_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scheme Transaction Id
          description: The scheme transaction identifier stored against this payment method.
          examples:
          - '123456789012345'
        scheme_transaction_id_scheme:
          anyOf:
          - $ref: '#/components/schemas/CardScheme'
          - type: 'null'
          description: The scheme associated with scheme_transaction_id. Only applies to card payments.
          examples:
          - visa
        transaction_link_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction Link Id
          description: The transaction link identifier stored against this payment method.
          examples:
          - '123456789012345'
      additionalProperties: false
      type: object
      required:
      - method
      - id
      - merchant_account_id
      - cit_usage_count
      - has_replacement
      - usage_count
      - scheme_transaction_id
      - scheme_transaction_id_scheme
      title: PaymentMethodSummary
      description: 'Payment Method


        A summary of a payment method.'
    PaymentMethodDetailsCard:
      properties:
        bin:
          anyOf:
          - type: string
            maxLength: 8
            minLength: 6
            pattern: ^\d+$
          - type: 'null'
          title: Bin
        card_type:
          anyOf:
          - $ref: '#/components/schemas/CardType'
          - type: 'null'
        card_issuer_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Issuer Name
      additionalProperties: false
      type: object
      title: PaymentMethodDetailsCard
    Error404:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `not_found`
          default: not_found
          examples:
          - not_found
        status:
          type: integer
          title: Status
          description: Always `404`.
          default: 404
          examples:
