openapi: 3.2.0
info:
  title: Gr4vy Audit Logs API
  version: '1.0'
  description: 'Operations tagged Audit Logs across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Audit Logs
  description: Audit Logs provide an historic record of changes made to your Gr4vy instance.
paths:
  /audit-logs:
    get:
      operationId: list-audit-logs
      summary: List audit logs
      description: Returns a list of audit logs.
      tags:
      - Audit Logs
      parameters:
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: user_id
        description: 'Filters the results to only the items for which the `user` has an

          `id` that matches this value.'
      - schema:
          type: string
          example: created
          enum:
          - created
          - updated
          - deleted
        in: query
        name: action
        description: 'Filters the results to only the items for which the `audit-log` has an

          `action` that matches this value.'
      - schema:
          type: string
          example: buyer
        in: query
        name: resource_type
        description: 'Filters the results to only the items for which the `audit-log` has a

          `resource` that matches this type value.'
      responses:
        '200':
          description: Returns a list of audit logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogs'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    AuditLog:
      title: Audit Log
      type: object
      description: A log of a change that occurred in the Gr4vy instance.
      x-tags:
      - Audit Logs
      properties:
        type:
          type: string
          description: '`audit-log`.'
          example: audit-log
          enum:
          - audit-log
        id:
          type: string
          format: uuid
          description: The ID of the audit log entry.
          example: 8d3fe99b-1422-42e6-bbb3-932d95ae5f79
        timestamp:
          type: string
          format: date-time
          description: The date and time that the action was performed.
          example: '2022-01-01T00:00:00+00:00'
        action:
          type: string
          description: The action that was performed.
          example: created
          enum:
          - created
          - updated
          - deleted
        merchant_account_id:
          type:
          - string
          - 'null'
          description: The ID of the merchant account this entry was created for.
          example: default
        user:
          type: object
          description: The user who performed the action.
          properties:
            id:
              type: string
              format: uuid
              description: The ID of the user.
              example: 77a76f7e-d2de-4bbc-ada9-d6a0015e6bd5
            name:
              type: string
              description: The name of the user.
              example: John L
            email_address:
              type:
              - string
              - 'null'
              description: The email address for this user.
              example: john@example.com
            staff:
              type: boolean
              description: Whether the user is Gr4vy staff.
              example: false
            status:
              type: string
              description: The status of the user.
              example: active
              enum:
              - active
              - pending
              - deleted
        resource:
          type: object
          description: The resource that was changed.
          properties:
            type:
              type: string
              description: The type of the resource.
              example: buyer
            id:
              type: string
              format: uuid
              description: The ID of the resource.
              example: fe26475d-ec3e-4884-9553-f7356683f7f9
            name:
              type: string
              description: The descriptive name of the resource.
              example: Samuel J
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    AuditLogs:
      title: Audit Logs
      type: object
      description: A list of audit log entries.
      x-tags:
      - Audit Logs
      properties:
        items:
          type: array
          description: A list of audit log entries.
          items:
            $ref: '#/components/schemas/AuditLog'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
