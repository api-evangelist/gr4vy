components:
  schemas:
    PazeTravelData:
      properties:
        passengerName:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Passengername
          description: Traveler name.
          examples:
          - Team Integrations
        roundTrip:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Roundtrip
          description: Whether departure and return trips are being purchased in the same transaction.
          examples:
          - true
        departureDate:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Departuredate
          description: Date and time of departure in ISO 8601 format.
          examples:
          - '2026-06-01T08:00:00Z'
        returnDate:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Returndate
          description: Date and time of return in ISO 8601 format.
          examples:
          - '2026-06-08T18:30:00Z'
        departureLocation:
          anyOf:
          - $ref: '#/components/schemas/PazeLocationAddress'
          - type: 'null'
          description: Location from which the traveler departs.
        returnLocation:
          anyOf:
          - $ref: '#/components/schemas/PazeLocationAddress'
          - type: 'null'
          description: Location to which the traveler returns.
      additionalProperties: false
      type: object
      title: PazeTravelData
    PazeSessionRequest:
      properties:
        source:
          type: string
          enum:
          - web
          - mobile
          title: Source
          description: The platform that the Paze session is being created for. Defaults to `web`.
          default: web
          examples:
          - web
        domain_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain Name
          description: The domain on which Paze is being loaded. Required when `source` is `web`.
          examples:
          - example.com
      additionalProperties: false
      type: object
      title: PazeSessionRequest
    Error409:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `duplicate_record`
          default: duplicate_record
          examples:
          - duplicate_record
        status:
          type: integer
          title: Status
          description: Always `409`.
          default: 409
          examples:
          - 409
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
          description: The ID of the conflicting resource.
          examples:
          - cdc70639-cb9c-4222-a73f-b8ce39f7821b
      additionalProperties: false
      type: object
      title: Error409
    PazeDeliveryContactDetails:
      properties:
        contactFullName:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactfullname
          description: Consumer-provided name of the contact person.
          examples:
          - Team Integrations
        contactPhoneNumber:
          anyOf:
          - $ref: '#/components/schemas/PazeMobileNumber'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - contactFullName
      - contactPhoneNumber
      title: PazeDeliveryContactDetails
    Error400:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `bad_request`
          default: bad_request
          examples:
          - bad_request
        status:
          type: integer
          title: Status
          description: Always `400`.
          default: 400
          examples:
          - 400
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error400
    PazeClient:
      properties:
        id:
          type: string
