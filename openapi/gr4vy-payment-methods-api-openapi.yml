openapi: 3.2.0
info:
  title: Gr4vy Payment Methods API
  version: '1.0'
  description: 'Operations tagged Payment Methods across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Payment Methods
  description: 'In Gr4vy, a payment method represents a way in which a payment can be

    processed, for example a card, a PayPal account, or a bank account.


    The payment method API can be used to:


    * List all the available payment methods

    * Filter the available payment method for a buyer in a specific currency

    and country.

    * Store (also known as vault) a payment method for a buyer.

    * Fetch all previously stored payment methods for a buyer.'
paths:
  /buyers/payment-methods:
    get:
      operationId: list-buyer-payment-methods
      summary: List payment methods for buyer
      description: 'Returns a list of stored payment methods for a buyer in a summarized format.

        Only payment methods that are compatible with at least one active payment

        service in that region are shown.'
      tags:
      - Payment Methods
      parameters:
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: buyer_id
        description: 'Filters the results to only the items for which the `buyer` has an

          `id` that matches this value.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: buyer_external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that matches this value.'
      - schema:
          type: string
          example: US
        in: query
        name: country
        description: 'Filters the results to only the items which support this country code. A

          country is formatted as 2-letter ISO country code.'
      - schema:
          type: string
          example: USD
        in: query
        name: currency
        description: 'Filters the results to only the items which support this currency code. A

          currency is formatted as 3-letter ISO currency code.'
      - schema:
          type: string
          description: Set of fields to order results.
          example: last_used_at
          enum:
          - last_used_at
          - usage_count
          - cit_last_used_at
          - cit_usage_count
        in: query
        name: sort_by
        description: Used by the payment method filter to sort the results by an specific usage field.
      - schema:
          type: string
          description: Ordering direction for the results.
          example: desc
          enum:
          - asc
          - desc
          default: desc
        in: query
        name: order_by
        description: Used to show the results ascending or descending order.
      responses:
        '200':
          description: 'Returns a list of available payment methods for a buyer, filtered by the

            given currency and country code.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethods--Tokenized'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-methods:
    get:
      operationId: list-payment-methods
      summary: List payment methods
      description: Returns a list of stored payment methods.
      tags:
      - Payment Methods
      parameters:
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: buyer_id
        description: 'Filters the results to only the items for which the `buyer` has an

          `id` that matches this value.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: buyer_external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that matches this value.'
      - schema:
          type: array
          example:
          - succeeded
          - processing
          items:
            type: string
            enum:
            - processing
            - buyer_approval_required
            - succeeded
            - failed
        in: query
        name: status
        description: 'Filters the results to only the payment methods for which the `status`

          matches with any of the provided status values.'
      - schema:
          type: string
          example: xid123
        in: query
        name: external_identifier
        description: 'Filters the results to only the items for which the resource has an

          `external_identifier` that matches this value.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      responses:
        '200':
          description: Returns a list of payment methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethods'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: new-payment-method
      summary: New payment method
      description: 'Stores and vaults a new payment method.


        Vaulting a card only stores its information but doesn''t validate it against any

        PSP, so ephemeral data like the security code, often referred to as the CVV or

        CVD, won''t be used. In order to validate the card data, a CIT (Customer Initiated

        Transaction) must be done, even if it''s a zero-value one.'
      tags:
      - Payment Methods
      requestBody:
        content:
          application/json:
            schema:
              x-model-name: PaymentMethodRequest
              oneOf:
              - $ref: '#/components/schemas/CardRequest'
              - $ref: '#/components/schemas/RedirectRequest'
              - $ref: '#/components/schemas/CheckoutSessionRequest'
      responses:
        '201':
          description: Returns the created payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '409':
          description: Returns an error if duplicate resource has been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409DuplicateRecord'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-methods/{payment_method_id}:
    parameters:
    - schema:
        type: string
        example: 46973e9d-88a7-44a6-abfe-be4ff0134ff4
        format: uuid
      name: payment_method_id
      in: path
      required: true
      description: The ID of the payment method.
    get:
      operationId: get-payment-method
      summary: Get payment method
      description: Gets the details for a stored payment method.
      tags:
      - Payment Methods
      responses:
        '200':
          description: Returns a payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-payment-method
      summary: Delete payment method
      description: Removes a stored payment method.
      tags:
      - Payment Methods
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      tags:
      - Payment Methods
      summary: Update payment method
      description: Update the details of a stored payment method.
      operationId: update_payment_method
      security:
      - OAuth2PasswordBearer:
        - payment-methods.write
      parameters:
      - name: payment_method_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the payment method
          examples:
          - ef9496d8-53a5-4aad-8ca2-00eb68334389
          title: Payment Method Id
        description: The ID of the payment method
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod_2'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: update
      x-speakeasy-group: payment-methods
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    PaymentMethods:
      title: Payment Methods
      type: object
      description: A list of stored payment methods.
      x-tags:
      - Payment Methods
      properties:
        items:
          type: array
          description: A list of stored payment methods.
          items:
            $ref: '#/components/schemas/PaymentMethod'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
    PaymentMethodDetailsCard:
      title: Card
      description: A credit or debit card payment method.
      type: object
      x-tags:
      - Payment Methods
      properties:
        bin:
          type: string
          description: The first 6 digits of the full card number (the BIN).
          example: '412345'
        card_type:
          description: The type of card, one of `credit`, `debit` or `prepaid`.
          example: credit
          type: string
          enum:
          - credit
          - debit
          - prepaid
        card_issuer_name:
          type: string
          description: The name of the card issuer.
          example: Bank
    CardRequest:
      title: Card
      type: object
      description: Details to register a new card payment method.
      x-tags:
      - Request Bodies
      required:
      - method
      - number
      - expiration_date
      properties:
        method:
          type: string
          description: '`card`.'
          example: card
          enum:
          - card
        number:
          type: string
          minLength: 13
          maxLength: 19
          example: '4111111111111111'
          pattern: ^[0-9]{13,19}$
          description: 'The 13-19 digit number for this card as it can be found on the

            front of the card.'
        expiration_date:
          type: string
          description: The expiration date of the card, formatted `MM/YY`.
          example: 11/25
          pattern: ^\d{2}/\d{2}$
          minLength: 5
          maxLength: 5
        security_code:
          type:
          - string
          - 'null'
          description: 'The 3 or 4 digit security code often found on the card. This often

            referred to as the CVV or CVD.


            The security code can only be set if the stored payment method

            represents a card.'
          pattern: ^\d{3,4}$
          minLength: 3
          maxLength: 4
          example: '123'
        external_identifier:
          type:
          - string
          - 'null'
          description: An external identifier that can be used to match the card against your own records.
          example: card-323444
        buyer_id:
          type: string
          format: uuid
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: 'The ID of the buyer to associate this payment method to. If this field is

            provided then the `buyer_external_identifier` field needs to be unset.'
        buyer_external_identifier:
          type: string
          description: 'The `external_identifier` of the buyer to associate this payment method

            to. If this field is provided then the `buyer_id` field

            needs to be unset.'
          example: user-789123
        redirect_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'The redirect URL to redirect a buyer to after they have authorized their

            transaction or payment method. This only applies to payment methods that

            require buyer approval.'
          example: https://example.com/callback
    RedirectRequest:
      title: Redirect
      type: object
      description: Details to register a new redirect payment method.
      x-tags:
      - Request Bodies
      required:
      - method
      - redirect_url
      - country
      - currency
      properties:
        method:
          description: 'The method to use, this can be any of the methods that

            support redirect requests.'
          type: string
          example: paypal
          enum:
          - affirm
          - afterpay
          - alipay
          - alipayhk
          - bacs
          - bancontact
          - banked
          - becs
          - bitpay
          - boleto
          - boost
          - cashapp
          - chaseorbital
          - checkout-session
          - clearpay
          - dana
          - dcb
          - dlocal
          - ebanx
          - efecty
          - eps
          - everydaypay
          - gcash
          - gem
          - gemds
          - gift-card
          - giropay
          - givingblock
          - gocardless
          - gopay
          - grabpay
          - ideal
          - kakaopay
          - kcp
          - klarna
          - latitude
          - latitudeds
          - laybuy
          - linepay
          - linkaja
          - maybankqrpay
          - mercadopago
          - multibanco
          - multipago
          - netbanking
          - network-token
          - oney_10x
          - oney_12x
          - oney_3x
          - oney_4x
          - oney_6x
          - ovo
          - oxxo
          - payid
          - paymaya
          - paypal
          - paypalpaylater
          - payto
          - pix
          - pse
          - rabbitlinepay
          - razorpay
          - scalapay
          - sepa
          - shopeepay
          - singteldash
          - smartpay
          - sofort
          - spei
          - stripedd
          - thaiqr
          - touchngo
          - truemoney
          - trustly
          - trustlyeurope
          - upi
          - venmo
          - vipps
          - waave
          - webpay
          - wechat
          - zippay
        redirect_url:
          type: string
          format: uri
          description: 'The redirect URL to redirect a buyer to after they have authorized their

            transaction.'
          example: https://example.com/callback
        currency:
          type: string
          example: USD
          description: 'The ISO-4217 currency code to use this payment method for. This is

            used to select the payment service to use.'
        country:
          type: string
          example: US
          description: 'The 2-letter ISO code of the country to use this payment method for.

            This is used to select the payment service to use.'
        external_identifier:
          type:
          - string
          - 'null'
          description: An external identifier that can be used to match the account against your own records.
          example: account-23423423
        buyer_id:
          type: string
          format: uuid
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: 'The ID of the buyer to associate this payment method to. If this field is

            provided then the `buyer_external_identifier` field needs to be unset.'
        buyer_external_identifier:
          type: string
          description: 'The `external_identifier` of the buyer to associate this payment method

            to. If this field is provided then the `buyer_id` field

            needs to be unset.'
          example: user-789123
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PaymentMethods--Tokenized:
      title: Payment Methods (Summary)
      type: object
      description: A list of stored payment methods in summarized format.
      x-tags:
      - Payment Methods
      properties:
        items:
          type: array
          description: A list of stored payment methods in summarized format.
          items:
            $ref: '#/components/schemas/PaymentMethod--Tokenized'
    Error409DuplicateRecord:
      title: Duplicate Record Error
      type: object
      description: Duplicate Record Error (HTTP 409).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`duplicate_record`.'
          example: duplicate_record
          enum:
          - duplicate_record
        status:
          type: integer
          description: '`409`.'
          example: 409
          enum:
          - 409
        message:
          type: string
          description: Further details on the field that triggered the error.
          example: A duplicate record exists with this external_identifier value
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PaymentMethod:
      title: Payment method
      description: A generic payment method.
      type: object
      x-tags:
      - Payment Methods
      properties:
        type:
          type: string
          description: '`payment-method`.'
          example: payment-method
          enum:
          - payment-method
        id:
          type: string
          description: The unique ID of the payment method.
          format: uuid
          example: 77a76f7e-d2de-4bbc-ada9-d6a0015e6bd5
        additional_schemes:
          description: Additional schemes of the card. Only applies to card payment methods.
          items:
            type: string
            example: visa
            enum:
            - accel
            - amex
            - bancontact
            - carte-bancaire
            - cirrus
            - culiance
            - dankort
            - diners-club
            - discover
            - eftpos-australia
            - elo
            - hipercard
            - jcb
            - maestro
            - mastercard
            - mir
            - nyce
            - other
            - pulse
            - rupay
            - star
            - uatp
            - unionpay
            - visa
            - null
          type:
          - array
          - 'null'
        approval_target:
          type:
          - string
          - 'null'
          example: any
          description: The browser target that an approval URL must be opened in. If `any` or `null`, then there is no specific requirement.
          enum:
          - any
          - new_window
        approval_url:
          description: The optional URL that the buyer needs to be redirected to to further authorize their payment.
          example: https://api.example.app.gr4vy.com/payment-methods/ffc88ec9-e1ee-45ba-993d-b5902c3b2a8c/approve
          format: uri
          type:
          - string
          - 'null'
        buyer:
          allOf:
          - $ref: '#/components/schemas/Buyer'
          description: The optional buyer for which this payment method has been stored.
        country:
          description: 'The 2-letter ISO code of the country this payment method can

            be used for. If this value is `null` the payment method may be

            used in multiple countries.'
          example: US
          type:
          - string
          - 'null'
        created_at:
          description: 'The date and time when this payment method was first created in our

            system.'
          example: '2013-07-16T19:23:00.000+00:00'
          format: date-time
          type: string
        currency:
          description: 'The ISO-4217 currency code that this payment method can be

            used for. If this value is `null` the payment method may be

            used for multiple currencies.'
          example: USD
          type:
          - string
          - 'null'
        details:
          $ref: '#/components/schemas/PaymentMethodDetailsCard'
        expiration_date:
          description: The expiration date for the payment method.
          example: 07/24
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}/\d{2}$
          type:
          - string
          - 'null'
        external_identifier:
          description: 'An external identifier that can be used to match the payment method

            against your own records.'
          example: user-789123
          type:
          - string
