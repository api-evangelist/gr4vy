openapi: 3.2.0
info:
  title: Gr4vy Metrics Explorer API
  version: 1.1.0-beta
  contact:
    name: Gr4vy Support
    email: code@gr4vy.com
    url: https://gr4vy.com
  termsOfService: https://gr4vy.com
  license:
    name: MIT
    url: https://raw.githubusercontent.com/gr4vy/gr4vy-openapi/main/LICENSE
  description: 'Welcome to the Gr4vy API reference documentation.

    Our API is still very much a work in product and subject to change.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
security:
- bearerAuth: []
tags:
- name: Metrics Explorer
  description: Endpoints to retrieve the data used for the Metrics Explorer.
  x-internal: true
paths:
  /metrics-explorer/{source}/metrics/{metric}/modules/{module}:
    parameters:
    - schema:
        type: string
        enum:
        - authentication
        - authorization
        example: authorization
      in: path
      name: source
      description: 'The set of transactions used as a source to calculate metrics.

        The source names are related to the Insights tab in the dashboard.'
      required: true
    - schema:
        type: string
        enum:
        - auth_rate
        - transactions
        - volume
        example: transactions
      in: path
      name: metric
      description: The metric to be calculated.
      required: true
    - schema:
        type: string
        enum:
        - authentication_outcome
        - authorized
        - country
        - currency
        - error_code
        - instrument_type
        - is_subsequent_payment
        - liability_shifted
        - merchant_initiated
        - metadata
        - method
        - payment_method_bin
        - payment_method_card_issuer_name
        - payment_method_card_type
        - payment_method_country
        - payment_method_scheme
        - payment_service
        - payment_source
        - raw_response_code
        - rule_route_transaction
        - rule_skip_3ds
        - three_d_secure_auth_resp
        - three_d_secure_eci
        - three_d_secure_method
        example: payment_service
      in: path
      name: module
      description: The module to be calculated.
      required: true
    get:
      operationId: get-metrics-explorer-module
      summary: Get Metrics Explorer module data
      description: 'Retrieves the data for a module in the Metrics Explorer.

        **Important:** The currency filter query parameter is **required** when the `metric` is set to `volume`.'
      tags:
      - Metrics Explorer
      x-internal: true
      parameters:
      - schema:
          type: string
          enum:
          - 1-day
          - 7-days
          - 30-days
          example: 7-days
        in: query
        name: period
        description: 'Filters the results to the set of data aggregated over the

          duration of the specified period.'
        required: true
      - schema:
          type: string
          enum:
          - succeeded
          - failed
          - abandoned
          example: abandoned
        in: query
        name: authentication_outcome
        description: 'Filters the results to only include transactions whose authentication process ended with the specified outcome.

          This parameter also accepts the null character `\0` to include transactions that didn''t undergo an authentication process.'
        required: false
      - schema:
          type: string
          enum:
          - '0'
          - '1'
          example: '1'
        in: query
        name: authorized
        description: Filters the results to only include transactions that were authorized (1) or declined (0).
        required: false
      - schema:
          type: string
          example: GB
        in: query
        name: country
        description: 'Filters the results to only include transactions that were processed in the specified country. The country code should be in the ISO 3166-1 two letter format.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: GBP
        in: query
        name: currency
        description: Filters the results to only include transactions that were processed in the specified currency. The currency code should be in the ISO 4217 format. <br/>**Important:** This query parameter is **required** when the `metric` is set to `volume`.
        required: false
      - schema:
          type: string
          example: invalid_credentials
        in: query
        name: error_code
        description: 'Filters the results to only include transactions that failed with the specified error code. The error code is a string that describes the reason for the failure.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          description: 'The name of the instrument used to process the transaction.

            '
          enum:
          - applepay
          - card_token
          - googlepay
          - network_token
          - pan
          - redirect
          - redirect_token
          example: network_token
        in: query
        name: instrument_type
        description: 'Filters the results to only include transactions that used the specified instrument type.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          enum:
          - '0'
          - '1'
          example: '1'
        in: query
        name: is_subsequent_payment
        description: 'Filters the results to only include transactions that are subsequent payments. A subsequent payment is a payment that is made after an initial payment, typically in a subscription or recurring payment scenario.

          The value should be either "0" (false) or "1" (true).'
        required: false
      - schema:
          type: string
          enum:
          - '0'
          - '1'
          example: '1'
        in: query
        name: liability_shifted
        description: Filters the results to only include transactions where liability was shifted (1) or was not shifted (0).
        required: false
      - schema:
          type: string
          enum:
          - '0'
          - '1'
          example: '1'
        in: query
        name: merchant_initiated
        description: 'Filters the results to only include transactions that were initiated by the merchant.

          The value should be either "0" (false) or "1" (true).'
        required: false
      - schema:
          type: string
          example: '{"key": "value"}'
        in: query
        name: metadata
        description: Filters the results to only include transactions that have the specified metadata. The metadata should be in JSON format and contain a single key-value pair.
        required: false
      - schema:
          type: string
          example: card
          enum:
          - affirm
          - afterpay
          - alipay
          - alipayhk
          - applepay
          - bacs
          - bancontact
          - banked
          - becs
          - bitpay
          - boleto
          - boost
          - card
          - cashapp
          - chaseorbital
          - checkout-session
          - clearpay
          - click-to-pay
          - dana
          - dcb
          - dlocal
