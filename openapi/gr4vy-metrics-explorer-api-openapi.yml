                $ref: '#/components/schemas/MetricsExplorerTotals'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
components:
  schemas:
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    MetricsExplorerModule:
      title: Metrics Explorer Module
      type: object
      description: Data for a module in the Metrics Explorer.
      x-tags:
      - Metrics Explorer
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource.
          enum:
          - metrics-explorer.module
          example: metrics-explorer.module
        key:
          type: string
          description: The key for the module data entry. <br/>This key is the value that should be used as a filter when calling the endpoints. For example, for module `payment_service`, the key will be the id of the payment service (UUID), so it should be used to filter other modules using the `payment_service_id` filter.
          example: d8c3d939-d75d-4598-81c7-a13f8238e624
        display_name:
          type: string
          description: The display name for the module data entry.
          example: Stripe (US)
        value:
          description: The value associated with the key. The type depends on the metric.
          oneOf:
          - type: integer
            description: This type is used for "volume" and "transactions" metrics.
            example: 100
          - type: number
            description: This type is used for "authorization rate" metric.
            format: decimal
            example: 0.5
          example: 100
        metadata:
          type:
          - object
          - 'null'
          description: A dictionary containing metadata as key-value pairs.
          additionalProperties:
            type: string
          example:
            payment_service_definition_id: stripe-card
    MetricsExplorerTotals:
      title: Metrics Explorer Totals
      type: object
      description: Data for totals in the Metrics Explorer.
      x-tags:
      - Metrics Explorer
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource.
          example: metrics-explorer.totals
          enum:
          - metrics-explorer.totals
        series:
          type: object
          description: Contains two series of data points used to build the line chart. Each series contains aggregations of data created over the duration of the specified period (e.g. `7-days`). The `previous` series contains aggregations from the period immediately preceding the `current` series.
          properties:
            current:
              type: array
              description: Metrics for the transactions created during the current period aggregated by hour or day. The meaning of the values depends on the metric used to call the endpoint. "volume" and "transactions" metrics are represented as integers, while "authorization rate" metric is represented as decimal numbers. `null`s may be returned when there is no data for authorization rate to indicate that the metric is not applicable for the given time period.
              items:
                type: object
                properties:
                  first_interval:
                    type: string
                    description: The date and time of the first data point, represented with an ISO 8601 interval value indicating whether it is aggregated by one hour (PT1H) or one day (P1D) periods.
                    example: 2025-03-25T00:00:00Z/P1D
                  values:
                    type: array
                    description: The values associated with the metric for the current period. "volume" and "transactions" metrics are represented as integers, while "authorization rate" metric is represented as decimal numbers.
                    items:
                      oneOf:
                      - type:
                        - integer
                        - 'null'
                        description: The values associated with the metric. This type is used for "volume" and "transactions" metrics.
                        example: 10
                      - type:
                        - number
                        - 'null'
                        format: decimal
                        description: The value associated with the key. This type is used for "authorization rate" metric.
                        example: 0.5
                    example:
                    - 0.9
                    - 0.99
                    - 0.85
            previous:
              type:
              - array
              - 'null'
              description: Metrics for the transactions created during the period immediately preceding the current period aggregated by hour or day. The meaning of the values depends on the metric used to call the endpoint. "volume" and "transactions" metrics are represented as integers, while "authorization rate" metric is represented as decimal numbers. `null`s may be returned when there is no data for authorization rate to indicate that the metric is not applicable for the given time period.
              items:
                type: object
                properties:
                  first_interval:
                    type: string
                    description: The date and time of the first data point, represented with an ISO 8601 interval value indicating whether it is aggregated by one hour (PT1H) or one day (P1D) periods.
                    example: 2025-03-25T00:00:00Z/P1D
                  values:
                    type: array
                    description: The values associated with the metric for the previous period. "volume" and "transactions" metrics are represented as integers, while "authorization rate" metric is represented as decimal numbers.
                    items:
                      oneOf:
                      - type:
                        - integer
                        - 'null'
                        description: The value associated with the key. This type is used for "volume" and "transactions" metrics.
                        example: 10
                      - type:
                        - number
                        - 'null'
                        description: The value associated with the key. This type is used for "authorization rate" metric.
                        format: decimal
                        example: 0.5
                    example:
                    - 0.9
                    - 0.99
                    - 0.85
          example:
            current:
            - first_interval: 2025-03-25T00:00:00Z/PT1H
              values:
              - 0.9
              - 0.99
              - 0.85
            previous:
            - first_interval: 2025-03-18T00:00:00Z/PT1H
              values:
              - 0.9
              - 0.99
              - 0.85
        summary:
          type: object
          description: A summary of the totals data.
          properties:
            current:
              type: object
              description: The total value for the current period. <br/>For `volume` and `transactions` metrics, the value is the sum of all values in the `current` series. <br/>For `auth_rate` metric, the value is the count of authorized transactions over the count of processed transactions for the current period.
              properties:
                value:
                  oneOf:
                  - type:
                    - integer
                    - 'null'
                    description: This type is used for "volume" and "transactions" metrics.
                  - type:
                    - number
                    - 'null'
                    description: This type is used for "authorization rate" metric.
                    format: decimal
            previous:
              type:
              - object
              - 'null'
              description: The total value for the previous period. <br/>For `volume` and `transactions` metrics, the value is the sum of all values in the `previous` series. <br/>For `auth_rate` metric, the value is the count of authorized transactions over the count of processed transactions for the previous period.
              properties:
                value:
                  oneOf:
                  - type:
                    - integer
                    - 'null'
                    description: This type is used for "volume" and "transactions" metrics.
                  - type:
                    - number
                    - 'null'
                    description: This type is used for "authorization rate" metric.
                    format: decimal
            delta:
              type:
              - number
              - 'null'
              description: The difference between the current and previous values. Positive values indicate an increase, while negative values indicate a decrease. <br/>For `volume` and `transactions` metrics, the value is the percentage change between the current and previous values, however, for `authorization rate` metric, the value is the absolute difference between the current and previous values.
              format: decimal
              example: 0.5
          example:
            current:
              value: 90.5
            previous:
              value: 80.5
            delta: 10
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
