          - multibanco
          - multipago
          - netbanking
          - network-token
          - oney_3x
          - oney_4x
          - oney_6x
          - oney_10x
          - oney_12x
          - ovo
          - oxxo
          - payid
          - paymaya
          - paypal
          - paypalpaylater
          - payto
          - venmo
          - pix
          - pse
          - rabbitlinepay
          - razorpay
          - scalapay
          - sepa
          - shopeepay
          - singteldash
          - smartpay
          - sofort
          - spei
          - stripedd
          - thaiqr
          - touchngo
          - truemoney
          - trustly
          - trustlyeurope
          - upi
          - vipps
          - waave
          - webpay
          - wechat
          - zippay
        in: query
        name: method
        description: 'Filters the results to only include transactions that were processed using the specified payment method.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: '123456'
        in: query
        name: payment_method_bin
        description: 'Filters the results to only include transactions that used the specified payment method bin.

          The payment method bin is the first 6 digits of the card number.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: Barclays
        in: query
        name: payment_method_card_issuer_name
        description: 'Filters the results to only include transactions that were processed with the specified card issuer name.

          The card issuer name is the name of the bank or financial institution that issued the card used for the transaction.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: credit
          enum:
          - credit
          - debit
          - prepaid
        in: query
        name: payment_method_card_type
        description: 'Filters the results to only include transactions that used the specified card type.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: GB
        in: query
        name: payment_method_country
        description: 'Filters the results to only include transactions that were processed with a card issued in the specified country.

          The country code should be in the ISO 3166-1 two letter format.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: visa
          enum:
          - accel
          - amex
          - bancontact
          - carte-bancaire
          - cirrus
          - culiance
          - dankort
          - diners-club
          - discover
          - eftpos-australia
          - elo
          - hipercard
          - jcb
          - maestro
          - mastercard
          - mir
          - nyce
          - other
          - pulse
          - rupay
          - star
          - uatp
          - unionpay
          - visa
          - null
        in: query
        name: payment_method_scheme
        description: 'Filters the results to only include transactions that were processed with the specified payment method scheme.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: 06319aec-2c0f-4c7b-8af1-047ca037fc021
        in: query
        name: payment_service_id
        description: 'Filters the results to only include transactions that were processed with the specified payment service ID.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: recurring
          enum:
          - ecommerce
          - moto
          - recurring
          - installment
          - card_on_file
        in: query
        name: payment_source
        description: Filters the results to only include transactions that were processed with the specified payment source.
        required: false
      - schema:
          type: string
          example: COMPLETED
        in: query
        name: raw_response_code
        description: 'Filters the results to only include transactions that received the specified raw response code from the payment service.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: c2fefd1b-6ed0-4038-bbc8-48ea2fb7e9f7
        in: query
        name: rule_id_route_transaction
        description: 'Filters the results to only include transactions that were processed with the specified routing rule. The rule ID should be in UUID format.

          This parameter also accepts the null character `\0` to include transactions that were not processed by any routing rule.'
        required: false
      - schema:
          type: string
          example: c2fefd1b-6ed0-4038-bbc8-48ea2fb7e9f7
        in: query
        name: rule_id_skip_3ds
        description: 'Filters the results to only include transactions that were processed with the specified 3DS rule. The rule ID should be in UUID format.

          This parameter also accepts the null character `\0` to include transactions that were not processed by any 3DS rule.'
        required: false
      - schema:
          type: string
          example: Y
        in: query
        name: three_d_secure_auth_resp
        description: 'Filters the results to only include transactions that received the specified response during 3DS authentication.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          example: '05'
        in: query
        name: three_d_secure_eci
        description: 'Filters the results to only include transactions that received the specified ECI during 3DS authentication.

          This parameter also accepts the null character `\0` to include transactions that have a null for this field.'
        required: false
      - schema:
          type: string
          enum:
          - challenge
          - frictionless
          example: frictionless
        in: query
        name: three_d_secure_method
        description: 'Filters the results to only include transactions that underwent 3DS authentication with the specified method.

          This parameter also accepts the null character `\0` to include transactions that didn''t undergo 3DS authentication.'
        required: false
      responses:
        '200':
          description: Returns the module's data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricsExplorerModule'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
