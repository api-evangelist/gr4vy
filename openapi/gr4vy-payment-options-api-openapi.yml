openapi: 3.2.0
info:
  title: Gr4vy Payment Options API
  version: '1.0'
  description: 'Operations tagged Payment Options across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Payment Options
  description: 'In Gr4vy, a payment option represents a list of methods (card, PayPal,

    etc) that are available for a given locale.


    The payment options API can be used to:


    * Determine what types of payments can be processed in a specific locale.

    * Display a list options to a buyer to choose from.'
paths:
  /payment-options:
    get:
      operationId: list-payment-options
      summary: List payment options
      description: 'Returns a list of available payment method options for the combination of

        amount, currency, country and metadata.


        If the amount is zero, payment options which do not support zero amounts,

        will be omitted in the response.


        Checkout flow rules are used to limit these result.'
      tags:
      - Payment Options
      parameters:
      - schema:
          type: string
          example: US
        in: query
        name: country
        description: 'Filters the results to only the items which support this country code. A

          country is formatted as 2-letter ISO country code.'
      - schema:
          type: string
          example: USD
        in: query
        name: currency
        description: 'Filters the results to only the items which support this currency code. A

          currency is formatted as 3-letter ISO currency code.'
      - schema:
          type: integer
          example: 500
        in: query
        name: amount
        description: Used by the Flow engine to filter the results based on the transaction amount.
      - schema:
          type: string
          example: '{"restricted_items": "True"}'
        in: query
        name: metadata
        description: 'Used by the Flow engine to filter available options based on various

          client-defined parameters. If present, this must be a string representing

          a valid JSON dictionary.'
      - schema:
          type: string
          example: en-US
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          default: en
        in: query
        name: locale
        description: 'An ISO 639-1 Language Code and optional ISO 3166 Country Code. This locale

          determines the language for the labels returned for every payment option.'
      responses:
        '200':
          description: 'Returns a list of available payment options for the given query

            parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOptions'
        '400':
          description: Returns an error if  any of the query parameters are not recognized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: post-list-payment-options
      summary: List payment options with POST
      description: 'Returns a list of available payment method options for the combination of

        amount, currency, country, metadata and list of cart items.


        If the amount is zero, payment options which do not support zero amounts,

        will be omitted in the response.


        Checkout flow rules are used to limit these result.'
      tags:
      - Payment Options
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOptionsRequest'
      responses:
        '200':
          description: 'Returns a list of available payment options for the given query

            parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOptions'
        '400':
          description: 'Returns an error if the request was badly formatted or missing required

            fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    CartItem:
      title: Cart Item
      type: object
      description: 'A cart item that represents a single cart line item for a transaction.

        Note that some optional properties are required for certain payment

        service providers. If no value is set for these properties, we will use

        their default value.


        If the total due to be paid for the item is required by the payment service

        provider, generally referred to as the "total amount", the formula below

        will usually be used to calculate this amount:


        `(unit_amount * quantity) - discount_amount + tax_amount`


        It''s highly recommended that the total amount to pay for all items

        should match the transaction''s amount to reduce the risk of the

        transaction being declined by the payment service provider.'
      required:
      - name
      - quantity
      - unit_amount
      properties:
        name:
          type: string
          description: 'The name of the cart item. The value you set for this property may

            be truncated if the maximum length accepted by a payment service

            provider is less than 255 characters.'
          example: GoPro HERO9 Camcorder
          maxLength: 255
        quantity:
          type: integer
          description: 'The quantity of this item in the cart. This value cannot be negative

            or zero.'
          example: 1
          minimum: 1
          maximum: 99999999
        unit_amount:
          type: integer
          description: 'The amount for an individual item represented as a monetary amount

            in the smallest currency unit for the given currency, for example

            `1299` USD cents represents `$12.99`.

            The amount sent through to the payment processor as unitary amount

            will be calculated to include the discount and tax values sent

            as part of this cart item.'
          example: 37999
          minimum: 0
          maximum: 99999999
        discount_amount:
          type:
          - integer
          - 'null'
          description: 'The amount discounted for this item represented as a monetary amount

            in the smallest currency unit for the given currency, for example `1299`

            USD cents represents `$12.99`.


            Please note that this amount is for the total of the cart item and not

            for an individual item. For example, if the quantity is 5, this value

            should be the total discount amount for 5 of the cart item.


            You might see unexpected failed transactions if the `discount_amount` can

            not be equally divided by the `quantity` value. This is due to the fact

            that some payment services require this amount to be specified per unit.


            In this situation we recommend splitting this item into separate items,

            each with their own specific discount.'
          example: 0
          minimum: 0
          maximum: 99999999
          default: 0
        tax_amount:
          type:
          - integer
          - 'null'
          description: 'The tax amount for this item represented as a monetary amount

            in the smallest currency unit for the given currency, for example `1299`

            USD cents represents `$12.99`.


            Please not that this amount is for the total of the cart item and not

            for an individual item. For example, if the quantity is 5, this value

            should be the total tax amount for 5 of the cart item.


            You might see unexpected failed transactions if the `tax_amount` can

            not be equally divided by the `quantity` value. This is due to the fact

            that some payment services require this amount to be specified per unit.


            In this situation we recommend splitting this item into separate items,

            each with their own specific tax amount.'
          example: 0
          minimum: 0
          maximum: 99999999
          default: 0
        external_identifier:
          type:
          - string
          - 'null'
          example: item-789123
          description: An external identifier for the cart item. This can be set to any value and is not sent to the payment service.
          maxLength: 200
        sku:
          type:
          - string
          - 'null'
          example: sku-789123
          description: The SKU for the item.
          maxLength: 200
        product_url:
          type:
          - string
          - 'null'
          format: url
          example: https://example.com/items/gopro
          description: The product URL for the item.
          maxLength: 2083
        image_url:
          type:
          - string
          - 'null'
          format: url
          example: https://example.com/images/items/gopro.png
          description: The URL for the image of the item.
          maxLength: 2083
        categories:
          type:
          - array
          - 'null'
          description: 'A list of strings containing product categories for the item.

            Max length per item: 50.'
          items:
            type: string
            maxLength: 50
          maxItems: 100
        product_type:
          type:
          - string
          - 'null'
          description: The product type of the cart item.
          example: physical
          enum:
          - physical
          - discount
          - shipping_fee
          - sales_tax
          - digital
          - gift_card
          - store_credit
          - surcharge
          - null
        seller_country:
          type:
          - string
          - 'null'
          description: 'The country code of the seller of the item. For some connectors, if this country code

            does not match the `country` then the transaction will be marked to Visa as a foreign

            seller transaction to meet Marketplace reporting requirements.'
          example: US
          pattern: ^[A-Z]{2}$
    PaymentOptionApprovalUI:
      title: Payment Option Approval UI
      type: object
      description: Configuration for the approval interface that should be shown to the buyer.
      properties:
        height:
          type: string
          description: Height of the approval interface in either pixels or view height (vh).
          example: 300px
        width:
          type: string
          description: Width of the approval interface in either pixels or view width (vw).
          example: 300px
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    PaymentOption:
      title: Payment option
      type: object
      description: An available payment option for a locale.
      x-tags:
      - Payment Option
      properties:
        type:
          type: string
          description: '`payment-option`.'
          example: payment-option
          enum:
          - payment-option
        method:
          description: The type of payment method that is available.
          type: string
          example: card
          enum:
          - affirm
          - afterpay
          - alipay
          - alipayhk
          - applepay
          - bacs
          - bancontact
          - banked
          - becs
          - bitpay
          - boleto
          - boost
          - card
          - cashapp
          - chaseorbital
          - checkout-session
          - clearpay
          - click-to-pay
          - dana
          - dcb
          - dlocal
          - ebanx
          - efecty
          - eps
          - everydaypay
          - gcash
          - gem
          - gemds
          - gift-card
          - giropay
          - givingblock
          - gocardless
          - googlepay
          - googlepay_pan_only
          - gopay
          - grabpay
          - id
          - ideal
          - kakaopay
          - kcp
          - klarna
          - latitude
          - latitudeds
          - laybuy
          - linepay
          - linkaja
          - maybankqrpay
          - mercadopago
          - multibanco
          - multipago
          - netbanking
          - network-token
          - oney_3x
          - oney_4x
          - oney_6x
          - oney_10x
          - oney_12x
          - ovo
          - oxxo
          - payid
          - paymaya
          - paypal
          - paypalpaylater
          - payto
          - venmo
          - pix
          - pse
          - rabbitlinepay
          - razorpay
          - scalapay
          - sepa
          - shopeepay
          - singteldash
          - smartpay
          - sofort
          - spei
          - stripedd
          - thaiqr
          - touchngo
          - truemoney
          - trustly
          - trustlyeurope
          - upi
          - vipps
          - waave
          - webpay
          - wechat
          - zippay
        icon_url:
          type:
          - string
          - 'null'
          description: An icon to display for the payment option.
          example: https://cdn.gr4vy.app/card.svg
        mode:
          description: The mode to use with this payment option.
          type: string
          example: card
          enum:
          - card
          - redirect
          - applepay
          - googlepay
          - click-to-pay
          - checkout-session
        label:
          type: string
          description: 'A label that describes this payment option. This label is returned in the

            language defined by the `locale` query parameter. The label can be used

            to display a list of payment options to the buyer in their language.'
          example: Pay by Card
        can_store_payment_method:
          type: boolean
          description: A flag to indicate if storing the payment method is supported.
        can_delay_capture:
          type: boolean
          description: A flag to indicate if delayed capture is supported.
        context:
          type: object
          description: 'Additional context specific to the payment option.

            This is currently only returned for Apple Pay and Google Pay.'
          properties:
            gateway:
              type: string
              description: Gateway used for Google Pay payments.
            gateway_merchant_id:
              type: string
              description: Gateway merchant identifier used for Google Pay payments.
            merchant_name:
              type: string
              description: 'Display name of the merchant as registered with the digital wallet

                provider.'
            supported_schemes:
              type: array
              description: Card schemes supported by the digital wallet provider.
              items:
                $ref: '#/components/schemas/PaymentOptionCardScheme'
            approval_ui:
              $ref: '#/components/schemas/PaymentOptionApprovalUI'
            required_fields:
              $ref: '#/components/schemas/RequiredFields'
    RequiredFields:
      title: Required Fields
      type: object
      description: The fields that are required to process a transaction for this payment option.
      properties:
        first_name:
          type: boolean
          description: The first (given) name of the buyer.
          readOnly: true
        last_name:
          type: boolean
          description: The last (family) name of the buyer.
          readOnly: true
        email_address:
          type: boolean
          description: The email address of the buyer.
          readOnly: true
        phone_number:
          type: boolean
          description: The phone number of the buyer.
          readOnly: true
        address:
          type: object
          description: The billing address of the buyer.
          properties:
            city:
              type: boolean
              description: The city for the billing address.
              readOnly: true
            country:
              type: boolean
              description: The country for the billing address.
              readOnly: true
            postal_code:
              type: boolean
              description: The postal code or zip code for the billing address.
              readOnly: true
            state:
              type: boolean
              description: The state, county, or province for the billing address.
              readOnly: true
            house_number_or_name:
              type: boolean
              description: 'The house number or name for the billing address. Not all payment

                services use this field but some do.'
              readOnly: true
            line1:
              type: boolean
              description: The first line of the billing address.
              readOnly: true
        tax_id:
          type: boolean
          description: The tax id code associated with the billing details.
          readOnly: true
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PaymentOptions:
      title: A list of payment options
      type: object
      description: A list of payment options.
      x-tags:
      - Payment Options
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOption'
    PaymentOptionsRequest:
      title: Payment Options (List)
      type: object
      description: A request to get list of payment options.
      x-tags:
      - Request Bodies
      properties:
        amount:
          description: 'The monetary amount to create an authorization for, in the smallest

            currency unit for the given currency, for example `1299` cents to create

            an authorization for `$12.99`.


            If the `intent` is set to `capture`, an amount greater than zero must

            be supplied.'
          type:
          - integer
          - 'null'
          example: 1299
        locale:
          type:
          - string
          - 'null'
          example: en-US
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          default: en
          description: 'An ISO 639-1 Language Code and optional ISO 3166 Country Code. This locale

            determines the language for the labels returned for every payment option.'
        currency:
          type:
          - string
          - 'null'
          example: USD
          description: 'A supported ISO-4217 currency code.


            For redirect requests, this value must match the one specified for

            `currency` in `payment_method`.

            '
        country:
          type:
          - string
          - 'null'
          example: US
          description: 'Filters the results to only the items which support this country code. A

            country is formatted as 2-letter ISO country code.

            '
        metadata:
          description: 'Used by the Flow engine to filter available options based on various

            client-defined parameters. If present, this must be a string representing

            a valid JSON dictionary.'
          type:
          - object
          - 'null'
          maxProperties: 20
          additionalProperties:
            type: string
          example:
            key: value
        cart_items:
          type:
          - array
          - 'null'
          description: An array of cart items that represents the line items of a transaction.
          items:
            $ref: '#/components/schemas/CartItem'
          maxItems: 249
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PaymentOptionCardScheme:
      type: string
      title: The scheme of the transaction
    Error401:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `unauthorized`
          default: unauthorized
          examples:
          - unauthorized
        status:
          type: integer
          title: Status
          description: Always `401`.
          default: 401
          examples:
          - 401
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: No valid API authentication found
          examples:
          - No valid API authentication found
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error401
    Error404:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `not_found`
          default: not_found
          examples:
          - not_found
        status:
          type: integer
          title: Status
          description: Always `404`.
          default: 404
          examples:
          - 404
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: The resource could not be found
          examples:
          - The resource could not be found
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error404
    PaymentOptionContext:
      properties:
        approval_ui:
          anyOf:
          - $ref: '#/components/schemas/PaymentOptionContextApprovalUI'
          - type: 'null'
        required_fields:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: boolean
              - additionalProperties:
                  anyOf:
                  - type: boolean
                  - {}
                type: object
            type: object
          - type: 'null'
          title: Required Fields
        redirect_requires_popup:
          type: boolean
          title: Redirect Requires Popup
        requires_tokenized_redirect_popup:
          type: boolean
          title: Requires Tokenized Redirect Popup
      additionalProperties: false
      type: object
      required:
      - redirect_requires_popup
      - requires_tokenized_redirect_popup
      title: PaymentOptionContext
    ErrorLocation:
      type: string
      enum:
      - query
      - body
      - path
      - header
      - unknown
      title: ErrorLocation
    Error425:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `too_early`
          default: too_early
          examples:
          - too_early
        status:
          type: integer
          title: Status
          description: Always `425`.
          default: 425
          examples:
          - 425
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error425
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ErrorDetail_2:
      properties:
        location:
          $ref: '#/components/schemas/ErrorLocation'
          description: The part of the request where the property can be found that caused the error.
          examples:
          - body
        pointer:
          anyOf:
          - type: string
            format: json-pointer
          - type: string
          title: Pointer
          description: A JSON pointer for the particular property that caused the error.
          examples:
          - /currency
        message:
          type: string
          title: Message
          description: A human-readdable explanation of the error.
          examples:
          - 'Unknown ISO 4217 currency code: USX'
        type:
          type: string
          title: Type
          description: The type of error that was raised for this property.
          examples:
          - value_error
      additionalProperties: false
      type: object
      required:
      - location
      - pointer
      - message
      - type
      title: ErrorDetail
    PaymentOptionContextApprovalUI:
      properties:
        height:
          anyOf:
          - type: string
          - type: 'null'
          title: Height
        width:
          anyOf:
          - type: string
          - type: 'null'
          title: Width
      additionalProperties: false
      type: object
      title: PaymentOptionContextApprovalUI
    Error405:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `method_not_allowed`
          default: method_not_allowed
          examples:
          - method_not_allowed
        status:
          type: integer
          title: Status
          description: Always `405`.
          default: 405
          examples:
          - 405
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Method Not Allowed
          examples:
          - Method Not Allowed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error405
    Error429:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
