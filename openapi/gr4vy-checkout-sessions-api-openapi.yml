components:
  schemas:
    Airline:
      title: Airline Addendum
      type: object
      description: Information about an airline travel.
      properties:
        passenger_name_record:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 50
          description: The Passenger Name Record (PNR) in the airline reservation system.
          example: JOHN L
        booking_code:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 50
          description: The unique identifier of the reservation in the global distribution system.
          example: X36Q9C
        ticket_number:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 50
          description: The airline's unique ticket number.
          example: 123-1234-151555
        ticket_delivery_method:
          type:
          - string
          - 'null'
          enum:
          - electronic
          - other
          default: electronic
          description: The delivery method of the ticket.
          example: other
        issued_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The date that the ticket was last issued in the airline reservation

            system.'
          example: '2013-07-16T19:23:00.000+00:00'
        issued_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The address of the place/agency that issued the ticket.
          example: 123 Broadway, New York
        travel_agency_code:
          type:
