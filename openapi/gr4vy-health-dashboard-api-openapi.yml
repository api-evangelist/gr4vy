openapi: 3.2.0
info:
  title: Gr4vy Health Dashboard API
  version: 1.1.0-beta
  contact:
    name: Gr4vy Support
    email: code@gr4vy.com
    url: https://gr4vy.com
  termsOfService: https://gr4vy.com
  license:
    name: MIT
    url: https://raw.githubusercontent.com/gr4vy/gr4vy-openapi/main/LICENSE
  description: 'Welcome to the Gr4vy API reference documentation.

    Our API is still very much a work in product and subject to change.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
security:
- bearerAuth: []
tags:
- name: Health Dashboard
  description: Endpoints to retrieve the data used for the Health Dashboard.
  x-internal: true
paths:
  /health-dashboard/connections:
    get:
      operationId: get-health-dashboard-connections
      summary: Get Health Dashboard connections
      description: Retrieves the Health Dashboard connections (payment services) table data.
      tags:
      - Health Dashboard
      x-internal: true
      parameters:
      - schema:
          type: string
          enum:
          - 1-day
          - 7-days
          - 30-days
          example: 7-days
        in: query
        name: period
        description: 'Filters the results to the set of data aggregated over the

          duration of the specified period.'
        required: true
      - schema:
          type: boolean
          example: true
          default: false
        in: query
        name: exclude_idle
        description: 'Filters the results to exclude idle connections.

          A connection is considered idle if it has not

          processed any transaction in the specified period.

          By default, all results are returned.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      responses:
        '200':
          description: Returns the Health Dashboard connections table data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDashboardConnections'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
  /health-dashboard/connections-volume:
    get:
      operationId: get-health-dashboard-connections-volume
      summary: Get Health Dashboard connections volume
      description: Retrieves the Health Dashboard connections (payment services) volume table data.
      tags:
      - Health Dashboard
      x-internal: true
      parameters:
      - schema:
          type: string
          enum:
          - 1-day
          - 7-days
          - 30-days
          example: 7-days
        in: query
        name: period
        description: 'Filters the results to the set of data aggregated over the

          duration of the specified period.'
        required: true
      - schema:
          type: string
          example: USD
        in: query
        name: currency
        description: 'Filters the results to the set of data aggregated by the currency.

          A currency is formatted as 3-letter ISO currency code.'
        required: true
      - schema:
          type: boolean
          example: true
          default: false
        in: query
        name: exclude_idle
        description: 'Filters the results to exclude idle connections.

          A connection is considered idle if it has not

          processed any transaction in the specified period.

          By default, all results are returned.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      responses:
        '200':
          description: Returns the Health Dashboard connections volume table data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDashboardConnections'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
  /health-dashboard/status:
    get:
      operationId: get-health-dashboard-status
      summary: Get Health Dashboard status
      description: Retrieves the Health Dashboard status summary.
      tags:
      - Health Dashboard
      x-internal: true
      responses:
        '200':
          description: Returns the Health Dashboard status summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDashboardStatus'
  /health-dashboard/total:
    get:
      operationId: get-health-dashboard-total
      summary: Get Health Dashboard total
      description: Retrieves the Health Dashboard line chart data.
      tags:
      - Health Dashboard
      x-internal: true
      parameters:
      - schema:
          type: string
          enum:
          - 1-day
          - 7-days
          - 30-days
          example: 7-days
        in: query
        name: period
        description: 'Filters the results to the set of data aggregated over the

          duration of the specified period.'
        required: true
      responses:
        '200':
          description: Returns the Health Dashboard line chart data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDashboardTotal'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
  /health-dashboard/total-volume:
    get:
      operationId: get-health-dashboard-total-volume
      summary: Get Health Dashboard total volume
      description: Retrieves the Health Dashboard volume line chart data.
      tags:
      - Health Dashboard
      x-internal: true
      parameters:
      - schema:
          type: string
          example: USD
        in: query
        name: currency
        description: 'Filters the results to the set of data aggregated by the currency.

          A currency is formatted as 3-letter ISO currency code.'
        required: true
      - schema:
          type: string
          enum:
          - 1-day
          - 7-days
          - 30-days
          example: 7-days
        in: query
        name: period
        description: 'Filters the results to the set of data aggregated over the

          duration of the specified period.'
        required: true
      responses:
        '200':
          description: Returns the Health Dashboard volume line chart data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDashboardTotalVolume'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
components:
  schemas:
    HealthDashboardTotalVolume:
      title: Health Dashboard total volume
      type: object
      description: Health Dashboard transactions and refunds volume line chart data.
      x-tags:
      - Health Dashboard
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource.
          example: health-dashboard.total-volume
          enum:
          - health-dashboard.total-volume
        summary:
          type: object
          description: Summary of the aggregated data.
          properties:
            transactions_authorized:
              type: integer
              description: The volume of authorized transactions created during the current period.
              example: 7890
            transactions_authorized_delta_pct:
              type:
              - integer
              - 'null'
              description: The percentage difference between the volume of authorized transactions created during the current period and the previous period.
              example: -5
            transactions_authorized_rate:
              type:
              - integer
              - 'null'
              description: The rate of authorized transactions created during the current period.
              example: 89
            transactions_authorized_rate_delta:
              type:
              - integer
              - 'null'
              description: The absolute difference between the rate of authorized transactions created during the current period and the previous period.
              example: 15
            refunds:
              type: integer
              description: The volume of successful refunds from all sources created during the current period.
              example: 590
            refunds_delta_pct:
              type:
              - integer
              - 'null'
              description: The percentage difference between the volume of successful refunds created during the current period and the previous period.
              example: 7
        series:
          type: object
          description: Contains two series of data points used to build the line chart. The `current` series contains aggregations starting from the `first_interval` up to the specified period (e.g. `7-days`). The `previous` series contains aggregations from the period immediately preceding the `current` series.
          properties:
            current:
              type: object
              description: Metrics for the transactions and refunds created during the current period aggregated by hour or day.
              properties:
                first_interval:
                  type: string
                  description: The date and time of the first data point, represented with an ISO 8601 interval value indicating whether it is aggregated by one hour (PT1H) or one day (P1D) periods.
                  example: 2024-05-07T00:00:00Z/P1D
                transactions_authorized:
                  type: array
                  items:
                    type: integer
                  description: The volume of authorized transactions created within the period that the data point corresponds to.
                  example:
                  - 1919
                  - 2194
                  - 1920
                  - 2184
                  - 1328
                  - 1868
                  - 2001
                  - 2082
                transactions_authorized_rate:
                  type:
                  - array
                  - 'null'
                  items:
                    type:
                    - integer
                    - 'null'
                  description: The rate of authorized transactions created within the period that the data point corresponds to.
                  example:
                  - 66
                  - 89
                  - 75
                  - 98
                  - 100
                  - null
                  - 95
                  - 100
                refunds:
                  type: array
                  items:
                    type: integer
                  description: The volume of successful refunds created within the period that the data point corresponds to.
                  example:
                  - 119
                  - 294
                  - 120
                  - 184
                  - 138
                  - 168
                  - 201
                  - 182
            previous:
              type: object
              description: Metrics for the transactions and refunds created during the previous period aggregated by hour or day.
              properties:
                first_interval:
                  type: string
                  description: The date and time of the first data point, represented with an ISO 8601 interval value indicating whether it is aggregated by one hour (PT1H) or one day (P1D) periods.
                  example: 2024-04-29T00:00:00Z/P1D
                transactions_authorized:
                  type: array
                  items:
                    type: integer
                  description: The volume of authorized transactions created within the period that the data point corresponds to.
                  example:
                  - 1919
                  - 2194
                  - 1920
                  - 2184
                  - 1328
                  - 1868
                  - 2001
                  - 2082
                transactions_authorized_rate:
                  type:
                  - array
                  - 'null'
                  items:
                    type:
                    - integer
                    - 'null'
                  description: The rate of authorized transactions created within the period that the data point corresponds to.
                  example:
                  - 66
                  - 89
                  - 75
                  - 98
                  - 100
                  - null
                  - 95
                  - 100
                refunds:
                  type: array
                  items:
                    type: integer
                  description: The volume of successful refunds created within the period that the data point corresponds to.
                  example:
                  - 119
                  - 294
                  - 120
                  - 184
                  - 138
                  - 168
                  - 201
                  - 182
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    HealthDashboardConnection:
      title: Health Dashboard connection
      type: object
      description: Health Dashboard connection table data.
      x-tags:
      - Health Dashboard
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource.
          example: health-dashboard.connection
          enum:
          - health-dashboard.connection
        summary:
          type: object
          description: Summary of the aggregated payment service data.
          properties:
            payment_service_id:
              type: string
              format: uuid
              description: The ID of the payment service.
              example: 50f2e61f-caac-4e12-8d79-30eaf8250423
            payment_service_definition_id:
              type: string
              description: The payment service definition ID.
              example: stripe-card
            payment_service_display_name:
              type: string
              description: The display name of the payment service.
              example: Stripe UK
            payment_service_is_active:
              type: boolean
              description: Indicates whether the payment service is currently active.
              example: true
            payment_service_is_deleted:
              type: boolean
              description: Indicates whether the payment service has been deleted.
              example: false
            transactions_authorized:
              type: integer
              description: 'The total number of transactions authorized by the payment

                service during the current period.'
              example: 290
            transactions_authorized_rate:
              type:
              - integer
              - 'null'
              description: 'The rate of transactions authorized by the payment service

                during the current period.'
              example: 85
            transactions_authorized_rate_delta:
              type:
              - integer
              - 'null'
              description: 'The absolute difference between the rate of transactions authorized by

                the payment service during the current period and the previous period.'
              example: 2
            transactions_declined:
              type: integer
              description: 'The total number of transactions declined by the payment

                service during the current period.'
              example: 30
            transactions_recovered:
              type: integer
              description: 'The total number of transactions recovered by the payment service

                during the current period. A recovered transaction is a transaction

                that has failed attempts before being successfully processed by

                this payment service.'
              example: 70
    HealthDashboardStatus:
      title: Health Dashboard status
      type: object
      description: Health Dashboard status summary.
      x-tags:
      - Health Dashboard
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource.
          example: health-dashboard.status
          enum:
          - health-dashboard.status
        latest_execution:
          type:
          - object
          - 'null'
          description: Information about the latest execution to process data for the Health Dashboard. This value is null if the data has not been fully processed for the first time yet.
          properties:
            timestamp:
              type: string
              format: date-time
              description: The date and time when the data was last processed.
              example: '2023-07-26T19:23:00.000Z'
        currencies:
          type:
          - array
          - 'null'
          description: The list of currencies that were transacted within the last 60+ days in ISO 4217 currency code format. This value is null if the data has not been fully processed for the first time yet.
          items:
            type: string
          example:
          - USD
          - GBP
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    HealthDashboardTotal:
      title: Health Dashboard total
      type: object
      description: Health Dashboard transactions and refunds line chart data.
      x-tags:
      - Health Dashboard
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource.
          example: health-dashboard.total
          enum:
          - health-dashboard.total
        summary:
          type: object
          description: Summary of the aggregated data.
          properties:
            transactions_accepted:
              type: integer
              description: The total number of transactions created during the current period.
              example: 7890
            transactions_accepted_delta_pct:
