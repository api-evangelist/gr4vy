              description: The percentage difference between the total number of transactions created during the current period and the previous period.
              example: -5
            transactions_authorized_rate:
              type:
              - integer
              - 'null'
              description: The rate of authorized transactions created during the current period.
              example: 89
            transactions_authorized_rate_delta:
              type:
              - integer
              - 'null'
              description: The absolute difference between the rate of authorized transactions created during the current period and the previous period.
              example: 15
            refunds:
              type: integer
              description: The total number of successful refunds from all sources created during the current period.
              example: 590
            refunds_delta_pct:
              type:
              - integer
              - 'null'
              description: The percentage difference between the total number of successful refunds from all sources created during the current period and the previous period.
              example: 7
        series:
          type: object
          description: Contains two series of data points used to build the line chart. Each series contains aggregations of data created over the duration of the specified period (e.g. `7-days`). The `previous` series contains aggregations from the period immediately preceding the `current` series.
          properties:
            current:
              type: object
              description: Metrics for the transactions and refunds created during the current period aggregated by hour or day.
              properties:
                first_interval:
                  type: string
                  description: The date and time of the first data point, represented with an ISO 8601 interval value indicating whether it is aggregated by one hour (PT1H) or one day (P1D) periods.
                  example: 2024-05-07T00:00:00Z/P1D
                transactions_accepted:
                  type: array
                  items:
                    type: integer
                  description: The total number of transactions created within the period that the data point corresponds to.
                  example:
                  - 1919
                  - 2194
                  - 1920
                  - 2184
                  - 1328
                  - 1868
                  - 2001
                  - 2082
                transactions_authorized_rate:
                  type: array
                  items:
                    type:
                    - integer
                    - 'null'
                  description: The rate of authorized transactions created within the period that the data point corresponds to.
                  example:
                  - 66
                  - 89
                  - 75
                  - 98
                  - 100
                  - null
                  - 95
                  - 100
                refunds:
                  type: array
                  items:
                    type: integer
                  description: The total number of successful refunds created within the period that the data point corresponds to.
                  example:
                  - 119
                  - 294
                  - 120
                  - 184
                  - 138
                  - 168
                  - 201
                  - 182
            previous:
              type: object
              description: Metrics for the transactions and refunds created during the previous period aggregated by hour or day.
              properties:
                first_interval:
                  type: string
                  description: The date and time of the first data point, represented with an ISO 8601 interval value indicating whether it is aggregated by one hour (PT1H) or one day (P1D) periods.
                  example: 2024-04-29T00:00:00Z/P1D
                transactions_accepted:
                  type: array
                  items:
                    type: integer
                  description: The total number of transactions created within the period that the data point corresponds to.
                  example:
                  - 1919
                  - 2194
                  - 1920
                  - 2184
                  - 1328
                  - 1868
                  - 2001
                  - 2082
                transactions_authorized_rate:
                  type: array
                  items:
                    type:
                    - integer
                    - 'null'
                  description: The rate of authorized transactions created within the period that the data point corresponds to.
                  example:
                  - 66
                  - 89
                  - 75
                  - 98
                  - 100
                  - null
                  - 95
                  - 100
                refunds:
                  type: array
                  items:
                    type: integer
                  description: The total number of successful refunds created within the period that the data point corresponds to.
                  example:
                  - 119
                  - 294
                  - 120
                  - 184
                  - 138
                  - 168
                  - 201
                  - 182
    HealthDashboardConnections:
      title: Health Dashboard connections
      type: object
      description: Health Dashboard connections table data.
      x-tags:
      - Health Dashboard
      x-internal: true
      properties:
        items:
          type: array
          description: A list of connection summaries.
          items:
            $ref: '#/components/schemas/HealthDashboardConnection'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
