openapi: 3.2.0
info:
  title: Gr4vy Digital Wallets API
  version: 1.1.0-beta
  contact:
    name: Gr4vy Support
    email: code@gr4vy.com
    url: https://gr4vy.com
  termsOfService: https://gr4vy.com
  license:
    name: MIT
    url: https://raw.githubusercontent.com/gr4vy/gr4vy-openapi/main/LICENSE
  description: 'Welcome to the Gr4vy API reference documentation.

    Our API is still very much a work in product and subject to change.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
security:
- bearerAuth: []
tags:
- name: Digital Wallets
  description: 'In Gr4vy, a digital wallet represents a way for a buyer to pay using

    card details already stored on their device via a digital wallet service

    such as Apple Pay or Google Pay. The buyer will not have to fill in their

    card details on checkout.


    The digital wallets API can be used to:


    * Register with a digital wallet provider.

    * List digital wallets currently registered.'
paths:
  /digital-wallets:
    post:
      operationId: new-digital-wallet
      summary: Register digital wallet
      description: Register with a digital wallet provider.
      tags:
      - Digital Wallets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalWalletRequest'
      responses:
        '201':
          description: Returns the newly registered digital wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalWallet'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '409':
          description: Returns an error if duplicate resource has been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409DuplicateRecord'
    get:
      operationId: list-digital-wallets
      summary: List digital wallets
      description: Returns a list of all registered digital wallets.
      tags:
      - Digital Wallets
      responses:
        '200':
          description: Returns a list of registered digital wallets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalWallets'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
  /digital-wallets/{digital_wallet_id}:
    parameters:
    - schema:
        type: string
        example: fe26475d-ec3e-4884-9553-f7356683f7f9
      name: digital_wallet_id
      in: path
      required: true
      description: The ID of the registered digital wallet.
    get:
      operationId: get-digital-wallet
      summary: Get digital wallet
      description: Returns a registered digital wallet.
      tags:
      - Digital Wallets
      responses:
        '200':
          description: Returns a registered digital wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalWallet'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
    put:
      operationId: update-digital-wallet
      summary: Update digital wallet
      description: Updates the values a digital wallet was registered with.
      tags:
      - Digital Wallets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalWalletUpdate'
      responses:
        '200':
          description: Returns the updated digital wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalWallet'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
    delete:
      operationId: delete-digital-wallet
      summary: De-register digital wallet
      description: 'De-registers a digital wallet with a provider. Upon successful

        de-registration, the digital wallet''s record is deleted and will no

        longer be available.


        A digital wallet of the Apple provider may only be de-registered if

        there are no active Apple Pay certificates. When there are only

        incomplete or expired Apple Pay certificates, these certificates

        are deleted alongside the Apple digital wallet''s record.'
      tags:
      - Digital Wallets
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
  /digital-wallets/{digital_wallet_id}/domains:
    parameters:
    - schema:
        type: string
        example: fe26475d-ec3e-4884-9553-f7356683f7f9
      name: digital_wallet_id
      in: path
      required: true
      description: The ID of the registered digital wallet.
    post:
      operationId: add-digital-wallet-domain-name
      summary: Add digital wallet domain name
      description: Adds new domain for given digital wallet.
      tags:
      - Digital Wallets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalWalletDomain'
      responses:
        '204':
          description: Returns an empty response.
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
    delete:
      operationId: delete-digital-wallet-domain-name
      summary: Remove digital wallet domain name
      description: Removes domain for given digital wallet.
      tags:
      - Digital Wallets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalWalletDomain'
      responses:
        '204':
          description: Returns an empty response.
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
  /digital-wallets/apple/session:
    post:
      operationId: new-apple-pay-session
      summary: New Apple Pay session
      description: 'Initiates a new session with Apple Pay. This can be used when implementing

        Apple Pay without our SDK.


        This endpoint returns an opaque object that can be directly passed to the

        Apple Pay SDK. The format of this object may change when the format returned by

        the Apple Pay API changes.'
      tags:
      - Digital Wallets
      x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplePaySessionRequest'
      responses:
        '200':
          description: Returns an opaque Apple Pay session object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplePaySession'
              examples:
                Apple Pay session:
                  value:
                    status: '200'
                    statusMessage:
                      epochTimestamp: 1683210471377
                      expiresAt: 1683214071377
                      merchantSessionIdentifier: SSH5F16FF313BC246698E095440F39D9BAE_7E0DD8CB4E6B9B9FB4C5E36B3EDF9FB0DEA51F9419420173
                      nonce: 500a2a26
                      merchantIdentifier: A77873CD368A460BD5D3325AD76B01C16CFFF654F9A993F4B6A9B4098
                      domainName: applepaydemo.apple.com
                      displayName: Apple Pay Demo
                      signature: 
                      operationalAnalyticsIdentifier: Apple Pay Demo:A77873CD368A460BD01C16BB7F838CFFF654F9A993F4B6A9B4098
                      retries: 0
                      pspId: A77873CD368A460BD5D3321C16BB7F838CFFF654F9A993F4B6A9B4098
                    statusCode: 200
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if no active Apple Pay service can be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
  /digital-wallets/click-to-pay/session:
    post:
      operationId: new-click-to-pay-session
      summary: New Click to Pay session
      description: Returns digital payment application ID & name for use with Click to Pay.
      tags:
      - Digital Wallets
      x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickToPaySessionRequest'
      responses:
        '200':
          description: Returns Click to Pay session object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClickToPaySession'
              examples:
                Click to Pay session:
                  value:
                    digital_payment_application_id: DPA ID
                    digital_payment_application_name: DPA name
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if no active Click to Pay service can be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
  /digital-wallets/google/session:
    post:
      operationId: new-google-pay-session
      summary: New Google Pay session
      description: 'Initiates a new session with Google Pay. This can be used when implementing

        Google Pay without our SDK.'
      tags:
      - Digital Wallets
      x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePaySessionRequest'
      responses:
        '200':
          description: Returns a JWT used for Google Pay authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePaySession'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if no active Google Pay service can be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
components:
  schemas:
    DigitalWallets:
      title: Digital Wallets
      type: object
      description: A list of registered digital wallets.
      x-tags:
      - Digital Wallets
      properties:
        items:
          type: array
          description: A list of registered digital wallets.
          items:
            $ref: '#/components/schemas/DigitalWallet'
    ApplePaySession:
      title: Apple Pay Session
      type: object
      x-internal: true
      additionalProperties: true
    ClickToPaySession:
      title: Click to Pay Session
      type: object
      x-internal: true
      properties:
        digital_payment_application_id:
          type: string
          description: The ID of the Digital Payment Application for Click to Pay.
          example: a0b093e4-028a-4310-93fb-4ed0afc813fb
        digital_payment_application_name:
          type: string
          description: The name of the Digital Payment Application for Click to Pay.
          example: Plantly T4JUU1
    ApplePaySessionRequest:
      title: Apple Pay session request
      type: object
      description: Initiates a new session with Apple Pay.
      x-tags:
      - Request Bodies
      required:
      - validation_url
      - domain_name
      properties:
        validation_url:
          type: string
          format: uri
          description: 'Validation URL obtained from the event passed to a

            `onvalidatemerchant` callback.'
        domain_name:
          type: string
          description: Fully qualified domain name of the merchant.
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ClickToPaySessionRequest:
      title: Click to Pay session request
      type: object
      description: Return digital payment application details for Click to Pay.
      x-tags:
      - Request Bodies
      required:
      - checkout_session_id
      properties:
        checkout_session_id:
          type: string
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: The identifier for the current checkout session.
          format: uuid
    DigitalWalletDomain:
      title: Digital Wallet Domain
      type: object
      description: Domain name for a digital wallet.
      x-tags:
      - Request Bodies
      required:
      - domain_name
      properties:
        domain_name:
          type: string
          example: example.com
          description: 'The domain name that a digital wallet can be used on. To use a

            digital wallet on a website, the domain of the site is required to be

            in this list.'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    DigitalWalletClickToPayFields:
      title: Click to Pay
      type: object
      x-tags:
      - Request Bodies
      properties:
        digital_payment_application_id:
          type: string
          description: Unique ID assigned for digital payment application.
        digital_payment_application_name:
          type: string
          description: Name assigned for digital payment application.
    DigitalWalletRequest:
      title: Digital Wallet (Register)
      type: object
      description: Merchant details used to register with a digital wallet provider.
      x-tags:
      - Request Bodies
      required:
      - provider
      - merchant_name
      - domain_names
      - accept_terms_and_conditions
      properties:
        provider:
          type: string
          example: apple
          description: The name of the digital wallet provider.
          enum:
          - apple
          - google
        merchant_name:
          type: string
          description: 'The name of the merchant. This is used to register the merchant with a

            digital wallet provider and this name is not displayed to the buyer.'
          example: Gr4vy
        merchant_url:
          type:
          - string
          - 'null'
          example: https://example.com
          default: null
          description: The main URL of the merchant.
          format: url
        merchant_display_name:
          type:
          - string
          - 'null'
          example: Gr4vy
          description: The consumer facing name of the merchant.
        merchant_country_code:
          type:
          - string
          - 'null'
          example: US
          description: The country code where the merchant is registered.
          maxLength: 2
          minLength: 2
        domain_names:
          type: array
          minItems: 1
          maxItems: 99
          items:
            type: string
          example:
          - example.com
          description: 'The list of domain names that a digital wallet can be used on. To use a

            digital wallet on a website, the domain of the site is required to be

            in this list.'
        accept_terms_and_conditions:
          type: boolean
          description: 'The explicit acceptance of the digital wallet provider''s terms and

            conditions by the merchant. Needs to be `true` to register a new digital

            wallet.'
          example: true
    GooglePaySession:
      title: Google Pay Session
      type: object
      x-internal: true
      properties:
        gateway_merchant_id:
          type: string
          description: Your merchant ID.
          example: app.gr4vy.sandbox.spider.default
        token:
          type: string
          description: The JWT for the current Google Pay session.
          example: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJtZXJjaGFudElkIjoiQkNSMkRONFQ3QzNLWDZEWSIsIm1lcmNoYW50T3JpZ2luIjoiZW1iZWQuc2FuZGJveC5zcGlkZXIuZ3I0dnkuYXBwIiwiaWF0IjoxNjgzMjExMzk5fQ.Qk99p_j96aSxGmxUyyb06rNxIY7nh9-BvHJGWBrLBSFb3HkSbYRgq9YQzscWJtLHVvIJifkzSc8BgtllfAzh9A
    DigitalWalletUpdate:
      title: Digital Wallet (Update)
      type: object
      description: Request body to update a registered digital wallet's details.
      x-tags:
      - Request Bodies
      properties:
        merchant_name:
          type: string
          description: 'The name of the merchant. This is used to update the value initially

            used to register with a digital wallet provider and this name is not

            displayed to the buyer.'
          example: Gr4vy
        domain_names:
          type: array
          minItems: 1
          maxItems: 99
          items:
            type: string
          example:
          - example.com
          description: 'The list of domain names that a digital wallet can be used on. To use a

            digital wallet on a website, the domain of the site is required to be

            in this list.'
        merchant_display_name:
          type:
          - string
          - 'null'
          example: Gr4vy
          description: The consumer facing name of the merchant.
        merchant_country_code:
          type:
          - string
          - 'null'
          example: US
          description: The country code where the merchant is registered.
          maxLength: 2
          minLength: 2
        merchant_url:
          type: string
          example: https://example.com
          description: The main URL of the merchant.
    Error409DuplicateRecord:
      title: Duplicate Record Error
      type: object
      description: Duplicate Record Error (HTTP 409).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`duplicate_record`.'
          example: duplicate_record
          enum:
          - duplicate_record
        status:
          type: integer
          description: '`409`.'
          example: 409
          enum:
          - 409
        message:
          type: string
          description: Further details on the field that triggered the error.
          example: A duplicate record exists with this external_identifier value
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    DigitalWallet:
      title: Digital Wallet
      type: object
      description: A digital wallet (e.g. Apple Pay) that has been registered.
      x-tags:
      - Digital Wallets
      properties:
        type:
          type: string
          example: digital-wallet
          description: '`digital-wallet`.'
          enum:
          - digital-wallet
        id:
          type: string
          example: 8d3fe99b-1422-42e6-bbb3-932d95ae5f79
          description: The ID of the registered digital wallet.
          format: uuid
        merchant_account_id:
          type: string
          description: The unique ID for a merchant account.
          example: default
        provider:
          type: string
          example: apple
          description: The name of the digital wallet provider.
          enum:
          - apple
          - google
        merchant_name:
          type: string
          example: Gr4vy
          description: The name of the merchant the digital wallet is registered to.
        merchant_url:
          type:
          - string
          - 'null'
          example: https://example.com
          description: The main URL of the merchant.
          default: null
          format: url
        merchant_display_name:
          type:
          - string
          - 'null'
          example: Gr4vy
          description: The consumer facing name of the merchant.
        merchant_country_code:
          type:
          - string
          - 'null'
          example: US
          description: The country code where the merchant is registered.
          maxLength: 2
          minLength: 2
        domain_names:
          type: array
          minItems: 1
          maxItems: 99
          items:
            type: string
          example:
          - example.com
          description: 'The list of domain names that a digital wallet can be used on. To use a

            digital wallet on a website, the domain of the site is required to be

            in this list.'
        fields:
          description: 'Custom attributes for some digital wallets. Currently only used by

            Click to Pay.'
          $ref: '#/components/schemas/DigitalWalletClickToPayFields'
        created_at:
          type: string
          format: date-time
          example: '2012-12-12T10:53:43+00:00'
          description: The date and time when this digital wallet was registered.
        updated_at:
          type: string
          format: date-time
          example: '2012-12-12T10:53:43+00:00'
          description: The date and time when this digital wallet was last updated.
        active_certificate_count:
          type: integer
          example: 1
          description: The number of active custom certificates registered for this digital wallet (Apple Pay only).
        pending_certificate_count:
          type: integer
          example: 1
          description: The number of pending custom certificates registered for this digital wallet (Apple Pay only).
        expired_certificate_count:
          type: integer
          example: 1
          description: The number of expired custom certificates registered for this digital wallet (Apple Pay only).
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
