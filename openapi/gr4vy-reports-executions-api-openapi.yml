openapi: 3.2.0
info:
  title: Gr4vy Reports - Executions API
  description: The Gr4vy API.
  version: 1.0.0
tags:
- name: Reports - Executions
  description: Manage executions of reports.
paths:
  /reports/{report_id}/executions:
    get:
      tags:
      - Reports - Executions
      summary: List executions for report
      description: List all executions of a specific report.
      operationId: list_report_executions
      security:
      - OAuth2PasswordBearer:
        - reports.read
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the report to retrieve details for.
          examples:
          - 4d4c7123-b794-4fad-b1b9-5ab2606e6bbe
          title: Report Id
        description: The ID of the report to retrieve details for.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: A pointer to the page of results to return.
          examples:
          - ZXhhbXBsZTE
          title: Cursor
        description: A pointer to the page of results to return.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: The maximum number of items that are at returned.
          examples:
          - 20
          default: 20
          title: Limit
        description: The maximum number of items that are at returned.
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutions'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: list
      x-speakeasy-group: reports.executions
      x-speakeasy-pagination:
        type: cursor
        inputs:
        - name: cursor
          in: parameters
          type: cursor
        outputs:
          nextCursor: $.next_cursor
  /reports/{report_id}/executions/{report_execution_id}/url:
    post:
      tags:
      - Reports - Executions
      summary: Create URL for executed report
      description: Creates a download URL for a specific execution of a report.
      operationId: create_report_execution_url
      security:
      - OAuth2PasswordBearer:
        - reports.read
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the report to retrieve a URL for.
          examples:
          - 4d4c7123-b794-4fad-b1b9-5ab2606e6bbe
          title: Report Id
        description: The ID of the report to retrieve a URL for.
      - name: report_execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the execution of a report to retrieve a URL for.
          examples:
          - 003bc416-f32a-420c-8eb2-062a386e1fb0
          title: Report Execution Id
        description: The ID of the execution of a report to retrieve a URL for.
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportExecutionUrlGenerate'
              default:
                expires_in: 5
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutionUrl'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: url
      x-speakeasy-group: reports.executions
  /report-executions:
    get:
      tags:
      - Reports - Executions
      summary: List executed reports
      description: List all executed reports that have been generated.
      operationId: list_all_report_executions
      security:
      - OAuth2PasswordBearer:
        - reports.read
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: A pointer to the page of results to return.
          examples:
          - ZXhhbXBsZTE
          title: Cursor
        description: A pointer to the page of results to return.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: The maximum number of items that are at returned.
          examples:
          - 20
          default: 20
          title: Limit
        description: The maximum number of items that are at returned.
      - name: report_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filters the reports by searching their name for (partial) matches.
          examples:
          - My report
          title: Report Name
        description: Filters the reports by searching their name for (partial) matches.
      - name: created_at_lte
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filters the results to only reports created before this ISO date-time string. The time zone must be included. Ensure that the date-time string is URL encoded, e.g. `2022-01-01T12:00:00+08:00` must be encoded as `2022-01-01T12%3A00%3A00%2B08%3A00`.
          examples:
          - '2022-01-01T12:00:00+08:00'
          title: Created At Lte
        description: Filters the results to only reports created before this ISO date-time string. The time zone must be included. Ensure that the date-time string is URL encoded, e.g. `2022-01-01T12:00:00+08:00` must be encoded as `2022-01-01T12%3A00%3A00%2B08%3A00`.
      - name: created_at_gte
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filters the results to only reports created after this ISO date-time string. The time zone must be included. Ensure that the date-time string is URL encoded, e.g. `2022-01-01T12:00:00+08:00` must be encoded as `2022-01-01T12%3A00%3A00%2B08%3A00`.
          examples:
          - '2022-01-01T12:00:00+08:00'
          title: Created At Gte
        description: Filters the results to only reports created after this ISO date-time string. The time zone must be included. Ensure that the date-time string is URL encoded, e.g. `2022-01-01T12:00:00+08:00` must be encoded as `2022-01-01T12%3A00%3A00%2B08%3A00`.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ReportExecutionStatus'
          - type: 'null'
          description: Filters the results to only the reports that have a `status` that matches with any of the provided status values.
          examples:
          - succeeded
          title: Status
        description: Filters the results to only the reports that have a `status` that matches with any of the provided status values.
      - name: creator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          description: Filters the results to only the reports that were created by the users with these IDs.
          examples:
          - 30362ed1-05cf-4a4c-8b4a-e76323df5f1e
          title: Creator Id
        description: Filters the results to only the reports that were created by the users with these IDs.
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutions'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: list
      x-speakeasy-group: report-executions
      x-speakeasy-pagination:
        type: cursor
        inputs:
        - name: cursor
          in: parameters
          type: cursor
        outputs:
          nextCursor: $.next_cursor
  /report-executions/{report_execution_id}:
    get:
      tags:
      - Reports - Executions
      summary: Get executed report
      description: Fetch a specific executed report.
      operationId: get_report_execution
      security:
      - OAuth2PasswordBearer:
        - reports.read
      parameters:
      - name: report_execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the execution of a report to retrieve details for.
          examples:
          - 003bc416-f32a-420c-8eb2-062a386e1fb0
          title: Report Execution Id
        description: The ID of the execution of a report to retrieve details for.
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecution'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: get
      x-speakeasy-group: reports.executions
components:
  schemas:
    ErrorLocation:
      type: string
      enum:
      - query
      - body
      - path
      - header
      - unknown
      title: ErrorLocation
    Error405:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `method_not_allowed`
          default: method_not_allowed
          examples:
          - method_not_allowed
        status:
          type: integer
          title: Status
          description: Always `405`.
          default: 405
          examples:
          - 405
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Method Not Allowed
          examples:
          - Method Not Allowed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error405
    ErrorDetail:
      properties:
        location:
          $ref: '#/components/schemas/ErrorLocation'
          description: The part of the request where the property can be found that caused the error.
          examples:
          - body
        pointer:
          anyOf:
          - type: string
            format: json-pointer
          - type: string
          title: Pointer
          description: A JSON pointer for the particular property that caused the error.
          examples:
          - /currency
        message:
          type: string
          title: Message
          description: A human-readdable explanation of the error.
          examples:
          - 'Unknown ISO 4217 currency code: USX'
        type:
          type: string
          title: Type
          description: The type of error that was raised for this property.
          examples:
          - value_error
      additionalProperties: false
      type: object
      required:
      - location
      - pointer
      - message
      - type
      title: ErrorDetail
    ReportExecutionContext:
      properties:
        reference_timestamp:
          type: string
          format: date-time
          title: Reference Timestamp
          description: The reference timestamp for the report execution context.
          examples:
          - '2024-05-30T12:34:56.000Z'
        reference_timezone:
          type: string
          title: Reference Timezone
          description: The reference timezone for the report execution context.
          examples:
          - UTC
      additionalProperties: false
      type: object
      required:
      - reference_timestamp
      - reference_timezone
      title: ReportExecutionContext
    ReportExecutionUrlGenerate:
      properties:
        expires_in:
          type: integer
          maximum: 10080.0
          minimum: 1.0
          title: Expires In
          description: The URL expiration time, in minutes.
          default: 5
          examples:
          - 5
      additionalProperties: false
      type: object
      title: ReportExecutionUrlGenerate
    Error404:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `not_found`
          default: not_found
          examples:
          - not_found
        status:
          type: integer
          title: Status
          description: Always `404`.
          default: 404
          examples:
          - 404
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: The resource could not be found
          examples:
          - The resource could not be found
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error404
    Error409:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `duplicate_record`
          default: duplicate_record
          examples:
          - duplicate_record
        status:
          type: integer
          title: Status
          description: Always `409`.
          default: 409
          examples:
          - 409
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
          description: The ID of the conflicting resource.
          examples:
          - cdc70639-cb9c-4222-a73f-b8ce39f7821b
      additionalProperties: false
      type: object
      title: Error409
    ReportSummary:
      properties:
        type:
          type: string
          const: report
          title: Type
          description: Always `report`.
          default: report
          examples:
          - report
        id:
          type: string
          format: uuid
          title: Id
          description: The unique ID for the report.
          examples:
          - a1b2c3d4-5678-90ab-cdef-1234567890ab
        merchant_account_id:
          type: string
          title: Merchant Account Id
          description: The merchant account ID this report belongs to.
          examples:
          - merchant-account-12345
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: The name of the report.
          examples:
          - Monthly Transaction Report
        creator_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Creator Id
          description: The ID of the user who created the report.
          examples:
          - d290f1ee-6c54-4b01-90e6-d701748f0851
        creator_display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Creator Display Name
          description: The display name of the report creator.
          examples:
          - Jane Doe
        creator_type:
          anyOf:
          - $ref: '#/components/schemas/ReportCreatorType'
          - type: 'null'
          description: The type of the report creator.
          examples:
          - user
      additionalProperties: false
      type: object
      required:
      - id
      - merchant_account_id
      - name
      title: ReportSummary
    Error401:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `unauthorized`
          default: unauthorized
          examples:
          - unauthorized
        status:
          type: integer
          title: Status
          description: Always `401`.
          default: 401
          examples:
          - 401
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: No valid API authentication found
          examples:
          - No valid API authentication found
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error401
    Error504:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `gateway_timeout`
          default: gateway_timeout
          examples:
          - gateway_timeout
        status:
          type: integer
          title: Status
          default: 504
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Request could not be processed
          examples:
          - Request could not be processed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
