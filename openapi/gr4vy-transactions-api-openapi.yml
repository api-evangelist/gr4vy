        name:
          type: string
          description: The name of this resource. Is always `network-token-cryptogram-provision-failed`.
          example: network-token-cryptogram-provision-failed
          enum:
          - network-token-cryptogram-provision-failed
        created_at:
          type: string
          description: The date and time when this event was created in our system.
          format: date-time
          example: '2013-07-16T19:23:00.000+00:00'
        context:
          type: object
          description: Additional context for this event.
          properties:
            url:
              type:
              - string
              - 'null'
              description: The endpoint for the request, if performed.
            request:
              type:
              - string
              - 'null'
              description: The HTTP body sent to the Network Token provider, if performed.
            response:
              type:
              - string
              - 'null'
              description: The HTTP body received from the Network Token provider, if any.
            response_status_code:
              type:
              - number
              - 'null'
              description: The HTTP response status code from the Network Token provider, if any.
            reason:
              type: string
              description: The reason we could not provision the cryptogram.
              example: Network Error
    FlowRuleServiceOutcome:
      title: Payment service outcome
      type: object
      description: 'Defines the outcome of a rule in a flow where the result

        is a list of dictionaries that define the payment service,

        instrument and transformation to be used to process a

        transaction.'
      x-tags:
      - Flow
      required:
      - type
      - result
      - version
      x-internal: true
      properties:
        type:
          type: string
          description: The type of action outcome for the given rule.
          example: card-routing
          enum:
          - card-routing
        result:
          type: array
          description: Results for a given flow action.
          items:
            type: object
            properties:
              payment_service_id:
                type: string
                description: ID of the payment service to be used when processing the transaction.
                example: fe26475d-ec3e-4884-9553-f7356683f7f9
                format: uuid
              instrument:
                type: string
                description: 'The name of the instrument to be used to process the transaction.

                  For `pan`, if a Payment Service token is available, the API will use that

                  for stored payment methods.

                  '
                enum:
                - network_token
                - pan
                example: network_token
              transformations:
                type: array
                description: List of transformations to apply when processing the transaction.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the transformation.
                      example: force_mit
                      enum:
                      - force_mit
                      - use_additional_scheme
          example:
          - payment_service_id: fe26475d-ec3e-4884-9553-f7356683f7f9
            instrument": network_token
            transformations: []
          - payment_service_id: d88aca32-07fb-46cd-a43f-86da02b73c21
            instrument: pan
            transformations:
            - name: force_mit
        version:
          type: integer
          description: Version of the rule outcome. Current version is `2`.
          example: 2
          enum:
          - 2
    TransactionCardRequest:
      title: Card
      type: object
      description: Card payment method details to use in a transaction.
      x-tags:
      - Request Bodies
      required:
      - method
      - number
      - expiration_date
      properties:
        method:
          type: string
          description: '`card`.'
          example: card
          enum:
          - card
        number:
          type: string
          minLength: 13
          maxLength: 19
          example: '4111111111111111'
          pattern: ^[0-9]{13,19}$
          description: 'The 13-19 digit number for this card as it can be found on the

            front of the card.'
        expiration_date:
          type: string
          description: The expiration date of the card, formatted `MM/YY`.
          example: 11/25
          pattern: ^\d{2}/\d{2}$
