          type:
          - string
          - 'null'
          description: The external identifier of the related transaction.
          example: transaction-789123
        transaction_reconciliation_id:
          description: 'The base62 encoded transaction ID. This represents a shorter version

            of the related transaction''s `id` which is sent to payment services,

            anti-fraud services, and other connectors. You can use this ID to

            reconcile a payment service''s transaction against our system.'
          example: 7jZXl4gBUNl0CnaLEnfXbt
          type: string
    TransactionRefundRequest:
      title: Transaction Refund Request
      type: object
      description: A request to refund a transaction.
      x-tags:
      - Request Bodies
      properties:
        amount:
          type: integer
          description: 'The amount requested to refund.


            If omitted, a full refund will be requested for the main payment method.


            When set, the amount must be lower than or equal to the remaining balance

            in the associated transaction. Negative and zero-amount refunds are not

            supported.'
          minimum: 1
          maximum: 99999999
          example: 1299
        target_type:
          type:
          - string
          - 'null'
          description: 'The target type to refund for. This can be used to target a gift card

            to refund to instead of the main payment method.'
          example: gift-card-redemption
          default: payment-method
          enum:
          - payment-method
          - gift-card-redemption
        target_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The optional ID of the instrument to refund for. This is only required when

            the `target_type` is set to `gift-card-redemption`.'
          example: c23ea83f-1b1c-4584-a0e8-78ef8c041949
        reason:
          type:
          - string
          - 'null'
          description: An optional reason to attach extra context to the refund request.
          example: Refund due to user request
          maxLength: 100
        external_identifier:
          type:
          - string
          - 'null'
          description: 'An external identifier that can be used to match the refund against your

            own records.'
          example: refund-789123
          minLength: 1
          maxLength: 300
    GooglePayRequest:
      title: Google Pay payment method request
      type: object
