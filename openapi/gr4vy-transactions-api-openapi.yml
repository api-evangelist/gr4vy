          - list
        result:
          type: array
          description: Results for a given flow action.
          items:
            type: string
            example: fe26475d-ec3e-4884-9553-f7356683f7f9
            format: uuid
          example:
          - fe26475d-ec3e-4884-9553-f7356683f7f9
          - d88aca32-07fb-46cd-a43f-86da02b73c21
    ThreeDSecureDataV1:
      title: 3-D Secure Data Version 1
