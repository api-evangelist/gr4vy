    PaymentConnectorResponseTransactionAuthorizationFailedEvent:
      title: Authorization - Failed
      type: object
      description: 'This event logs the exact details parsed details for a failed authorization

        as reported by our connector.'
      x-tags:
      - Transactions
      properties:
        type:
          type: string
          description: The type of this resource. Is always `transaction-event`.
          example: transaction-event
          enum:
          - transaction-event
        id:
          type: string
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: The unique identifier for this event.
          format: uuid
        name:
          type: string
          description: The name of this resource. Is always `payment-connector-response-transaction-authorization-failed`.
          example: payment-connector-response-transaction-authorization-failed
          enum:
          - payment-connector-response-transaction-authorization-failed
        created_at:
          type: string
          description: The date and time when this transaction was created in our system.
          format: date-time
          example: '2013-07-16T19:23:00.000+00:00'
        context:
          type: object
          description: Additional context for this event.
          properties:
            payment_service_id:
              type: string
              format: uuid
              description: The unique ID of the payment service used.
            payment_service_display_name:
              type: string
              description: The display name of the payment service used.
            payment_service_definition_id:
              type: string
              description: The payment service definition used.
            payment_service_transaction_id:
              type:
              - string
              - 'null'
              description: The external ID of the transaction as set by the payment service.
              example: transaction-1234
            status:
              type: string
              enum:
              - authorization_failed
              description: 'The new status code for the transaction. This is always

                set to `authorization_failed`.'
              example: authorization_failed
            code:
              type:
              - string
              - 'null'
              description: A raw response code returned for the failure.
              example: INVALID DATA
            instrument_type:
              type: string
              example: pan
              enum:
              - pan
              - card_token
              - redirect
              - redirect_token
              - googlepay
              - applepay
              - network_token
              description: The type of instrument used for this transaction.
            retry_rule:
              type:
              - string
              - 'null'
              description: "Defines why the transaction might be retried. A retry is not guaranteed because\nthe maximum number of retries might already have been attempted.\n\n* `failure` - the transaction will be retried because of a failure calling\n  the payment service.\n* `retriable_decline` - the transaction will be retried because a decline code\n  was received that can be retried.\n* `payment_method_replacement` - the transaction will be retried because a\n  decline code was received that triggered a payment method replacement."
              enum:
              - failure
              - retriable_decline
              - payment_method_replacement
              example: failure
            raw_response_code:
              type:
              - string
              - 'null'
              description: 'This is the response code received from the payment service. This

                can be set to any value and is not standardized across different

                payment services.'
              example: incorrect-zip
            raw_response_description:
              type:
              - string
              - 'null'
              description: 'This is the response description received from the payment service. This

                can be set to any value and is not standardized across different

                payment services.'
              example: 'The card''s postal code is incorrect. Check the card''s postal code or use a

                different card.'
            auth_response_code:
              description: This is the response description received from the processor.
              example: '00'
              type:
              - string
              - 'null'
            avs_response_code:
              type:
              - string
              - 'null'
              description: 'The response code received from the payment service for the Address

                Verification Check (AVS). This code is mapped to a standardized Gr4vy

                AVS response code.


                - `no_match` - neither address or postal code match

                - `match` - both address and postal code match

                - `partial_match_address` - address matches but postal code does not

                - `partial_match_postcode` - postal code matches but address does not

                - `unavailable ` - AVS is unavailable for card/country


                The value of this field can be `null` if the payment service did not

                provide a response.'
              example: partial_match_address
              enum:
              - no_match
              - match
              - partial_match_address
              - partial_match_postcode
              - unavailable
            cvv_response_code:
              type:
              - string
              - 'null'
              description: 'The response code received from the payment service for the Card

                Verification Value (CVV). This code is mapped to a standardized Gr4vy

                CVV response code.


                - `no_match` - the CVV does not match the expected value

                - `match` - the CVV matches the expected value

                - `unavailable ` - CVV check unavailable for card our country

                - `not_provided ` - CVV not provided


                The value of this field can be `null` if the payment service did not

                provide a response.'
              example: match
              enum:
              - no_match
              - match
              - unavailable
            payment_method_scheme:
              description: The card scheme sent to the connector.
              type:
              - string
              - 'null'
              example: visa
              enum:
              - accel
              - amex
              - bancontact
              - carte-bancaire
              - cirrus
              - culiance
              - dankort
              - diners-club
              - discover
              - eftpos-australia
              - elo
              - hipercard
              - jcb
              - maestro
              - mastercard
              - mir
              - nyce
              - other
              - pulse
              - rupay
              - star
              - uatp
              - unionpay
              - visa
              - null
