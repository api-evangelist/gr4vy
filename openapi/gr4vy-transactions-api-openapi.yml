      x-tags:
      - Request Bodies
      required:
      - method
      - token
      properties:
        method:
          type: string
          description: '`googlepay`.'
          example: googlepay
          enum:
          - googlepay
        token:
          type: string
          description: 'The encrypted (opaque) token returned by the Google Pay API that

            represents a payment method.'
        card_suffix:
          type:
          - string
          - 'null'
          description: Last 4 digits of the PAN for identification purposes.
          example: '1234'
        card_scheme:
          type:
          - string
          - 'null'
          description: The scheme/brand of the card.
        card_type:
          type:
          - string
          - 'null'
          description: The type of card.
          example: credit
        assurance_details:
          type:
          - object
          - 'null'
          description: Information about the validation performed on the payment data. (See https://developers.google.com/pay/api/web/reference/response-objects#assurance-details-specifications).
          properties:
            account_verified:
              type:
              - boolean
              - 'null'
              example: false
              description: Indicates that card holder possession validation has been performed.
            card_holder_authenticated:
              type:
              - boolean
              - 'null'
              example: false
              description: Indicates that identification and verifications was performed.
        cardholder_name:
          type:
          - string
          - 'null'
          description: Name of the card holder.
        redirect_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'We strongly recommend providing a `redirect_url` either when 3-D

            Secure is enabled and `three_d_secure_data` is not provided, or when

            using connections where 3DS is enabled. This value will be appended

            with both a transaction ID and status

            (e.g. `https://example.com/callback?gr4vy_transaction_id=123

            &gr4vy_transaction_status=capture_succeeded`) after 3-D Secure has

            completed. For those cases, if the value is not present, the

            transaction will be marked as failed.'
          example: https://example.com/callback
    BillingDetailsRequest:
