    TransactionRequest:
      title: Transaction (Create)
      type: object
      description: A request to create a transaction.
      x-tags:
      - Request Bodies
      required:
      - amount
      - currency
      properties:
        amount:
          description: 'The monetary amount for this transaction, in the smallest

            currency unit for the given currency, for example `1299` cents to create

            an authorization for `$12.99`.


            If the `intent` is set to `capture`, an amount greater than zero must

            be supplied.


            All gift card amounts are subtracted from this amount before the

            remainder is charged to the provided `payment_method`.'
          type: integer
          example: 1299
          minimum: 0
          maximum: 99999999
        currency:
          type: string
          example: USD
          description: 'A supported ISO-4217 currency code.


            For redirect requests, this value must match the one specified for

            `currency` in `payment_method`.

            '
        payment_method:
          description: The optional payment method to use for this transaction. This field is required if no `gift_cards` have been added.
          oneOf:
          - $ref: '#/components/schemas/TransactionCardRequest'
          - $ref: '#/components/schemas/TransactionRedirectRequest'
          - $ref: '#/components/schemas/TokenizedRequest'
          - $ref: '#/components/schemas/ApplePayRequest'
          - $ref: '#/components/schemas/GooglePayRequest'
          - $ref: '#/components/schemas/TransactionCheckoutSessionRequest'
          - $ref: '#/components/schemas/TransactionNetworkTokenRequest'
          - $ref: '#/components/schemas/TransactionNetworkTokenApplePayRequest'
          - $ref: '#/components/schemas/TransactionNetworkTokenGooglePayRequest'
          type:
          - object
          - 'null'
          x-model-name: TransactionPaymentMethodRequest
        anti_fraud_fingerprint:
          default: null
          description: 'This field represents the fingerprint data to be passed to the active

            anti-fraud service.'
          example: yGeBAFYgFmM=
          type:
          - string
          - 'null'
        async_capture:
          default: false
          description: "Whether to capture the transaction asynchronously.\n\n- When `async_capture` is `false` (default), the transaction is captured\n  in the same request.\n- When `async_capture` is `true`, the transaction is automatically\n  captured at a later time.\n\nRedirect transactions are not affected by this flag.\n\nThis flag can only be set to `true` when `intent` is set to `capture`."
          example: true
          type: boolean
        browser_info:
          allOf:
          - $ref: '#/components/schemas/BrowserInfo'
          description: Information about the browser used by the buyer.
          type:
          - object
          - 'null'
        buyer_external_identifier:
          description: 'The `external_identifier` of the buyer to associate this payment method

            to. If this field is provided then the `buyer_id` field

            needs to be unset.


            If a stored payment method or gift card is provided, then the buyer for

            that payment method needs to match the buyer for this field.'
          example: user-789123
          type: string
        buyer_id:
          description: 'The ID of the buyer to associate this payment method to. If this field is

            provided then the `buyer_external_identifier` field needs to be unset.


            If a stored payment method or gift card is provided, then the buyer for

            that payment method needs to match the buyer for this field.'
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          format: uuid
          type: string
        buyer:
          description: 'Guest buyer details provided inline rather than creating a buyer resource

            beforehand and using the `buyer_id` or `buyer_external_identifier` keys.

            No buyer resource will be created on Gr4vy when used.'
          oneOf:
          - $ref: '#/components/schemas/TransactionBuyerRequest'
          type:
          - object
          - 'null'
          x-model-name: TransactionBuyerRequest
        cart_items:
          description: An array of cart items that represents the line items of a transaction.
          items:
            $ref: '#/components/schemas/CartItem'
          maxItems: 249
          type: array
        connection_options:
          allOf:
          - $ref: '#/components/schemas/ConnectionOptions'
          description: 'Allows for passing optional configuration per connection to take

            advantage of connection specific features. When provided, the data

            is only passed to the target connection type to prevent sharing

            configuration across connections.


            Please note that each of the keys this object are in kebab-case, for

            example `cybersource-anti-fraud` as they represent the ID of the

            connector. All the other keys will be snake case, for example

            `merchant_defined_data` or camel case to match an external API that the

            connector uses.'
          type:
          - object
          - 'null'
        country:
          description: 'The 2-letter ISO code of the country where the transaction is processed.

            This is also used to filter the payment services that can process the

            transaction.


            If this value is provided for redirect requests and it''s not `null`, it

            must match the one specified for `country` in `payment_method`. Otherwise,

            the value specified for `country` in `payment_method` will be assumed

            implicitly.

            '
          example: US
          type:
          - string
          - 'null'
        external_identifier:
          description: An external identifier that can be used to match the transaction against your own records.
          example: user-789123
          type:
          - string
          - 'null'
        gift_cards:
          description: 'The optional gift card(s) to use for this transaction. At least one gift card is required if no other `payment_method` has been added.

            By default, only a maximum limit of 10 gift cards may be used in a single transaction. Please contact our team to change this limit.'
          items:
            oneOf:
            - $ref: '#/components/schemas/TransactionGiftCardNewRequest'
            - $ref: '#/components/schemas/TransactionGiftCardStoredRequest'
            x-model-name: TransactionGiftCardRequest
          type:
          - array
          - 'null'
        intent:
          default: authorize
          description: 'Defines the intent of this API call. This determines the desired initial

            state of the transaction.


            * `authorize` - (Default) Optionally approves and then authorizes a

            transaction but does not capture the funds.

            * `capture` - Optionally approves and then authorizes and captures the

            funds of the transaction.'
          enum:
          - authorize
          - capture
          example: capture
          type: string
        is_subsequent_payment:
          default: false
          description: 'Indicates whether the transaction represents a subsequent payment

            coming from a setup recurring payment.

            Please note there are some restrictions on how this flag may be

            used.


            The flag can only be `false` (or not set) when the transaction meets

            one of the following criteria:


            * It is not `merchant_initiated`.

            * `payment_source` is set to `card_on_file`.


            The flag can only be set to `true` when the transaction meets one of the

            following criteria:


            * It is not `merchant_initiated`.

            * `payment_source` is set to `recurring` or `installment` and

            `merchant_initiated` is set to `true`.

            * `payment_source` is set to `card_on_file`.'
          example: true
          type: boolean
        merchant_initiated:
          default: false
          description: 'Indicates whether the transaction was initiated by the merchant (true)

            or customer (false).'
          example: true
          type: boolean
        metadata:
          additionalProperties:
            type: string
          description: 'Any additional information about the transaction that you would like to

            store as key-value pairs. This data is passed to payment service

            providers that support it.'
          example:
            key: value
          maxProperties: 20
          type: object
        payment_source:
          description: The source of the transaction. Defaults to `ecommerce`.
          type: string
          example: recurring
          enum:
          - ecommerce
          - moto
          - recurring
          - installment
          - card_on_file
        previous_scheme_transaction_id:
          default: null
          description: 'A scheme''s transaction identifier to use in connecting a merchant

            initiated transaction to a previous customer initiated transaction.


            If not provided, and a qualifying customer initiated transaction has been

            previously made, then Gr4vy will populate this value with the identifier

            returned for that transaction.


            e.g. the Visa Transaction Identifier, or Mastercard Trace ID.'
          example: '123456789012345'
          type:
          - string
          - 'null'
        shipping_details_id:
          default: null
          description: 'The unique identifier of a set of shipping details stored for the buyer.


            If provided, the created transaction will include a copy of the details

            at the point of transaction creation; i.e. it will not be affected by

            later changes to the detail in the database.'
          example: 47da6902-5eae-4b4b-88fd-856802d627d6
          format: uuid
          type:
          - string
          - 'null'
        statement_descriptor:
          allOf:
          - $ref: '#/components/schemas/StatementDescriptor'
          type:
          - object
          - 'null'
        store:
          default: false
          description: 'Whether or not to also try and store the payment method with us so that

            it can be used again for future use. This is only supported for payment

            methods that support this feature. There are also a few restrictions on

            how the flag may be set:


            * The flag has to be set to `true` when the `payment_source` is set to

            `recurring` or `installment`, and `merchant_initiated` is set to `false`.


            * The flag has to be set to `false` (or not set) when using a previously

            vaulted payment method.'
          example: true
          type: boolean
        three_d_secure_data:
          description: 'Pass through 3-D Secure data to support external 3-D Secure authorisation.

            If using an external 3-D Secure provider, you should not pass

            a `redirect_url` in the `payment_method` object for a transaction.'
          oneOf:
          - $ref: '#/components/schemas/ThreeDSecureDataV1'
          - $ref: '#/components/schemas/ThreeDSecureDataV2'
          type: object
          x-model-name: ThreeDSecureDataV1V2
        payment_service_id:
          default: null
          description: 'The unique identifier of an existing payment service. When

            provided, the created transaction will be processed by the given

            payment service and any routing rules will be skipped.'
          example: 47da6902-5eae-4b4b-88fd-856802d627d6
          type:
          - string
          - 'null'
          format: uuid
        airline:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Airline'
          description: 'The airline addendum data which describes the airline booking

            associated with this transaction.'
        account_funding_transaction:
          type:
          - boolean
          - 'null'
          default: false
          description: Whether or not the transaction is an account funding transaction.
          example: true
        recipient:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Recipient'
          description: The recipient of an account funding transaction.
        allow_partial_authorization:
          type:
          - boolean
          - 'null'
          default: false
          description: 'Whether or not to allow partial authorization of the transaction. Support for this will depend

            on the connector used. When a connector does not support partial authorization, and the user does not

            have sufficient funds, the transaction will be declined.'
          example: true
