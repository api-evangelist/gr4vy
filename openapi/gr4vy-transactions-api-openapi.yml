    Transaction:
      title: Transaction
      type: object
      description: A transaction record.
      x-tags:
      - Transactions
      properties:
        type:
          type: string
          description: The type of this resource. Is always `transaction`.
          example: transaction
          enum:
          - transaction
        id:
          type: string
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: The unique identifier for this transaction.
          format: uuid
        amount:
          description: 'The total amount for this transaction across all funding sources

            including gift cards.'
          example: 1299
          maximum: 99999999
          minimum: 0
          type: integer
        additional_identifiers:
          description: 'A list of additional identifiers that we may keep track of to manage this transaction. This

            may include the authorization ID, capture ID, and processor ID, as well as an undefined list of

            additional identifiers.'
          allOf:
          - $ref: '#/components/schemas/AdditionalIdentifiers'
        auth_response_code:
          description: This is the response description received from the processor.
          example: '00'
          type:
          - string
          - 'null'
        authorized_amount:
          description: 'The amount for this transaction that has been authorized for the `payment_method`.

            This can be less than the `amount` if gift cards were used.'
          example: 1299
          maximum: 99999999
          minimum: 0
          type: integer
        authorized_at:
          description: 'The date and time when this transaction was authorized in the payment

            service.


            Don''t use this field to determine whether the transaction was authorized.

            A `null` value doesn''t necessarily imply that the transaction wasn''t

            authorized, it can mean that the payment service doesn''t provide this

            value, that it didn''t provide it at the time the transaction was

            authorized or that the transaction was authorized before the introduction

            of this field.'
          example: '2013-07-16T19:23:00.000+00:00'
          format: date-time
          type:
          - string
          - 'null'
        approval_expires_at:
          description: 'The date and time when this transaction will be marked as failed if it does

            not successfully gets captured, authorized or otherwise approved before.'
          example: '2013-07-16T19:23:00.000+00:00'
          format: date-time
          type:
          - string
          - 'null'
        avs_response_code:
          description: 'The response code received from the payment service for the Address

            Verification Check (AVS). This code is mapped to a standardized Gr4vy

            AVS response code.


            - `no_match` - neither address or postal code match

            - `match` - both address and postal code match

            - `partial_match_address` - address matches but postal code does not

            - `partial_match_postcode` - postal code matches but address does not

            - `unavailable ` - AVS is unavailable for card/country


            The value of this field can be `null` if the payment service did not

            provide a response.'
          enum:
          - no_match
          - match
          - partial_match_address
          - partial_match_postcode
          - unavailable
          example: partial_match_address
          type:
          - string
          - 'null'
        buyer:
          allOf:
          - $ref: '#/components/schemas/Buyer--Snapshot'
          description: The buyer used for this transaction.
        captured_amount:
          description: 'The captured amount for this transaction. This can be the full value

            of the `authorized_amount` or less.'
          example: 999
          maximum: 99999999
          minimum: 0
          type: integer
        captured_at:
          description: 'The date and time when this transaction was captured in the payment

            service.


            Don''t use this field to determine whether the transaction was captured.

            A `null` value doesn''t necessarily imply that the transaction wasn''t

            captured, it can mean that the payment service doesn''t provide this value,

            that it didn''t provide it at the time the transaction was captured or that

            the transaction was captured before the introduction of this field.'
          example: '2013-07-16T19:23:00.000+00:00'
          format: date-time
          type:
          - string
          - 'null'
        cart_items:
          description: An array of cart items that represents the line items of a transaction.
          items:
            $ref: '#/components/schemas/CartItem'
          maxLength: 249
          type: array
        checkout_session_id:
          description: The identifier for the checkout session this transaction is associated with.
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          format: uuid
          type:
          - string
          - 'null'
        country:
          description: 'The 2-letter ISO code of the country of the transaction.

            This is used to filter the payment services that is used to process the

            transaction.

            '
          example: US
          type:
          - string
          - 'null'
        created_at:
          description: The date and time when this transaction was created in our system.
          example: '2013-07-16T19:23:00.000+00:00'
          format: date-time
          type: string
        currency:
          description: The currency code for this transaction.
          example: USD
          type: string
        cvv_response_code:
          description: 'The response code received from the payment service for the Card

            Verification Value (CVV). This code is mapped to a standardized Gr4vy

            CVV response code.


            - `no_match` - the CVV does not match the expected value

            - `match` - the CVV matches the expected value

            - `unavailable ` - CVV check unavailable for card our country

            - `not_provided ` - CVV not provided


            The value of this field can be `null` if the payment service did not

            provide a response.'
          enum:
          - no_match
          - match
          - unavailable
          - not_provided
          example: match
          type:
          - string
          - 'null'
        error_code:
          description: This is an error code set by Gr4vy.
          example: missing_redirect_url
          type:
          - string
          - 'null'
        external_identifier:
          description: An external identifier that can be used to match the transaction against your own records.
          example: user-789123
          type:
          - string
          - 'null'
        gift_card_service:
          allOf:
          - $ref: '#/components/schemas/GiftCardService--Snapshot'
          description: The gift card service used for this transaction.
        gift_card_redemptions:
          description: The gift cards redeemed for this transaction.
          items:
            $ref: '#/components/schemas/GiftCardRedemption'
          type: array
        instrument_type:
          type:
          - string
          - 'null'
          description: 'The name of the instrument used to process the transaction.

            '
          enum:
          - applepay
          - card_token
          - googlepay
          - network_token
          - pan
          - redirect
          - redirect_token
          example: network_token
        intent:
          description: 'The original `intent` used when the transaction was

            [created](#operation/authorize-new-transaction).'
          enum:
          - authorize
          - capture
          example: authorize
          type: string
        intent_outcome:
          description: 'The outcome of the original intent of a transaction.


            This allows you to understand if the intent of the transaction

            (e.g. `capture` or `authorize`) has been achieved when dealing with multiple

            payment instruments.


            If all payment instruments (`payment_method` and/or `gift_cards`)

            have succeeded to get an authorization or direct sale **at any point

            in time** then this will return a `succeeded` value.


            If any of the payment instruments fails or declines then this will

            return a `failed` value.


            If any payment instruments is still in a `pending` or `processing` state

            then the result will be `pending`.


            Please note that if any of the payment instruments are voided or refunded

            after the result reaches a `succeeded` state  then the result will remain

            unchanged.'
          enum:
          - pending
          - succeeded
          - failed
          example: pending
          type: string
        is_subsequent_payment:
          default: false
          description: 'Indicates whether the transaction represents a subsequent payment

            coming from a setup recurring payment.

            Please note there are some restrictions on how this flag may be

            used.


            The flag can only be `false` (or not set) when the transaction meets

            one of the following criteria:


            * It is not `merchant_initiated`.

            * `payment_source` is set to `card_on_file`.


            The flag can only be set to `true` when the transaction meets one of the

            following criteria:


            * It is not `merchant_initiated`.

            * `payment_source` is set to `recurring` or `installment` and

            `merchant_initiated` is set to `true`.

            * `payment_source` is set to `card_on_file`.'
          example: true
          type: boolean
        merchant_account_id:
          description: The ID of the merchant account to which this transaction belongs to.
          example: default
          maximum: 22
          minimum: 1
          type: string
        merchant_initiated:
          default: false
          description: 'Indicates whether the transaction was initiated by the merchant (true)

            or customer (false).'
          example: true
          type: boolean
        metadata:
          additionalProperties:
            type: string
          description: Additional information about the transaction stored as key-value pairs.
          example:
