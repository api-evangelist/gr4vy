openapi: 3.2.0
info:
  title: Gr4vy Transactions API
  version: '1.0'
  description: 'Operations tagged Transactions across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Transactions
  description: 'In Gr4vy, a transaction represents a payment in any state, either before it

    is authorized, once it is captured, or after it has been refunded.


    The transactions API can be used to:


    - Authorize, capture, and store cards.

    - Authorize, capture, and store alternative payment methods like PayPal.

    - Refund, void, and otherwise cancel existing transactions.'
paths:
  /transactions:
    get:
      operationId: list-transactions
      summary: List transactions
      description: Lists all transactions for an account. Sorted by last updated at.
      tags:
      - Transactions
      parameters:
      - schema:
          type: string
          example: user-12345
        in: query
        name: buyer_external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that matches this value.'
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: buyer_id
        description: 'Filters the results to only the items for which the `buyer` has an

          `id` that matches this value.'
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 500
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: integer
          example: 500
        in: query
        name: amount_eq
        description: 'Filters for transactions that have an `amount` that is

          equal to the provided `amount_eq` value.'
      - schema:
          type: integer
          example: 500
        in: query
        name: amount_gte
        description: 'Filters for transactions that have an `amount` that is

          greater than or equal to the `amount_gte` value.'
      - schema:
          type: integer
          example: 500
        in: query
        name: amount_lte
        description: 'Filters for transactions that have an `amount` that is

          less than or equal to the `amount_lte` value.'
      - schema:
          type: string
          format: uuid
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: checkout_session_id
        description: Filters for transactions that are linked to the unique ID for a Checkout Session.
      - schema:
          type: string
          format: date-time
          example: '2022-01-01T12:00:00+08:00'
        in: query
        name: created_at_gte
        description: 'Filters the results to only transactions created after this ISO

          date-time string. The time zone must be included.


          Ensure that the date-time string is URL encoded, e.g.

          `2022-01-01T12:00:00+08:00` must be encoded as

          `2022-01-01T12%3A00%3A00%2B08%3A00`.'
      - schema:
          type: string
          format: date-time
          example: '2022-01-01T12:00:00+08:00'
        in: query
        name: created_at_lte
        description: 'Filters the results to only transactions created before this ISO

          date-time string. The time zone must be included.


          Ensure that the date-time string is URL encoded, e.g.

          `2022-01-01T12:00:00+08:00` must be encoded as

          `2022-01-01T12%3A00%3A00%2B08%3A00`.'
      - schema:
          type: array
          items:
            type: string
          example:
          - USD
          - GBP
        in: query
        name: currency
        description: 'Filters for transactions that have matching `currency` values.

          The `currency` values provided must be formatted as 3-letter ISO

          currency code.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: external_identifier
        description: 'Filters the results to only the items for which the `external_identifier`

          matches this value.'
      - schema:
          type: string
          example: be828248-56de-481e-a580-44b6e1d4df81
          format: uuid
        in: query
        name: gift_card_id
        description: 'Filters for transactions that have at least one gift card

          redemption with a matching `gift_card_id` value.'
      - schema:
          type: string
          example: '7890'
          minLength: 4
          maxLength: 4
        in: query
        name: gift_card_last4
        description: 'Filters for transactions that have at least one gift card

          redemption where the last 4 digits of its gift card number

          matches exactly with the provided value.'
      - schema:
          type: boolean
          example: true
        in: query
        name: has_gift_card_redemptions
        description: 'When set to `true`, filters for transactions that have at least one gift

          card redemption associated with it. When set to `false`, filter for

          transactions that have no gift card redemptions.'
      - schema:
          type: boolean
          example: true
        in: query
        name: has_refunds
        description: 'When set to `true`, filter for transactions that have at least one completed

          refund (including gift card refunds) associated with it. When set to `false`,

          filter for transactions that have no completed refunds.'
      - schema:
          type: boolean
          example: true
        in: query
        name: has_settlements
        description: 'When set to `true`, filter for transactions that have at least one settlement.

          When set to `false`, filter for transactions that have no settlements.'
      - schema:
          type: string
          example: be828248-56de-481e-a580-44b6e1d4df81
          format: uuid
        in: query
        name: id
        description: Filters for the transaction that has a matching `id` value.
      - schema:
          type: array
          items:
            type: string
          example:
          - '{"key": "value"}'
          - '{"key_one": "value", "key_two": "value"}'
        explode: true
        in: query
        name: metadata
        description: 'Filters for transactions where their `metadata` values

          contain all of the provided `metadata` keys. The value sent

          for `metadata` must be formatted as a JSON string, and all

          keys and values must be strings. This value should also be URL

          encoded.


          Duplicate keys are not supported. If a key is duplicated, only the

          last appearing value will be used.'
      - schema:
          type: array
          example:
          - card
          items:
            type: string
            example: card
            enum:
            - affirm
            - afterpay
            - alipay
            - alipayhk
            - applepay
            - bacs
            - bancontact
            - banked
            - becs
            - bitpay
            - boleto
            - boost
            - card
            - cashapp
            - chaseorbital
            - checkout-session
            - clearpay
            - click-to-pay
            - dana
            - dcb
            - dlocal
            - ebanx
            - efecty
            - eps
            - everydaypay
            - gcash
            - gem
            - gemds
            - gift-card
            - giropay
            - givingblock
            - gocardless
            - googlepay
            - googlepay_pan_only
            - gopay
            - grabpay
            - id
            - ideal
            - kakaopay
            - kcp
            - klarna
            - latitude
            - latitudeds
            - laybuy
            - linepay
            - linkaja
            - maybankqrpay
            - mercadopago
            - multibanco
            - multipago
            - netbanking
            - network-token
            - oney_3x
            - oney_4x
            - oney_6x
            - oney_10x
            - oney_12x
            - ovo
            - oxxo
            - payid
            - paymaya
            - paypal
            - paypalpaylater
            - payto
            - venmo
            - pix
            - pse
            - rabbitlinepay
            - razorpay
            - scalapay
            - sepa
            - shopeepay
            - singteldash
            - smartpay
            - sofort
            - spei
            - stripedd
            - thaiqr
            - touchngo
            - truemoney
            - trustly
            - trustlyeurope
            - upi
            - vipps
            - waave
            - webpay
            - wechat
            - zippay
        in: query
        name: method
        description: 'Filters the results to only the items for which the `method` has been set to

          this value.'
      - schema:
          type: string
          example: 46973e9d-88a7-44a6-abfe-be4ff0134ff4
          format: uuid
        in: query
        name: payment_method_id
        description: Filters for transactions that have a payment method with an ID that matches exactly with the provided value.
      - schema:
          type: string
          example: '1234'
        in: query
        name: payment_method_label
        description: 'Filters for transactions that have a payment method with a label

          that matches exactly with the provided value.'
      - schema:
          type: array
          items:
            type: string
            format: uuid
          example:
          - 46973e9d-88a7-44a6-abfe-be4ff0134ff4
        in: query
        name: payment_service_id
        description: 'Filters for transactions that were processed by the provided

          `payment_service_id` values.'
      - schema:
          type: string
          example: transaction_123
        in: query
        name: payment_service_transaction_id
        description: 'Filters for transactions that have a matching

          `payment_service_transaction_id` value. The `payment_service_transaction_id`

          is the identifier of the transaction given by the payment service.'
      - schema:
          type: boolean
          example: true
        in: query
        name: pending_review
        description: 'When set to `true`, filter for transactions that have a manual review pending.

          When set to `false`, filter for transactions that don''t have a manual review pending.'
      - schema:
          type: string
          format: string
          example: 7EgeeeTX0DS45RBDNt4AEY
        in: query
        name: reconciliation_id
        description: Filters for transactions based on their transaction reconciliation identifier.
      - schema:
          type: string
          example: be828248-56de-481e-a580-44b6e1d4df81
        in: query
        name: search
        deprecated: true
        description: 'Filters for transactions that have one of the following fields

          match exactly with the provided `search` value.


          * `buyer_external_identifier`

          * `buyer_id`

          * `external_identifier`

          * `id`

          * `payment_service_transaction_id`


          The search will apply against all fields at the same time.

          Please do not use this query parameter in a production application, as this API call is

          very inefficient and may negatively impact transaction performance.'
      - schema:
          type: array
          items:
            type: string
            enum:
            - processing
            - buyer_approval_pending
            - authorization_succeeded
            - authorization_failed
            - authorization_declined
            - capture_pending
            - capture_succeeded
            - authorization_void_pending
            - authorization_voided
          example:
          - capture_succeeded
          - processing
        in: query
        name: status
        description: 'Filters the results to only the transactions that have a `status`

          that matches with any of the provided status values.'
      - schema:
          type: string
          format: date-time
          example: '2022-01-01T12:00:00+08:00'
        in: query
        name: updated_at_gte
        description: 'Filters the results to only transactions last updated after this ISO

          date-time string. The time zone must be included.


          Ensure that the date-time string is URL encoded, e.g.

          `2022-01-01T12:00:00+08:00` must be encoded as

          `2022-01-01T12%3A00%3A00%2B08%3A00`.'
      - schema:
          type: string
          format: date-time
          example: '2022-01-01T12:00:00+08:00'
        in: query
        name: updated_at_lte
        description: 'Filters the results to only transactions last updated before this ISO

          date-time string. The time zone must be included.


          Ensure that the date-time string is URL encoded, e.g.

          `2022-01-01T12:00:00+08:00` must be encoded as

          `2022-01-01T12%3A00%3A00%2B08%3A00`.'
      - schema:
          type: boolean
          example: true
        in: query
        name: is_subsequent_payment
        description: 'When set to `true`, filter for transactions that are a subsequent payment.

          When set to `false`, filter for transactions that are not an initial payment.'
      - schema:
          type: boolean
          example: true
        in: query
        name: merchant_initiated
        description: 'When set to `true`, filter for transactions that are merchant initiated.

          When set to `false`, filter for transactions that are not merchant initiated.'
      - schema:
          type: string
          example: '411111'
        in: query
        name: payment_method_bin
        description: Filter for transactions that have a card with a BIN that matches exactly with the provided value.
      - schema:
          type: array
          example:
          - ecommerce
          - recurring
          items:
            type: string
            example: recurring
            enum:
            - ecommerce
            - moto
            - recurring
            - installment
            - card_on_file
        in: query
        name: payment_source
        description: Filters the results to only the transactions that have a payment source that matches with any of the provided values.
      responses:
        '200':
          description: Returns a paginated list of transactions for an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactions'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      x-speakeasy-pagination:
        type: cursor
        inputs:
        - name: cursor
          in: parameters
          type: cursor
        outputs:
          nextCursor: $.next_cursor
      security:
      - bearerAuth: []
    post:
      summary: New transaction
      tags:
      - Transactions
      operationId: new-transaction
      description: 'Attempts to create an authorization for a payment method. In some cases it is

        not possible to create the authorization without redirecting the user for

        their authorization. In these cases the status is set to

        indicate buyer approval is pending and an approval URL is returned.


        Duplicated gift card numbers are not supported. This includes both stored gift

        cards, as well as those directly provided via the request.'
      parameters:
      - schema:
          type: string
          maxLength: 255
          example: bffa9ce6-7a8a-449c-889a-65bd2ee86903
        in: header
        name: Idempotency-Key
        description: 'A unique key that identifies this request. Providing this header will make

          this an idempotent request. We recommend using V4 UUIDs, or another random

          string with enough entropy to avoid collisions.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            examples:
              Authorize a new card:
                value:
                  amount: 1299
                  currency: USD
                  payment_method:
                    method: card
                    number: '4111111111111111'
                    expiration_date: 11/25
                    security_code: '123'
                    redirect_url: https://example.com/callback
              Authorize and store a card:
                value:
                  amount: 1299
                  currency: USD
                  store: true
                  payment_method:
                    method: card
                    number: '4111111111111111'
                    expiration_date: 11/25
                    security_code: '123'
                    redirect_url: https://example.com/callback
              Authorize, capture, and store a card:
                value:
                  amount: 1299
                  currency: USD
                  intent: capture
                  store: true
                  payment_method:
                    method: card
                    number: '4111111111111111'
                    expiration_date: 11/25
                    security_code: '123'
                    redirect_url: https://example.com/callback
              Authorize and capture a GoCardless transaction:
                value:
                  amount: 1299
                  currency: USD
                  intent: capture
                  payment_method:
                    method: gocardless
                    redirect_url: https://example.com/callback
                    country: US
                    currency: USD
              Authorize and capture using a previously stored card:
                value:
                  amount: 1299
                  currency: USD
                  intent: capture
                  payment_method:
                    method: id
                    id: 46973e9d-88a7-44a6-abfe-be4ff0134ff4
              Authorize a new card with connection options and anti-fraud fingerprint:
                value:
                  amount: 1299
                  currency: USD
                  payment_method:
                    method: card
                    number: '4111111111111111'
                    expiration_date: 11/25
                    security_code: '123'
                    redirect_url: https://example.com/callback
                  connection_options:
                    cybersource-anti-fraud:
                      merchant_defined_data:
                        '1': John Doe
                        '2': trusted
                        '99': recurring
                  anti_fraud_fingerprint: yGeBAFYgFmM=
              Authorize and asynchronously capture a card transaction:
                value:
                  amount: 1299
                  currency: USD
                  intent: capture
                  async_capture: true
                  payment_method:
                    method: card
                    number: '4111111111111111'
                    expiration_date: 11/25
                    security_code: '123'
                    redirect_url: https://example.com/callback
      responses:
        '201':
          description: Returns the created transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '409':
          description: Returns an error if duplicate resource has been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409DuplicateRecord'
        '429':
          description: 'Returns an error if the same token is used for too many requests per minute.

            The exact rate limit differs per instance.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429TooManyRequests'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /transactions/{transaction_id}:
    parameters:
    - schema:
        type: string
        example: fe26475d-ec3e-4884-9553-f7356683f7f9
      name: transaction_id
      in: path
      required: true
      description: The ID for the transaction to get the information for.
    get:
      operationId: get-transaction
      summary: Get transaction
      description: Get information about a transaction.
      tags:
      - Transactions
      responses:
        '200':
          description: Returns a transaction resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found or has not yet been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      tags:
      - Transactions
      summary: Manually update a transaction
      description: Manually updates a transaction.
      operationId: update_transaction
      security:
      - OAuth2PasswordBearer:
        - transactions.write
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the transaction
          examples:
          - 7099948d-7286-47e4-aad8-b68f7eb44591
          title: Transaction Id
        description: The ID of the transaction
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction_2'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: update
      x-speakeasy-group: transactions
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /transactions/{transaction_id}/actions:
    parameters:
    - schema:
        type: string
        example: fe26475d-ec3e-4884-9553-f7356683f7f9
      name: transaction_id
      in: path
      required: true
      description: The ID for the transaction to get the information for.
    get:
      operationId: get-transaction-actions
      summary: List actions for transaction
      description: Gets actions for a given transaction.
      tags:
      - Transactions
      x-internal: true
      responses:
        '200':
          description: Returns associated actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actions'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /transactions/{transaction_id}/capture:
    parameters:
    - schema:
        type: string
        example: fe26475d-ec3e-4884-9553-f7356683f7f9
      name: transaction_id
      in: path
      required: true
      description: The ID for the transaction to get the information for.
    post:
      operationId: capture-transaction
      summary: Capture transaction
      description: Captures a previously authorized transaction.
      tags:
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCaptureRequest'
            examples:
