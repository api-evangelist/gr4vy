openapi: 3.2.0
info:
  title: Gr4vy Merchant Accounts API
  version: '1.0'
  description: 'Operations tagged Merchant Accounts across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Merchant Accounts
  description: 'In Gr4vy, a merchant account represents an individual merchant in an

    instance. Each instance has one or more merchant accounts, and each

    merchant account has its own connections, Flow rules, transactions, and

    more.'
paths:
  /merchant-accounts:
    get:
      operationId: list-merchant-accounts
      summary: List merchant accounts
      description: Lists all merchant accounts in an instance.
      tags:
      - Merchant Accounts
      responses:
        '200':
          description: Returns a paginated list of merchant accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAccounts'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: new-merchant-account
      summary: New merchant account
      description: 'Create a merchant account. Optionally, provide an `outbound_webhook_url`, and

        if HTTP Basic Authentication is required, provide the

        `outbound_webhook_username` and `outbound_webhook_password`. When retrieving

        a Merchant Account the `outbound_webhook_password` will be omitted.


        Optionally provide Network Tokens configuration per scheme. If done, all

        parameters for the same scheme must be provided.'
      tags:
      - Merchant Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantAccountCreate'
            examples:
              Create a merchant account:
                value:
                  id: plantly-uk
                  display_name: Plantly UK
                  outbound_webhook_url: https://www.example.com/webhook
                  outbound_webhook_username: gr4vy
                  outbound_webhook_password: super-secret-password
                  visa_network_tokens_requestor_id: e50fa0da-903d-4d54-aacc-4cac57d48df2
                  visa_network_tokens_app_id: ca12b3d0-4e23-41a9-906f-e5cbb8e6a731
      responses:
        '201':
          description: Returns the created merchant account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAccount'
              examples:
                Merchant Account:
                  value:
                    type: merchant-account
                    id: plantly-uk
                    display_name: Plantly UK
                    outbound_webhook_url: https://www.example.com/webhook
                    outbound_webhook_username: gr4vy
                    visa_network_tokens_requestor_id: e50fa0da-903d-4d54-aacc-4cac57d48df2
                    visa_network_tokens_app_id: ca12b3d0-4e23-41a9-906f-e5cbb8e6a731
                    created_at: '2022-02-01T14:20:00.000+00:00'
                    updated_at: '2022-02-01T14:20:00.000+00:00'
        '400':
          description: Returns an error if the request was badly formatted, missing required fields or configuration doesn't meet uniqueness conditions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '409':
          description: Returns an error if duplicate resource has been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409DuplicateRecord'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /merchant-accounts/{merchant_account_id}:
    parameters:
    - schema:
        type: string
        example: plantly-uk
      name: merchant_account_id
      in: path
      required: true
      description: The unique ID for a merchant account.
    get:
      operationId: get-merchant-account
      summary: Get merchant account
      description: Retrieves details of a merchant account.
      tags:
      - Merchant Accounts
      responses:
        '200':
          description: Returns a merchant account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAccount'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      operationId: update-merchant-account
      summary: Update merchant account
      description: 'Update an existing merchant account. Optionally, provide an

        `outbound_webhook_url`, and if HTTP Basic Authentication is required, provide

        the `outbound_webhook_username` and `outbound_webhook_password`. When

        retrieving a Merchant Account the `outbound_webhook_password` will be omitted.


        Optionally provide Network Tokens configuration per scheme. If done, all

        parameters for the same scheme must be provided.'
      tags:
      - Merchant Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantAccountUpdate'
            examples:
              Update a merchant account:
                value:
                  display_name: Plantly UK
                  outbound_webhook_url: https://www.example.com/webhook
                  outbound_webhook_username: gr4vy
                  outbound_webhook_password: super-secret-password
                  visa_network_tokens_requestor_id: e50fa0da-903d-4d54-aacc-4cac57d48df2
                  visa_network_tokens_app_id: ca12b3d0-4e23-41a9-906f-e5cbb8e6a731
      responses:
        '200':
          description: Returns the updated merchant account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAccount'
        '400':
          description: Returns an error if the request was badly formatted, missing required fields or configuration doesn't meet uniqueness conditions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-merchant-accuont
      summary: Delete merchant account
      description: Deletes a specific merchant account.
      tags:
      - Merchant Accounts
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    MerchantAccounts:
      title: Merchant Accounts
      type: object
      x-tags:
      - Merchant Accounts
      properties:
        items:
          type: array
          description: A list of merchant accounts.
          items:
            $ref: '#/components/schemas/MerchantAccount'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
    MerchantAccountUpdate:
      title: Merchant Account (Update)
      type: object
      description: A request to update a merchant account.
      x-tags:
      - Merchant Accounts
      properties:
        display_name:
          type: string
          description: The human-readable name of the merchant account.
          example: Plantly UK
          minLength: 1
          maxLength: 255
        outbound_webhook_url:
          type:
          - string
          - 'null'
          description: The optional URL where webhooks will be received.
          example: https://www.example.com/webhook
        outbound_webhook_username:
          type:
          - string
          - 'null'
          description: 'The optional username to use when `outbound_webhook_url` is configured and

            requires basic authentication.'
          example: gr4vy
        outbound_webhook_password:
          type:
          - string
          - 'null'
          description: 'The optional password to use when `outbound_webhook_url` is configured and

            requires basic authentication.'
          example: super-secret-password
        visa_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: 'Requestor ID provided for Visa after onboarding to use Network Tokens.

            The requestor ID must be unique across all schemes and merchant accounts.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
          maxLength: 300
        visa_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: 'Application ID provided for Visa after onboarding to use Network

            Tokens. The application ID must be unique across all schemes and merchant

            accounts.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
          maxLength: 300
        amex_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: 'Requestor ID provided for Amex after onboarding to use Network Tokens.

            The requestor ID must be unique across all schemes and merchant accounts.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
          maxLength: 300
        amex_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: Application ID provided for Amex after onboarding to use Network Tokens. The application ID must be unique across all schemes and merchant accounts.
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
          maxLength: 300
        mastercard_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: 'Requestor ID provided for Mastercard after onboarding to use Network

            Tokens. The requestor ID must be unique across all schemes and merchant

            accounts.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
          maxLength: 300
        mastercard_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: 'Application ID provided for Mastercard after onboarding to use

            Network Tokens. The application ID must be unique across all schemes and

            merchant accounts.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
          maxLength: 300
        loon_client_key:
          type:
          - string
          - 'null'
          minLength: 1
          description: 'Client key provided by Pagos to authenticate to the Loon API.

            Loon is the Account Updater service used by Gr4vy.


            * If the field is not set, the Account Updater service configuration is not updated.

            * If the field is set to `null`, the Account Updater service is disabled.

            * If the field is set to `null`, the other `loon_*` fields must be set to `null` as well.'
        loon_secret_key:
          type:
          - string
          - 'null'
          minLength: 1
          description: 'Secret key provided by Pagos to authenticate to the Loon API.

            Loon is the Account Updater service used by Gr4vy.


            * If the field is not set, the Account Updater service configuration is not updated.

            * If the field is set to `null`, the Account Updater service is disabled.

            * If the field is set to `null`, the other `loon_*` fields must be set to `null` as well.'
        loon_accepted_schemes:
          type:
          - array
          - 'null'
          items:
            type: string
            example: visa
            enum:
            - accel
            - amex
            - bancontact
            - carte-bancaire
            - cirrus
            - culiance
            - dankort
            - diners-club
            - discover
            - eftpos-australia
            - elo
            - hipercard
            - jcb
            - maestro
            - mastercard
            - mir
            - nyce
            - other
            - pulse
            - rupay
            - star
            - uatp
            - unionpay
            - visa
            - null
          description: 'Card schemes accepted when creating jobs using this set of Loon API keys.

            Loon is the Account Updater service used by Gr4vy.


            * If the field is not set, the Account Updater service configuration is not updated.

            * If the field is set to `null`, the Account Updater service is disabled.

            * If the field is set to `null`, the other `loon_*` fields must be set to `null` as well.'
        over_capture_amount:
          type:
          - number
          - 'null'
          example: 1000
          minimum: 1
          maximum: 99999999
          description: 'The maximum monetary amount allowed for over-capture, in the smallest

            currency unit, for example `1299` cents to allow for an over-capture of `$12.99`.'
        over_capture_percentage:
          type:
          - number
          - 'null'
          example: 20
          minimum: 1
          maximum: 99999999
          description: 'The maximum percentage allowed for over-capture, for example `25` to allow for an

            over-capture of 25% of the original transaction amount.'
        account_updater_enabled:
          type: boolean
          example: true
          default: false
          description: 'Whether the Realtime Account Updater service is enabled for this merchant account.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `false`, the Account Updater service

            doesn''t get called if a payment fails with expired or invalid card details.

            * If the field is set to `true`, the service is called. Please note that for this to work

            the other `account_updater_*` fields must be set as well.'
        account_updater_request_encryption_key:
          type:
          - string
          - 'null'
          example: example-encryption-key
          description: 'The public key used to encrypt the request to the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
        account_updater_request_encryption_key_id:
          type:
          - string
          - 'null'
          example: example-encryption-key-id
          description: 'The public key ID used to encrypt the request to the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
        account_updater_response_decryption_key:
          type:
          - string
          - 'null'
          example: example-decryption-key
          description: 'The private key used to decrypt the response from the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
        account_updater_response_decryption_key_id:
          type:
          - string
          - 'null'
          example: example-decryption-key-id
          description: 'The private key ID used to decrypt the response from the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    Error409DuplicateRecord:
      title: Duplicate Record Error
      type: object
      description: Duplicate Record Error (HTTP 409).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`duplicate_record`.'
          example: duplicate_record
          enum:
          - duplicate_record
        status:
          type: integer
          description: '`409`.'
          example: 409
          enum:
          - 409
        message:
          type: string
          description: Further details on the field that triggered the error.
          example: A duplicate record exists with this external_identifier value
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    MerchantAccount:
      title: Merchant Account
      type: object
      x-tags:
      - Merchant Account
      properties:
        type:
          type: string
          description: '`merchant-account`.'
          example: merchant-account
          enum:
          - merchant-account
        id:
          type: string
          description: The ID for this merchant account.
          example: plantly-uk
        display_name:
          type: string
          description: The display name of this merchant account.
          example: Plantly UK
        outbound_webhook_url:
          type:
          - string
          - 'null'
          format: uri
          description: The optional URL where webhooks will be received.
          example: https://www.example.com/webhook
        outbound_webhook_username:
          type:
          - string
          - 'null'
          description: 'The optional username to use when `outbound_webhook_url` is configured and

            requires basic authentication.'
          example: gr4vy
        outbound_webhook_password:
          type:
          - string
          - 'null'
          description: 'The optional password to use when `outbound_webhook_url` is configured and

            requires basic authentication.


            If the field is not `null`, the value is masked to avoid exposing sensitive information.'
          example: '********'
        visa_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: Requestor ID provided for Visa after onboarding to use Network Tokens.
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        visa_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: 'Application ID provided for Visa after onboarding to use Network

            Tokens.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        amex_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: Requestor ID provided for Amex after onboarding to use Network Tokens.
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        amex_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: Application ID provided for Amex after onboarding to use Network Tokens.
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        mastercard_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: 'Requestor ID provided for Mastercard after onboarding to use Network

            Tokens.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        mastercard_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: 'Application ID provided for Mastercard after onboarding to use

            Network Tokens.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        loon_client_key:
          type:
          - string
          - 'null'
          description: 'Client key provided by Pagos to authenticate to the Loon API.

            Loon is the Account Updater service used by Gr4vy.'
          example: 7DD771287D0024BA418F8F7ECC7DF1CD
        loon_secret_key:
          type:
          - string
          - 'null'
          description: 'Secret key provided by Pagos to authenticate to the Loon API.

            Loon is the Account Updater service used by Gr4vy.


            If the field is not `null`, the value is masked to avoid exposing sensitive information.'
          example: '********'
        loon_accepted_schemes:
          type:
          - array
          - 'null'
          items:
            type: string
            example: visa
            enum:
            - accel
            - amex
            - bancontact
            - carte-bancaire
            - cirrus
            - culiance
            - dankort
            - diners-club
            - discover
            - eftpos-australia
            - elo
            - hipercard
            - jcb
            - maestro
            - mastercard
            - mir
            - nyce
            - other
            - pulse
            - rupay
            - star
            - uatp
            - unionpay
            - visa
            - null
          description: 'Card schemes accepted when creating jobs using this set of Loon API keys.

            Loon is the Account Updater service used by Gr4vy.'
          example:
          - mastercard
          - visa
        account_updater_enabled:
          type: boolean
          example: true
          default: false
          description: 'Whether the Realtime Account Updater service is enabled for this merchant account.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `false`, the Account Updater service

            doesn''t get called if a payment fails with expired or invalid card details.

            * If the field is set to `true`, the service is called. Please note that for this to work

            the other `account_updater_*` fields must be set as well.'
        account_updater_request_encryption_key:
          type:
          - string
