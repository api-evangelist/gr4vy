    Address:
      properties:
        city:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: City
          description: The city for the address.
          examples:
          - San Jose
        country:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
            examples:
            - DE
            - GB
            - US
          - type: 'null'
          title: Country
          description: The country for the address in ISO 3166 format.
          examples:
          - US
        postal_code:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 1
          - type: 'null'
          title: Postal Code
          description: The postal code or zip code for the address.
          examples:
          - '94560'
        state:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: State
          description: The state, county, or province for the address.
          examples:
          - California
        state_code:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
            examples:
            - GB-LND
            - US-CA
          - type: 'null'
