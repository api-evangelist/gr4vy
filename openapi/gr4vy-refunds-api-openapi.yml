          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error404
    TransactionRefundAllCreate:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Reason
          description: An optional reason to attach extra context to the refund requests.
          examples:
          - Refund due to user request.
        external_identifier:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 1
          - type: 'null'
          title: External Identifier
          description: An external identifier that can be used to match the refunds against your own records.
          examples:
          - refund-12345
      additionalProperties: false
      type: object
      title: TransactionRefundAllCreate
    Error425:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `too_early`
          default: too_early
          examples:
