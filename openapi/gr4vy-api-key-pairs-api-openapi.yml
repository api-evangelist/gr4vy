openapi: 3.2.0
info:
  title: Gr4vy API Key Pairs API
  version: '1.0'
  description: 'Operations tagged API Key Pairs across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: API Key Pairs
  description: 'In Gr4vy, an API key pair is used to sign and validate JSON Web Tokens (JWT).

    JWTs are used as a HTTP `bearer` token to authenticate to the API. For more

    information please visit our in-depth authentication

    guide.'
  x-internal: true
paths:
  /api-key-pairs:
    get:
      operationId: list-api-key-pairs
      summary: List API key
      description: Returns a list of active API key-pairs.
      tags:
      - API Key Pairs
      x-internal: true
      x-speakeasy-ignore: true
      parameters:
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      responses:
        '200':
          description: Returns a list of active key pairs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyPairs'
              examples:
                A list of key pairs:
                  value:
                    items:
                    - type: api-key-pair
                      id: fe26475d-ec3e-4884-9553-f7356683f7f9
                      display_name: Storefront
                      algorithm: ECDSA
                      thumbprint: SopiN5XU0IWy8Xe9mwx1ICQbKh4-ydCDPx3LIyArkVI
                      private_key: null
                      creator:
                        id: 5162f467-c5be-4673-8aae-6bbff795099b
                        name: Demo User
                        email_address: demo@gr4vy.com
                      merchant_account:
                        type: merchant-account
                        id: default
                        display_name: Default
                        created_at: '2012-12-12T10:53:43+00:00'
                        updated_at: '2012-12-12T10:53:43+00:00'
                      created_at: '2012-12-12T10:53:43+00:00'
                      updated_at: '2012-12-12T10:53:43+00:00'
                    - type: api-key-pair
                      id: c81bdcfd-00c2-4897-b220-06ff0e95685a
                      display_name: Back Office
                      algorithm: ECDSA
                      thumbprint: Wy8Xe9mwx1ICQbKh4SopiN5XU0I-yArkVIydCDPx3LI
                      private_key: null
                      creator:
                        id: 5162f467-c5be-4673-8aae-6bbff795099b
                        name: Demo User
                        email_address: demo@gr4vy.com
                      merchant_account:
                        type: merchant-account
                        id: plantly-uk
                        display_name: Plantly UK
                        created_at: '2012-12-12T10:53:43+00:00'
                        updated_at: '2012-12-12T10:53:43+00:00'
                      created_at: '2012-12-12T10:53:12+00:00'
                      updated_at: '2012-12-12T10:53:12+00:00'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: new-api-key-pair
      summary: Create API key
      description: Creates a new API key-pair.
      tags:
      - API Key Pairs
      x-internal: true
      x-speakeasy-ignore: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyPairCreate'
            examples:
              Create an API Key Pair:
                value:
                  display_name: Back Office
                  algorithm: ECDSA
                  role_ids:
                  - 8d3fe99b-1422-42e6-bbb3-932d95ae5f79
                  merchant_account_id: plantly-uk
      responses:
        '201':
          description: Returns a newly created key pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyPair'
              examples:
                A newly created API key pair:
                  value:
                    type: api-key-pair
                    id: fe26475d-ec3e-4884-9553-f7356683f7f9
                    display_name: Back Office
                    algorithm: ECDSA
                    thumbprint: SopiN5XU0IWy8Xe9mwx1ICQbKh4-ydCDPx3LIyArkVI
                    private_key: REDACTED_PRIVATE_KEY_EXAMPLE
                    creator: null
                    merchant_account:
                      type: merchant-account
                      id: plantly-uk
                      display_name: Plantly UK
                      created_at: '2012-12-12T10:53:43+00:00'
                      updated_at: '2012-12-12T10:53:43+00:00'
                    created_at: '2012-12-12T10:53:43+00:00'
                    updated_at: '2012-12-12T10:53:43+00:00'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /api-key-pairs/{api_key_pair_id}:
    parameters:
    - schema:
        type: string
        example: gg9ILy
      name: api_key_pair_id
      in: path
      required: true
      description: The ID for the API key pair.
    put:
      operationId: update-api-key-pair
      summary: Update API key
      description: Updates an API key-pair.
      tags:
      - API Key Pairs
      x-internal: true
      x-speakeasy-ignore: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyPairUpdate'
            examples:
              Update an API Key Pair:
                value:
                  display_name: Back Office
      responses:
        '200':
          description: Returns the updated key pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyPair'
              examples:
                An updated API Key Pair:
                  value:
                    type: api-key-pair
                    id: fe26475d-ec3e-4884-9553-f7356683f7f9
                    display_name: Back Office
                    algorithm: ECDSA
                    thumbprint: SopiN5XU0IWy8Xe9mwx1ICQbKh4-ydCDPx3LIyArkVI
                    private_key: null
                    merchant_account:
                      type: merchant-account
                      id: plantly-uk
                      display_name: Plantly UK
                      created_at: '2012-12-12T10:53:43+00:00'
                      updated_at: '2012-12-12T10:53:43+00:00'
                    created_at: '2012-12-12T10:53:43+00:00'
                    updated_at: '2012-12-15T10:53:43+00:00'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-api-key-pair
      summary: Delete API key
      description: Deletes an API key-pair.
      tags:
      - API Key Pairs
      x-internal: true
      x-speakeasy-ignore: true
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    get:
      tags:
      - API Key Pairs
      summary: Get an API key pair
      description: Fetches an API key pair by its ID.
      operationId: get_api_key_pair
      security:
      - OAuth2PasswordBearer:
        - api-key-pairs.read
      parameters:
      - name: api_key_pair_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The ID of the API key pair.
          examples:
          - fe26475d-ec3e-4884-9553-f7356683f7f9
          title: Api Key Pair Id
        description: The ID of the API key pair.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyPair_2'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: get
      x-speakeasy-group: api-key-pairs
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    MerchantAccount:
      title: Merchant Account
      type: object
      x-tags:
      - Merchant Account
      properties:
        type:
          type: string
          description: '`merchant-account`.'
          example: merchant-account
          enum:
          - merchant-account
        id:
          type: string
          description: The ID for this merchant account.
          example: plantly-uk
        display_name:
          type: string
          description: The display name of this merchant account.
          example: Plantly UK
        outbound_webhook_url:
          type:
          - string
          - 'null'
          format: uri
          description: The optional URL where webhooks will be received.
          example: https://www.example.com/webhook
        outbound_webhook_username:
          type:
          - string
          - 'null'
          description: 'The optional username to use when `outbound_webhook_url` is configured and

            requires basic authentication.'
          example: gr4vy
        outbound_webhook_password:
          type:
          - string
          - 'null'
          description: 'The optional password to use when `outbound_webhook_url` is configured and

            requires basic authentication.


            If the field is not `null`, the value is masked to avoid exposing sensitive information.'
          example: '********'
        visa_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: Requestor ID provided for Visa after onboarding to use Network Tokens.
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        visa_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: 'Application ID provided for Visa after onboarding to use Network

            Tokens.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        amex_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: Requestor ID provided for Amex after onboarding to use Network Tokens.
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        amex_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: Application ID provided for Amex after onboarding to use Network Tokens.
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        mastercard_network_tokens_requestor_id:
          type:
          - string
          - 'null'
          description: 'Requestor ID provided for Mastercard after onboarding to use Network

            Tokens.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        mastercard_network_tokens_app_id:
          type:
          - string
          - 'null'
          description: 'Application ID provided for Mastercard after onboarding to use

            Network Tokens.'
          example: e50fa0da-903d-4d54-aacc-4cac57d48df2
        loon_client_key:
          type:
          - string
          - 'null'
          description: 'Client key provided by Pagos to authenticate to the Loon API.

            Loon is the Account Updater service used by Gr4vy.'
          example: 7DD771287D0024BA418F8F7ECC7DF1CD
        loon_secret_key:
          type:
          - string
          - 'null'
          description: 'Secret key provided by Pagos to authenticate to the Loon API.

            Loon is the Account Updater service used by Gr4vy.


            If the field is not `null`, the value is masked to avoid exposing sensitive information.'
          example: '********'
        loon_accepted_schemes:
          type:
          - array
          - 'null'
          items:
            type: string
            example: visa
            enum:
            - accel
            - amex
            - bancontact
            - carte-bancaire
            - cirrus
            - culiance
            - dankort
            - diners-club
            - discover
            - eftpos-australia
            - elo
            - hipercard
            - jcb
            - maestro
            - mastercard
            - mir
            - nyce
            - other
            - pulse
            - rupay
            - star
            - uatp
            - unionpay
            - visa
            - null
          description: 'Card schemes accepted when creating jobs using this set of Loon API keys.

            Loon is the Account Updater service used by Gr4vy.'
          example:
          - mastercard
          - visa
        account_updater_enabled:
          type: boolean
          example: true
          default: false
          description: 'Whether the Realtime Account Updater service is enabled for this merchant account.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `false`, the Account Updater service

            doesn''t get called if a payment fails with expired or invalid card details.

            * If the field is set to `true`, the service is called. Please note that for this to work

            the other `account_updater_*` fields must be set as well.'
        account_updater_request_encryption_key:
          type:
          - string
          - 'null'
          example: example-encryption-key
          description: 'The public key used to encrypt the request to the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
        account_updater_request_encryption_key_id:
          type:
          - string
          - 'null'
          example: example-encryption-key-id
          description: 'The public key ID used to encrypt the request to the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
        account_updater_response_decryption_key:
          type:
          - string
          - 'null'
          example: example-decryption-key
          description: 'The private key used to decrypt the response from the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
        account_updater_response_decryption_key_id:
          type:
          - string
          - 'null'
          example: example-decryption-key-id
          description: 'The private key ID used to decrypt the response from the Realtime Account Updater service.

            The Account Updater service is used to update card details when cards are

            lost, stolen or expired.


            * If the field is not set or if it''s set to `null`, the Account Updater service doesn''t get called.

            * If the field is set, the other `account_updater_*` fields must be set as well.'
        created_at:
          type: string
          description: The date and time when this merchant account was created.
          format: date-time
          example: '2022-02-01T14:20:00.000+00:00'
        updated_at:
          type: string
          description: The date and time when this merchant account was updated.
          format: date-time
          example: '2022-02-01T14:20:00.000+00:00'
        over_capture_amount:
          type:
          - number
          - 'null'
          example: 1000
          minimum: 1
          maximum: 99999999
          description: 'The maximum monetary amount allowed for over-capture, in the smallest

            currency unit, for example `1299` cents to allow for an over-capture of `$12.99`.'
        over_capture_percentage:
          type:
          - number
          - 'null'
          example: 20
          minimum: 1
          maximum: 99999999
          description: 'The maximum percentage allowed for over-capture, for example `25` to allow for an

            over-capture of 25% of the original transaction amount.'
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    APIKeyPair:
      title: API Key Pair
      type: object
      description: Details about an API key pair.
      x-internal: true
      x-tags:
      - API Key Pairs
      properties:
        type:
          type: string
          description: '`api-key-pair`.'
          example: api-key-pair
          enum:
          - api-key-pair
        id:
          type: string
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: The unique Gr4vy ID for this key-pair.
          format: uuid
        display_name:
          type: string
          description: A name for this key-pair which is used in the Gr4vy admin panel to give the key-pair a human readable name.
          example: Sandbox
          minLength: 1
          maxLength: 200
        algorithm:
          type: string
          description: 'The algorithm to use for the API Key Pair. The recommended value is `ECDSA`.

            You should only use the `RSA` algorithm in environments that do not support

            `ECDSA`.'
          example: ECDSA
          enum:
          - ECDSA
          - RSA
          default: ECDSA
        thumbprint:
          type: string
          maxLength: 43
          minLength: 43
          pattern: ^[A-Za-z0-9-_]+$
          description: A unique ID for this key-pair. This ID is the thumbprint of the key.
          example: SopiN5XU0IWy8Xe9mwx1ICQbKh4-ydCDPx3LIyArkVI
        private_key:
          type:
          - string
          - 'null'
          description: 'The private key for the key-pair. This is only returned after

            the key is initially requested. For subsequent API calls this value is

            `null`.'
          example: REDACTED_PRIVATE_KEY_EXAMPLE
        created_at:
          type: string
          format: date-time
          example: '2012-12-12T10:53:43+00:00'
          description: The date and time when this key pair was created.
        updated_at:
          type: string
          format: date-time
          example: '2012-12-12T10:53:43+00:00'
          description: The date and time when this key pair was last updated.
        creator:
          type:
          - object
          - 'null'
          description: The user who created the API Key Pair.
          properties:
            id:
              type: string
              format: uuid
              description: The ID of the user.
              example: 77a76f7e-d2de-4bbc-ada9-d6a0015e6bd5
            name:
              type: string
              description: The name of the user.
              example: John L
            email_address:
              type:
              - string
              - 'null'
              description: The email address for this user.
              example: john@example.com
        merchant_account:
          $ref: '#/components/schemas/MerchantAccount'
    APIKeyPairs:
      title: A list of active API key pairs
      type: object
      description: A list of the currently active API key pairs.
      x-internal: true
      x-tags:
      - API Key Pairs
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyPair'
        limit:
          type: integer
