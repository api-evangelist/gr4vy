openapi: 3.2.0
info:
  title: Gr4vy Flow API
  version: 1.1.0-beta
  contact:
    name: Gr4vy Support
    email: code@gr4vy.com
    url: https://gr4vy.com
  termsOfService: https://gr4vy.com
  license:
    name: MIT
    url: https://raw.githubusercontent.com/gr4vy/gr4vy-openapi/main/LICENSE
  description: 'Welcome to the Gr4vy API reference documentation.

    Our API is still very much a work in product and subject to change.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
security:
- bearerAuth: []
tags:
- name: Flow
  description: In Gr4vy, a rule can be created that triggers actions anywhere in the payment flow.
  x-internal: true
paths:
  /flows/{flow}:
    parameters:
    - schema:
        type: string
        description: The name of the Flow.
        example: checkout
        enum:
        - checkout
        - card-transaction
        - non-card-transaction
        - redirect-transaction
      name: flow
      in: path
      required: true
      description: 'The flow name. This can be one of the following.


        - `checkout` - Applies during checkout to determine what payment options are shown.

        - `card-transaction` - Applies when processing a card transaction.

        - `non-card-transaction` - Applies when processing a gift card only transaction, or a

        redirect transaction using the `decline-early` action.

        - `redirect-transaction` - Applies when processing any other transaction.'
    get:
      operationId: list-flow-rules
      summary: List flow rules
      description: 'Returns a list of rules for a given flow. Each rule has an

        associated action, conditions, and outcome.'
      tags:
      - Flow
      x-internal: true
      responses:
        '200':
          description: Returns a list of rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRules'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
  /flows/{flow}/actions/{action}/rules:
    parameters:
    - schema:
        type: string
        description: The name of the Flow.
        example: checkout
        enum:
        - checkout
        - card-transaction
        - non-card-transaction
        - redirect-transaction
      name: flow
      in: path
      required: true
      description: 'The flow name. This can be one of the following.


        - `checkout` - Applies during checkout to determine what payment options are shown.

        - `card-transaction` - Applies when processing a card transaction.

        - `non-card-transaction` - Applies when processing a gift card only transaction, or a

        redirect transaction using the `decline-early` action.

        - `redirect-transaction` - Applies when processing any other transaction.'
    - schema:
        type: string
        description: 'Action for the given rule. Actions can only be used in

          flows that support them.


          * The `checkout` flow only supports the

          `select-payment-options` action.

          * The `card-transaction` supports the `route-transaction`,

          `skip-3ds`, and `decline-early` actions.

          * The `non-card-transaction` flow only supports the

          `decline-early` action.

          * The `redirect-transaction` flow only supports

          the `route-transaction` action.

          '
        example: select-payment-options
        enum:
        - select-payment-options
        - decline-early
        - route-transaction
        - skip-3ds
      name: action
      in: path
      required: true
      description: The flow action.
    post:
      operationId: new-flow-rule
      summary: Create flow rule
      description: Adds a rule for a given flow and action.
      tags:
      - Flow
      x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRuleCreateRequest'
            examples:
              Create Rule:
                value:
                  description: example rule description.
                  conditions:
                  - name: currency
                    operator: is_one_of
                    value:
                    - GBP
                    - USD
                  - name: country
                    operator: is_one_of
                    value:
                    - GB
                    - US
                  outcome:
                    type: list
                    result:
                    - card
                    - gocardless
      responses:
        '201':
          description: Returns the rule that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRule'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields. If `use_additional_scheme` transformation is used with the `network_token` instrument, a bad request is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
  /flows/{flow}/actions/{action}/rules/{rule_id}:
    parameters:
    - schema:
        type: string
        description: The name of the Flow.
        example: checkout
        enum:
        - checkout
        - card-transaction
        - non-card-transaction
        - redirect-transaction
      name: flow
      in: path
      required: true
      description: 'The flow name. This can be one of the following.


        - `checkout` - Applies during checkout to determine what payment options are shown.

        - `card-transaction` - Applies when processing a card transaction.

        - `non-card-transaction` - Applies when processing a gift card only transaction, or a

        redirect transaction using the `decline-early` action.

        - `redirect-transaction` - Applies when processing any other transaction.'
    - schema:
        type: string
        description: 'Action for the given rule. Actions can only be used in

          flows that support them.


          * The `checkout` flow only supports the

          `select-payment-options` action.

          * The `card-transaction` supports the `route-transaction`,

          `skip-3ds`, and `decline-early` actions.

          * The `non-card-transaction` flow only supports the

          `decline-early` action.

          * The `redirect-transaction` flow only supports

          the `route-transaction` action.

          '
        example: select-payment-options
        enum:
        - select-payment-options
        - decline-early
        - route-transaction
        - skip-3ds
      name: action
      in: path
      required: true
      description: The flow action.
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: rule_id
      in: path
      required: true
      description: The unique ID for a rule.
    get:
      operationId: get-flow-rule
      summary: Get rule
      description: Returns a configured rule that triggers an action in a flow.
      tags:
      - Flow
      x-internal: true
      responses:
        '200':
          description: Returns the flow rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRule'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
    put:
      operationId: update-flow-rule
      summary: Update flow rule
      description: Updates a given flow rule.
      tags:
      - Flow
      x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRuleUpdateRequest'
            examples:
              Update Rule:
                value:
                  description: example description update.
                  position: 1
      responses:
        '200':
          description: Returns the updated rule record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRule'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields. If `use_additional_scheme` transformation is used with the `network_token` instrument, a bad request is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
    delete:
      operationId: delete-flow-rule
      summary: Delete flow rule
      description: Deletes a given rule from the system.
      tags:
      - Flow
      x-internal: true
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
  /flows/{flow}/actions/{action}/outcomes:
    parameters:
    - schema:
        type: string
        description: The name of the Flow.
        example: checkout
        enum:
        - checkout
        - card-transaction
        - non-card-transaction
        - redirect-transaction
      name: flow
      in: path
      required: true
      description: 'The flow name. This can be one of the following.


        - `checkout` - Applies during checkout to determine what payment options are shown.

        - `card-transaction` - Applies when processing a card transaction.

        - `non-card-transaction` - Applies when processing a gift card only transaction, or a

        redirect transaction using the `decline-early` action.

        - `redirect-transaction` - Applies when processing any other transaction.'
    - schema:
        type: string
        description: 'Action for the given rule. Actions can only be used in

          flows that support them.


          * The `checkout` flow only supports the

          `select-payment-options` action.

          * The `card-transaction` supports the `route-transaction`,

          `skip-3ds`, and `decline-early` actions.

          * The `non-card-transaction` flow only supports the

          `decline-early` action.

          * The `redirect-transaction` flow only supports

          the `route-transaction` action.

          '
        example: select-payment-options
        enum:
        - select-payment-options
        - decline-early
        - route-transaction
        - skip-3ds
      name: action
      in: path
      required: true
      description: The flow action.
    get:
      operationId: list-flow-outcomes
      summary: List flow outcomes
      description: Returns a list of possible outcomes for a given flow action.
      tags:
      - Flow
      x-internal: true
      parameters:
      - schema:
          type: string
          example: en-US
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          default: en
        in: query
        name: locale
        description: 'An ISO 639-1 Language Code and optional ISO 3166 Country Code. This locale

          determines the language for the labels returned for every payment option.'
      responses:
        '200':
          description: Returns a list of rule outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRuleOutcomes'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
components:
  schemas:
    FlowCardSourceCondition:
      title: Flow card source condition
      type: object
      description: Card source conditions with a name, operator, and value.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: card_source
          enum:
          - card_source
        operator:
          type: string
          description: The comparison to make on the `value`.
          example: is_one_of
          enum:
          - is_one_of
          - is_not_one_of
        value:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
            description: Card sources to compare the transaction to.
            enum:
            - applepay
            - googlepay
            - network-token
            - raw
            - token
          example:
          - raw
          - applepay
    FlowCardTransactionRoutingOutcome:
      title: Card Transactions/Routing Outcome
      type: object
      description: 'Outcome for card transactions flow/routing action.

        Each option is a Gr4vy payment service object.'
      x-tags:
      - Flow
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource. Is always `transaction-route`.
          example: transaction-route
          enum:
          - transaction-route
        id:
          type: string
          example: 24c8211d-b9d9-4b06-8aa9-f350fd0ffd15
          description: Payment service identifier.
        label:
          type: string
          description: The display name of the payment service.
          example: Stripe
        active:
          type: boolean
          description: The status of the payment service.
        icon_url:
          type:
          - string
          - 'null'
          format: uri
          description: Payment service icon URL.
        countries:
          type: array
          items:
            type: string
          description: Accepted currency ISO codes for the payment service.
          example:
          - US
          - GB
        currencies:
          type: array
          items:
            type: string
          description: Accepted country ISO codes for the payment service.
          example:
          - USD
          - GBP
        instruments:
          type: array
          description: 'Valid instruments that can be used for the payment service.


            Only instruments supported by the payment service will appear in the list.'
          items:
            type: string
            description: 'The name of the instrument to be used to process the transaction.

              For `pan`, if a Payment Service token is available, the API will use that

              for stored payment methods.

              '
            enum:
            - network_token
            - pan
            example: network_token
        transformations:
          type: array
          description: Valid transformations that can be used for the payment service.
          items:
            oneOf:
            - $ref: '#/components/schemas/ForceMITTransformationOutcome'
            - $ref: '#/components/schemas/UseAdditionalSchemeTransformationOutcome'
        network_tokens_enabled:
          type: boolean
          description: Indicates if Network Tokens are enabled for the payment service.
          example: false
        network_tokens_setup_for_merchant:
          type: boolean
          description: Indicates if Network Tokens feature is enabled for at least one scheme for the merchant account.
          example: true
        open_loop:
          type: boolean
          description: Indicates if the payment service is open loop or not.
          example: true
    FlowCardSchemeCondition:
      title: Flow card scheme condition
      type: object
      description: Card scheme conditions with a name, operator, and value.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: card_scheme
          enum:
          - card_scheme
        operator:
          type: string
          description: The comparison to make on the `value`.
          example: is_one_of
          enum:
          - is_one_of
          - is_not_one_of
        value:
          type: array
          description: Card scheme(s) to compare the transaction to.
          example:
          - visa
          - mastercard
          items:
            type: string
            example: visa
            enum:
            - accel
            - amex
            - bancontact
            - carte-bancaire
            - cirrus
            - culiance
            - dankort
            - diners-club
            - discover
            - eftpos-australia
            - elo
            - hipercard
            - jcb
            - maestro
            - mastercard
            - mir
            - nyce
            - other
            - pulse
            - rupay
            - star
            - uatp
            - unionpay
            - visa
            - null
    FlowMetadataCondition:
      title: Flow metadata condition
      type: object
      description: Metadata conditions with a name, operator, and value.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: metadata
          enum:
          - metadata
        operator:
          type: string
          description: The comparison to make on the currency code `value`.
          example: includes
          enum:
          - includes
          - excludes
        value:
          type: object
          description: The metadata to compare the transaction to.
          properties:
            key:
              type: string
              minLength: 1
              maxLength: 255
              example: product
              description: Key to metadata value to compare transaction to.
            value:
              oneOf:
              - type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 255
                minLength: 1
                maxLength: 128
                example:
                - value1
                - value2
                description: List of metadata values to compare transaction to.
              - type: string
                minLength: 1
                maxLength: 255
                example: phone
                description: Value of metadata to compare transaction to.
    UseAdditionalSchemeTransformationOutcome:
      title: Use additional scheme transformation
      type: object
      description: 'Transformation to be applied when for card transaction

        flow/routing action outcome.


        This transformation forces the processing of a

        transaction to use the first additional scheme

        of the card instead of it''s main scheme.


        If the card doesn''t have any additional schemes,

        this outcome would be skipped.'
      x-tags:
      - Flow
      x-internal: true
      properties:
        name:
          type: string
          description: The name of the transformation. This will always be `use_additional_scheme`.
          example: use_additional_scheme
          enum:
          - use_additional_scheme
    FlowBINRangeCondition:
      title: Flow BIN range condition
      type: object
      description: BIN range conditions with a name, operator, and value.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: card_bin
          enum:
          - card_bin
        operator:
          type: string
          description: The comparison to make on the `card_bin` `value`.
          example: is_one_of
          enum:
          - is_one_of
          - is_not_one_of
        value:
          type: array
          items:
            type: string
            minLength: 1
          description: 'BIN range to compare with the transaction. A card BIN is

            8 characters long at maximum.'
          example:
          - 41410000-42429999
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    FlowAmountZeroCondition:
      title: Flow zero amount condition
      type: object
      description: Amount conditions matching a value of 0 in any currency.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: amount_zero
          enum:
          - amount_zero
        operator:
          type: string
          description: The comparison to make on the transaction `value`.
          example: equal_to
          enum:
          - equal_to
        value:
          type: number
          description: The value of the transaction must be 0.
          example: 0
    FlowRuleOutcomes:
      title: Flow rule outcome
      type: object
      description: 'Defines the outcome of a rule in a flow.

        Currently the outcomes can be a boolean value, or a list of string

        values. The meaning of this outcome depends on the `action` this rule

        is triggered for.'
      x-tags:
      - Flow
      x-internal: true
      properties:
        items:
          type: array
          description: A list of outcomes.
          items:
            oneOf:
            - $ref: '#/components/schemas/FlowPaymentOptionOutcome'
            - $ref: '#/components/schemas/FlowCardTransactionRoutingOutcome'
            - $ref: '#/components/schemas/FlowRedirectTransactionRoutingOutcome'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    FlowPaymentSourceCondition:
      title: Flow payment source condition
      type: object
      description: Payment source conditions with a name, operator, and value.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: payment_source
          enum:
          - payment_source
        operator:
          type: string
          description: The comparison to make on the payment source `value`.
          example: is_one_of
          enum:
          - is_one_of
          - is_not_one_of
        value:
          type: array
          items:
            type: string
            example: recurring
            enum:
            - ecommerce
            - moto
            - recurring
            - installment
            - card_on_file
          example:
          - recurring
          - installment
          description: Payment sources to compare the transaction to.
    FlowRuleBooleanOutcome:
      title: Boolean outcome
      type: object
      description: 'Defines the outcome of a rule in a flow where the result

        is a boolean.'
      x-tags:
      - Flow
      required:
      - type
      - result
      x-internal: true
      properties:
        type:
          type: string
          description: The type of action outcome for the given rule.
          example: boolean
          enum:
          - boolean
        result:
          type: boolean
          description: Results for a given flow action.
          enum:
          - true
    FlowGiftCardBINCondition:
      title: Flow gift card BIN range condition
      type: object
      description: Gift card BIN range conditions with a name, operator, and value.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: gift_card_bin
          enum:
          - gift_card_bin
        operator:
          type: string
          description: The comparison to make on the `gift_card_bin` `value`.
          example: is_one_of
          enum:
          - is_one_of
          - is_not_one_of
        value:
          type: array
          items:
            type: string
            minLength: 1
          description: 'Gift card BIN range to compare with gift card numbers used in

            the transaction to. A gift card BIN is 9 characters long at maximum.'
          example:
          - 414100000-424299999
    FlowPaymentOptionOutcome:
      title: Checkout/Payment Option Outcome
      type: object
      description: 'Outcome for checkout flow/select payment options action.

        Each option is a Gr4vy payment option object.'
      x-tags:
      - Flow
      x-internal: true
      properties:
        type:
          type: string
          description: The type of this resource. Is always `action`.
          example: action
          enum:
          - action
        id:
          type: string
          example: card
          description: Payment option identifier.
        label:
          type: string
          description: Verbose payment option name.
          example: Card
        active:
          type: boolean
          description: 'The status of the payment option, true if at least one underlying

            connection is active, otherwise false.'
        group:
          type:
          - string
          - 'null'
          description: Optional group label for a given payment option, e.g. `Bank`.
          example: Bank
        icon_url:
          type: string
          format: uri
          description: Payment option icon URL.
    FlowIsSubsequentPaymentCondition:
      title: Flow is subsequent payment condition
      type: object
      description: '`is_subsequent_payment` flag conditions with a name, operator, and value.'
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
      - operator
      - value
      properties:
        name:
          type: string
          description: The type of match made for this rule.
          example: is_subsequent_payment
          enum:
          - is_subsequent_payment
        operator:
          type: string
          description: The comparison to make on the `is_subsequent_payment` flag `value`.
          example: equal_to
          enum:
          - equal_to
        value:
          type: boolean
          description: '`is_subsequent_payment` flag value to compare the transaction to.'
          example: true
    FlowCardTypeCondition:
      title: Flow card type condition
      type: object
      description: Card type condition with a name, operator, and value.
      x-tags:
      - Flow
      x-internal: true
      required:
      - name
