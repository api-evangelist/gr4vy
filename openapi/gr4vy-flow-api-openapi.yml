          type: array
          description: Results for a given flow action.
          items:
            type: object
            properties:
              payment_service_id:
                type: string
                description: ID of the payment service to be used when processing the transaction.
                example: fe26475d-ec3e-4884-9553-f7356683f7f9
                format: uuid
              instrument:
                type: string
                description: 'The name of the instrument to be used to process the transaction.

                  For `pan`, if a Payment Service token is available, the API will use that

                  for stored payment methods.

                  '
                enum:
                - network_token
                - pan
                example: network_token
              transformations:
                type: array
                description: List of transformations to apply when processing the transaction.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the transformation.
                      example: force_mit
                      enum:
                      - force_mit
                      - use_additional_scheme
          example:
          - payment_service_id: fe26475d-ec3e-4884-9553-f7356683f7f9
            instrument": network_token
            transformations: []
