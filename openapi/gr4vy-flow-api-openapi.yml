            - $ref: '#/components/schemas/FlowHasGiftCardsCondition'
            - $ref: '#/components/schemas/FlowIsSubsequentPaymentCondition'
            - $ref: '#/components/schemas/FlowMetadataCondition'
            - $ref: '#/components/schemas/FlowMetadataNumericCondition'
