components:
  schemas:
    DigitalWalletDomain:
      properties:
        domain_name:
          type: string
          title: Domain Name
          description: The domain to add or remove.
          examples:
          - example.com
      additionalProperties: false
      type: object
      required:
      - domain_name
      title: DigitalWalletDomain
    Error409:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `duplicate_record`
          default: duplicate_record
          examples:
          - duplicate_record
        status:
          type: integer
          title: Status
          description: Always `409`.
          default: 409
          examples:
          - 409
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
          description: The ID of the conflicting resource.
          examples:
          - cdc70639-cb9c-4222-a73f-b8ce39f7821b
      additionalProperties: false
      type: object
      title: Error409
    Error400:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `bad_request`
          default: bad_request
          examples:
          - bad_request
        status:
          type: integer
          title: Status
          description: Always `400`.
          default: 400
          examples:
          - 400
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error400
    DigitalWalletCreate:
      properties:
        provider:
          $ref: '#/components/schemas/DigitalWalletProvider'
        merchant_name:
          type: string
          maxLength: 1024
          title: Merchant Name
        merchant_display_name:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Merchant Display Name
        merchant_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Merchant Url
        merchant_country_code:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
            examples:
            - DE
            - GB
            - US
          - type: 'null'
          title: Merchant Country Code
        merchant_category_code:
          anyOf:
          - type: string
            maxLength: 4
            minLength: 4
          - type: 'null'
          title: Merchant Category Code
        address:
          anyOf:
          - $ref: '#/components/schemas/DigitalWalletAddress'
          - type: 'null'
        extra_configuration:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extra Configuration
        domain_names:
          items:
            type: string
          type: array
          title: Domain Names
        accept_terms_and_conditions:
          type: boolean
          title: Accept Terms And Conditions
      additionalProperties: false
      type: object
      required:
      - provider
      - merchant_name
      - accept_terms_and_conditions
      title: DigitalWalletCreate
      description: Request body for registering a new digital wallet
    ErrorDetail:
      properties:
        location:
          $ref: '#/components/schemas/ErrorLocation'
