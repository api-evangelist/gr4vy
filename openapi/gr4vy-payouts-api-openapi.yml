openapi: 3.2.0
info:
  title: Gr4vy Payouts API
  version: '1.0'
  description: 'Operations tagged Payouts across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Payouts
  description: 'Payouts allow a merchant to send money from one of their own accounts to a

    third party.'
paths:
  /payouts:
    get:
      operationId: list-payouts
      summary: List payouts
      description: Lists all payouts for an account. Sorted by last updated at.
      tags:
      - Payouts
      responses:
        '200':
          description: Returns a paginated list of payouts for an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payouts'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      x-speakeasy-pagination:
        type: cursor
        inputs:
        - name: cursor
          in: parameters
          type: cursor
        outputs:
          nextCursor: $.next_cursor
      security:
      - bearerAuth: []
    post:
      operationId: new-payout
      summary: Create payout
      description: Creates a new payout.
      tags:
      - Payouts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutRequest'
      responses:
        '201':
          description: Returns the created payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          description: 'Returns an error if the request was badly formatted or missing required

            fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payouts/{payout_id}:
    parameters:
    - schema:
        type: string
        example: fe26475d-ec3e-4884-9553-f7356683f7f9
      name: payout_id
      in: path
      required: true
      description: The ID for the payout to get the information for.
    get:
      operationId: get-single-payout
      summary: Get payout
      description: Gets information about a payout.
      tags:
      - Payouts
      responses:
        '200':
          description: Returns a payout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    Merchant:
      title: Merchant
      type: object
      x-tags:
      - Merchant
      properties:
        type:
          type: string
          description: The type of this resource. Is always `merchant`.
          example: merchant
          enum:
          - merchant
        name:
          type: string
          example: Merchant
          description: The name of the merchant.
          maxLength: 255
        identification_number:
          type: string
          maxLength: 200
          description: Unique value which identifies a merchant for processing transactions, also known as a MID.
        phone_number:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 1
          maxLength: 50
          description: 'The phone number for the merchant which should be formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        url:
          type: string
          format: uri
          description: Merchant website URL.
        statement_descriptor:
          type: string
          minLength: 5
          maxLength: 22
          description: Value to explain charges or payments on bank statements.
        merchant_category_code:
          type: string
          minLength: 1
          maxLength: 4
          description: Merchant classification for the type of goods or services it provides.
        address:
          type:
          - object
          - 'null'
          description: The address for the merchant.
          allOf:
          - $ref: '#/components/schemas/Address'
    PayoutRequest:
      title: Payout (Create)
      type: object
      description: Request body for creating new payout.
      x-tags:
      - Request Bodies
      required:
      - amount
      - currency
      - payment_method
      - payment_service_id
      properties:
        amount:
          type: number
          example: 1299
          minimum: 1
          maximum: 99999999
          description: The amount to payout.
        currency:
          type: string
          example: USD
          description: The ISO-4217 currency code for the payout.
        payment_service_id:
          type: string
          format: uuid
          example: a7d6b829-aea5-407d-ab7f-138784b5ad2c
          description: The ID of the payment service to use for the payout.
        category:
          type: string
          description: The type of payout to process.
          example: online_gambling
          default: online_gambling
          enum:
          - online_gambling
        external_identifier:
          type:
          - string
          - 'null'
          description: A value that can be used to match the payout against your own records.
          example: payout-123
          minLength: 1
          maxLength: 200
        buyer_id:
          type:
          - string
          - 'null'
          format: uuid
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: The ID of the buyer to send the payout.
        buyer_external_identifier:
          type:
          - string
          - 'null'
          description: The `external_identifier` of the buyer to send this payout to.
          example: user-789123
          maxLength: 200
        buyer:
          description: Inline buyer details for the payout.
          allOf:
          - $ref: '#/components/schemas/TransactionBuyerRequest'
          type:
          - object
          - 'null'
        merchant:
          type:
          - object
          - 'null'
          description: Merchant information for the source of the payout.
          allOf:
          - $ref: '#/components/schemas/MerchantRequest'
        payment_method:
          type: object
          x-model-name: PayoutPaymentMethodRequest
          description: The type of payment method to send funds too.
          oneOf:
          - $ref: '#/components/schemas/PayoutInlineCardRequest'
          - $ref: '#/components/schemas/PayoutStoredCardRequest'
        connection_options:
          type:
          - object
          - 'null'
          description: Optional fields for processing payouts on specific payment services.
          allOf:
          - $ref: '#/components/schemas/PayoutConnectionOptionsRequest'
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PayoutInlineCardRequest:
      title: Payout card payment method
      type: object
      description: Inline card details.
      x-tags:
      - Request Bodies
      required:
      - method
      - number
      - expiration_date
      properties:
        method:
          type: string
          example: card
          description: The method to use.
          enum:
          - card
        number:
          type: string
          minLength: 13
          maxLength: 19
          example: '4111111111111111'
          pattern: ^[0-9]{13,19}$
          description: 'The 13-19 digit number for this card as it can be found on the

            front of the card.'
        expiration_date:
          type: string
          description: The expiration date of the card, formatted `MM/YY`.
          example: 11/25
          pattern: ^\d{2}/\d{2}$
          minLength: 5
          maxLength: 5
        external_identifier:
          type:
          - string
          - 'null'
          description: An external identifier that can be used to match the card against your own records.
          example: card-323444
        scheme:
          description: The card scheme.
          type:
          - string
          - 'null'
          example: visa
          enum:
          - accel
          - amex
          - bancontact
          - carte-bancaire
          - cirrus
          - culiance
          - dankort
          - diners-club
          - discover
          - eftpos-australia
          - elo
          - hipercard
          - jcb
          - maestro
          - mastercard
          - mir
          - nyce
          - other
          - pulse
          - rupay
          - star
          - uatp
          - unionpay
          - visa
          - null
    PaymentService--Snapshot:
      title: A payment service
      type: object
      description: An active, configured payment service.
      x-tags:
      - Payment Services
      properties:
        type:
          type: string
          description: The type of this resource.
          example: payment-service
          enum:
          - payment-service
        id:
          type: string
          description: The ID of this payment service.
          example: stripe-card-faaad066-30b4-4997-a438-242b0752d7e1
          minLength: 1
          maxLength: 200
        display_name:
          description: The custom name set for this service.
          example: Stripe (Main)
          maxLength: 50
          minLength: 1
          type: string
        method:
          description: The payment method that this services handles.
          type: string
          example: card
          enum:
          - affirm
          - afterpay
          - alipay
          - alipayhk
          - applepay
          - bacs
          - bancontact
          - banked
          - becs
          - bitpay
          - boleto
          - boost
          - card
          - cashapp
          - chaseorbital
          - checkout-session
          - clearpay
          - click-to-pay
          - dana
          - dcb
          - dlocal
          - ebanx
          - efecty
          - eps
          - everydaypay
          - gcash
          - gem
          - gemds
          - gift-card
          - giropay
          - givingblock
          - gocardless
          - googlepay
          - googlepay_pan_only
          - gopay
          - grabpay
          - id
          - ideal
          - kakaopay
          - kcp
          - klarna
          - latitude
          - latitudeds
          - laybuy
          - linepay
          - linkaja
          - maybankqrpay
          - mercadopago
          - multibanco
          - multipago
          - netbanking
          - network-token
          - oney_3x
          - oney_4x
          - oney_6x
          - oney_10x
          - oney_12x
          - ovo
          - oxxo
          - payid
          - paymaya
          - paypal
          - paypalpaylater
          - payto
          - venmo
          - pix
          - pse
          - rabbitlinepay
          - razorpay
          - scalapay
          - sepa
          - shopeepay
          - singteldash
          - smartpay
          - sofort
          - spei
          - stripedd
          - thaiqr
          - touchngo
          - truemoney
          - trustly
          - trustlyeurope
          - upi
          - vipps
          - waave
          - webpay
          - wechat
          - zippay
        payment_service_definition_id:
          description: 'The ID of the payment service definition used to create this service.

            '
          example: stripe-card
          maxLength: 50
          minLength: 1
          type: string
    PayoutStoredCardRequest:
      title: Payout card payment method
      type: object
      description: Stored card reference.
      x-tags:
      - Request Bodies
      required:
      - method
      - id
      properties:
        method:
          type: string
          example: id
          description: The method to use.
          enum:
          - id
        id:
          type: string
          format: uuid
          description: The ID of the stored payment method.
          example: 8d3fe99b-1422-42e6-bbb3-932d95ae5f79
    BillingDetailsRequest:
      title: Billing details (Create)
      type: object
      description: Billing details to use associated to a buyer.
      x-tags:
      - Buyers
      properties:
        first_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first name(s) or given name for the buyer.
          example: John
        last_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: Lunn
          description: The last name, or family name, of the buyer.
        email_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 320
          description: The email address for the buyer.
          example: john@example.com
        phone_number:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 1
          maxLength: 50
          description: 'The phone number for the buyer which should be formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        address:
          type:
          - object
          - 'null'
          description: The billing address for the buyer.
          allOf:
          - $ref: '#/components/schemas/Address'
          - required:
            - line1
            - city
            - state
            - postal_code
            - country
        tax_id:
          type:
          - object
          - 'null'
          description: The tax ID information associated with the billing details.
          allOf:
          - $ref: '#/components/schemas/TaxId'
    PaymentMethodDetailsCard:
      title: Card
      description: A credit or debit card payment method.
      type: object
      x-tags:
      - Payment Methods
      properties:
        bin:
          type: string
          description: The first 6 digits of the full card number (the BIN).
          example: '412345'
        card_type:
          description: The type of card, one of `credit`, `debit` or `prepaid`.
          example: credit
          type: string
          enum:
          - credit
          - debit
          - prepaid
        card_issuer_name:
          type: string
          description: The name of the card issuer.
          example: Bank
    Payouts:
      title: Payouts
      type: object
      description: A list of payouts.
      x-tags:
      - Payouts
      properties:
        items:
          type: array
          description: A list of payouts.
          items:
            $ref: '#/components/schemas/Payout'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
    BillingDetails:
      title: Billing details
      type: object
      description: Billing details associated to a buyer.
      x-tags:
      - Buyers
      properties:
        type:
          type: string
          description: The type of this resource. Is always `billing-details`.
          example: billing-details
          enum:
          - billing-details
        first_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first name(s) or given name of the buyer.
          example: John
        last_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: Lunn
          description: The last name, or family name, of the buyer.
        email_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 320
          description: The email address of the buyer.
          example: john@example.com
        phone_number:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 1
          maxLength: 50
          description: 'The phone number of the buyer. This number is formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        address:
          description: The billing address of the buyer.
          allOf:
          - $ref: '#/components/schemas/Address'
        tax_id:
          description: The tax information associated with the billing details.
          allOf:
          - $ref: '#/components/schemas/TaxId'
    Address:
      title: Address
      type: object
      description: An address for the buyer.
      x-tags:
      - Buyers
      properties:
        city:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
          description: The city for the address.
          example: London
        country:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          description: The country for the address in ISO 3166 format.
          example: GB
        postal_code:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 50
          description: The postal code or zip code for the address.
          example: '789123'
        state:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The state, county, or province for the address.
          example: Greater London
        state_code:
          type:
          - string
          - 'null'
          minLength: 4
          maxLength: 6
          description: 'The code of state, county, or province for the address in

            ISO 3166-2 format.'
          example: GB-LND
        house_number_or_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: 'The house number or name for the address. Not all payment

            services use this field but some do.'
          example: '10'
        line1:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first line of the address.
          example: 10 Oxford Street
        line2:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The second line of the address.
          example: New Oxford Court
        organization:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: 'The optional name of the company or organisation to add

            to the address.'
          example: Gr4vy
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PaymentMethod--Snapshot:
      title: Payment method (Snapshot)
      description: 'Snapshot of a payment method, as used when embedded inside other

        resources.'
      type: object
      x-tags:
      - Payment Methods
      properties:
        type:
          type: string
          description: '`payment-method`.'
          example: payment-method
          enum:
          - payment-method
        id:
          type:
          - string
          - 'null'
          description: The unique ID of the payment method.
          format: uuid
          example: 77a76f7e-d2de-4bbc-ada9-d6a0015e6bd5
        approval_target:
          type:
          - string
          - 'null'
          example: any
          description: The browser target that an approval URL must be opened in. If `any` or `null`, then there is no specific requirement.
          enum:
          - any
          - new_window
        approval_url:
          description: The optional URL that the buyer needs to be redirected to to further authorize their payment.
          example: https://api.example.app.gr4vy.com/payment-methods/ffc88ec9-e1ee-45ba-993d-b5902c3b2a8c/approve
          format: uri
          type:
          - string
          - 'null'
        country:
          description: 'The 2-letter ISO code of the country this payment method can

            be used for. If this value is `null` the payment method may be

            used in multiple countries.'
          example: US
          type:
          - string
          - 'null'
        currency:
          description: 'The ISO-4217 currency code that this payment method can be

            used for. If this value is `null` the payment method may be

            used for multiple currencies.'
          example: USD
          type:
          - string
          - 'null'
        details:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodDetailsCard'
        expiration_date:
          description: 'The expiration date for this payment method. This is mostly used by cards

            where the card might have an expiration date.'
          example: 11/25
          maxLength: 5
          minLength: 5
          pattern: ^\d{2}/\d{2}$
          type:
          - string
          - 'null'
        external_identifier:
          description: 'An external identifier that can be used to match the payment method

            against your own records.'
          example: user-789123
          type:
          - string
          - 'null'
        label:
          description: 'A label for the payment method. This can be the last 4 digits for a card,

            or the email address for an alternative payment method.'
          example: '1111'
          type:
          - string
          - 'null'
        last_replaced_at:
          description: "The date and time when this card was last replaced.\n\nWhen the Account Updater determines that new card details are available, existing details are not\nchanged immediately. There are three scenarios in which the actual replacement occurs:\n\n1. When this card has expired.\n2. When only the expiration date changed.\n3. When a transaction using this card is declined with any of the following codes:\n    * `canceled_payment_method`\n    * `expired_payment_method`\n    * `unavailable_payment_method`\n    * `unknown_payment_method`\n\nWhen the replacement is applied, this field is updated.\nFor non-card payment methods, the value of this field is always set to `null`."
          example: '2023-07-26T19:23:00.000+00:00'
          format: date-time
          type:
          - string
          - 'null'
        method:
          description: The type of this payment method.
          type: string
          example: card
          enum:
          - affirm
          - afterpay
          - alipay
          - alipayhk
          - applepay
          - bacs
