    CartItem:
      title: Cart Item
      type: object
      description: 'A cart item that represents a single cart line item for a transaction.

        Note that some optional properties are required for certain payment

        service providers. If no value is set for these properties, we will use

        their default value.


        If the total due to be paid for the item is required by the payment service

        provider, generally referred to as the "total amount", the formula below

        will usually be used to calculate this amount:


        `(unit_amount * quantity) - discount_amount + tax_amount`


        It''s highly recommended that the total amount to pay for all items

        should match the transaction''s amount to reduce the risk of the

        transaction being declined by the payment service provider.'
      required:
      - name
      - quantity
      - unit_amount
      properties:
        name:
          type: string
          description: 'The name of the cart item. The value you set for this property may

            be truncated if the maximum length accepted by a payment service

            provider is less than 255 characters.'
          example: GoPro HERO9 Camcorder
          maxLength: 255
        quantity:
          type: integer
          description: 'The quantity of this item in the cart. This value cannot be negative

            or zero.'
          example: 1
          minimum: 1
          maximum: 99999999
        unit_amount:
          type: integer
          description: 'The amount for an individual item represented as a monetary amount

            in the smallest currency unit for the given currency, for example

            `1299` USD cents represents `$12.99`.

            The amount sent through to the payment processor as unitary amount

            will be calculated to include the discount and tax values sent

            as part of this cart item.'
          example: 37999
          minimum: 0
          maximum: 99999999
        discount_amount:
          type:
          - integer
          - 'null'
          description: 'The amount discounted for this item represented as a monetary amount

            in the smallest currency unit for the given currency, for example `1299`

            USD cents represents `$12.99`.


            Please note that this amount is for the total of the cart item and not

            for an individual item. For example, if the quantity is 5, this value

            should be the total discount amount for 5 of the cart item.


            You might see unexpected failed transactions if the `discount_amount` can

            not be equally divided by the `quantity` value. This is due to the fact

            that some payment services require this amount to be specified per unit.


            In this situation we recommend splitting this item into separate items,

            each with their own specific discount.'
          example: 0
          minimum: 0
          maximum: 99999999
          default: 0
        tax_amount:
          type:
          - integer
          - 'null'
          description: 'The tax amount for this item represented as a monetary amount

            in the smallest currency unit for the given currency, for example `1299`

            USD cents represents `$12.99`.


            Please not that this amount is for the total of the cart item and not

            for an individual item. For example, if the quantity is 5, this value

            should be the total tax amount for 5 of the cart item.


            You might see unexpected failed transactions if the `tax_amount` can

            not be equally divided by the `quantity` value. This is due to the fact

            that some payment services require this amount to be specified per unit.


            In this situation we recommend splitting this item into separate items,

            each with their own specific tax amount.'
          example: 0
          minimum: 0
          maximum: 99999999
          default: 0
        external_identifier:
          type:
          - string
          - 'null'
          example: item-789123
          description: An external identifier for the cart item. This can be set to any value and is not sent to the payment service.
          maxLength: 200
        sku:
          type:
          - string
          - 'null'
          example: sku-789123
          description: The SKU for the item.
          maxLength: 200
        product_url:
          type:
          - string
          - 'null'
          format: url
          example: https://example.com/items/gopro
          description: The product URL for the item.
          maxLength: 2083
        image_url:
          type:
          - string
          - 'null'
          format: url
          example: https://example.com/images/items/gopro.png
          description: The URL for the image of the item.
          maxLength: 2083
        categories:
          type:
          - array
          - 'null'
          description: 'A list of strings containing product categories for the item.

            Max length per item: 50.'
          items:
            type: string
            maxLength: 50
          maxItems: 100
        product_type:
          type:
          - string
          - 'null'
          description: The product type of the cart item.
          example: physical
          enum:
          - physical
          - discount
          - shipping_fee
          - sales_tax
          - digital
          - gift_card
          - store_credit
          - surcharge
          - null
        seller_country:
          type:
          - string
          - 'null'
          description: 'The country code of the seller of the item. For some connectors, if this country code

            does not match the `country` then the transaction will be marked to Visa as a foreign

            seller transaction to meet Marketplace reporting requirements.'
          example: US
          pattern: ^[A-Z]{2}$
    StatementDescriptor:
      title: Statement descriptor
      type: object
      description: 'The statement descriptor is the text to be shown on the buyer''s statements.


        The specific usage of these fields will depend on the capabilities of

        the underlying PSP and bank. As a typical example, ''name'' and

        ''description'' could be concatenated using ''* '' as a separator, and

        then the resulting descriptor would be truncated to 22 characters by

        the issuing bank.'
      properties:
        name:
          type:
          - string
          - 'null'
          minLength: 5
          maxLength: 22
          description: "Reflects your doing business as (DBA) name.\n\nOther validations:\n\n1. Contains only Latin characters.\n2. Contain at least one letter\n3. Does not contain any of the special characters `< > \\ ' \" *`\n4. Supports:\n  1. Lower case: `a-z`\n  2. Upper case: `A-Z`\n  3. Numbers: `0-9`\n  4. Spaces: ` `\n  5. Special characters: `. , _ - ? + /`."
          example: GR4VY
        description:
          type:
          - string
          - 'null'
          minLength: 5
          maxLength: 22
          example: Card payment
          description: "A short description about the purchase.\n\nOther validations:\n1. Contains only Latin characters.\n2. Contain at least one letter\n3. Does not contain any of the special characters `< > \\ ' \" *`\n4. Supports:\n  1. Lower case: `a-z`\n  2. Upper case: `A-Z`\n  3. Numbers: `0-9`\n  4. Spaces: ` `\n  5. Special characters: `. , _ - ? + /`."
        city:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 13
          description: 'The merchant''s city to be displayed in a statement

            descriptor.'
          example: London
        country:
          description: 'The 2-letter ISO country code of the merchant to be displayed in a statement

            descriptor.

            '
          example: US
          type:
          - string
          - 'null'
        phone_number:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 5
          maxLength: 20
          description: 'The value in the phone number field of a customer''s statement which

            should be formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        url:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 50
          description: 'The merchant''s URL to be displayed in a statement

            descriptor.'
          example: www.gr4vy.com
