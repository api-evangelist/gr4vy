    Address_2:
      properties:
        city:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: City
          description: The city for the address.
          examples:
          - San Jose
        country:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
            examples:
            - DE
            - GB
            - US
          - type: 'null'
          title: Country
          description: The country for the address in ISO 3166 format.
          examples:
          - US
        postal_code:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 1
          - type: 'null'
          title: Postal Code
          description: The postal code or zip code for the address.
          examples:
          - '94560'
        state:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: State
          description: The state, county, or province for the address.
          examples:
          - California
        state_code:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
            examples:
            - GB-LND
            - US-CA
          - type: 'null'
          title: State Code
          description: The code of state, county, or province for the address in ISO 3166-2 format.
          examples:
          - US-CA
        house_number_or_name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: House Number Or Name
          description: The house number or name for the address. Not all payment services use this field but some do.
          examples:
          - '10'
        line1:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Line1
          description: The first line of the address.
          examples:
          - Stafford Appartments
        line2:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Line2
          description: The second line of the address.
          examples:
          - 29th Street
        organization:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Organization
          description: The optional name of the company or organisation to add to the address.
          examples:
          - Gr4vy
      additionalProperties: false
      type: object
      title: Address
    ForterAntiFraudOptionsCartItemBeneficiaryPhone:
      additionalProperties: false
