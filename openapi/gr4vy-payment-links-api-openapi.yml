openapi: 3.2.0
info:
  title: Gr4vy Payment Links API
  version: '1.0'
  description: 'Operations tagged Payment Links across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Payment Links
  description: 'In Gr4vy, payment links allow a merchant to generate a link, send it to a

    customer via email, SMS, etc, and then have the customer pay without the need

    for the merchant hosting their own checkout.'
paths:
  /payment-links:
    get:
      operationId: list-payment-links
      summary: List payment links
      description: Lists all payment links for an account. Sorted by last updated at.
      tags:
      - Payment Links
      responses:
        '200':
          description: Returns a paginated list of payment links for an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinks'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: new-payment-link
      summary: Create payment link
      description: Creates a new payment link.
      tags:
      - Payment Links
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkRequest'
      responses:
        '201':
          description: Returns the created payment link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '400':
          description: 'Returns an error if the request was badly formatted or missing required

            fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-links/{payment_link_id}:
    parameters:
    - schema:
        type: string
        example: 1b2e1e3d-ec3e-4884-9553-f7356683f7f9
      name: payment_link_id
      in: path
      required: true
      description: The ID for the payment link to get the information for.
    get:
      operationId: get-payment-link
      summary: Get payment link
      description: Gets information about a payment link.
      tags:
      - Payment Links
      responses:
        '200':
          description: Returns a payment link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-links/{payment_link_id}/expire:
    parameters:
    - schema:
        type: string
        example: 1b2e1e3d-ec3e-4884-9553-f7356683f7f9
      name: payment_link_id
      in: path
      required: true
      description: The ID for the payment link to get the information for.
    post:
      operationId: expire-payment-link
      summary: Expire payment link
      description: Expires a payment link.
      tags:
      - Payment Links
      parameters:
      - name: payment_link_id
        in: path
        required: true
        description: The ID of the payment link to expire.
        schema:
          type: string
          format: uuid
          example: 8d3fe99b-1422-42e6-bbb3-932d95ae5f79
      responses:
        '204':
          description: Returns an empty response if the payment link was successfully expired.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    ShippingDetail:
      title: Shipping detail
      type: object
      description: Shipping detail for a buyer.
      x-tags:
      - Buyers
      properties:
        type:
          type: string
          description: The type of this resource. Is always `shipping-details`.
          example: shipping-details
          enum:
          - shipping-details
        id:
          type: string
          format: uuid
          description: The unique ID for a buyer's shipping detail.
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        buyer_id:
          type: string
          format: uuid
          description: The unique ID for a buyer.
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        first_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first name(s) or given name of the buyer.
          example: John
        last_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: Lunn
          description: The last name, or family name, of the buyer.
        email_address:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 320
          description: The email address of the buyer.
          example: john@example.com
        phone_number:
          type:
          - string
          - 'null'
          pattern: ^\+[1-9]\d{1,14}$
          minLength: 1
          maxLength: 50
          description: 'The phone number of the buyer. This number is formatted according to the

            [E164 number standard](https://www.twilio.com/docs/glossary/what-e164).'
          example: '+1234567890'
        address:
          type:
          - object
          - 'null'
          description: The physical shipping address associated to this buyer.
          allOf:
          - $ref: '#/components/schemas/Address'
    PaymentLinks:
      title: Payment Links
      type: object
      description: A list of payment links.
      x-tags:
      - PaymentLinks
      properties:
        items:
          type: array
          description: A list of payment links.
          items:
            $ref: '#/components/schemas/PaymentLink'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
    TransactionBuyerRequest:
      title: Buyer
      type: object
      description: Guest buyer details.
      x-tags:
      - Request Bodies
      properties:
        external_identifier:
          type:
          - string
          - 'null'
          description: An external identifier that can be used to match the buyer against your own records. This value needs to be unique for all buyers.
          example: user-789123
          minLength: 1
          maxLength: 200
        display_name:
          type:
          - string
          - 'null'
          description: A unique name for this buyer which is used in the Gr4vy admin panel to give a buyer a human readable name.
          example: John L.
          minLength: 1
          maxLength: 200
        billing_details:
          type:
          - object
          - 'null'
          description: The optional billing details for the a buyer.
          allOf:
          - $ref: '#/components/schemas/BillingDetailsRequest'
        shipping_details:
          type:
          - object
          - 'null'
          description: The optional shipping details for the buyer.
          allOf:
          - $ref: '#/components/schemas/ShippingDetail'
        account_number:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          example: '1234567'
          description: The source account number to perform an account funding transaction.
    ConnectionOptions:
      title: Connection Options
      type: object
      properties:
        cybersource-card:
          type:
          - object
          - 'null'
          description: Additional options for Cybersource payment gateway.
          properties:
            meta_key_merchant_id:
              type:
              - string
              - 'null'
              description: 'An override for the merchant ID configured for the connector,

                used in combination with meta keys.'
            merchant_defined_information:
              type: object
              description: 'This is a key-value object for merchant defined information. Each key needs to be a

                numeric string identifying the MDI field to set. For example, for field 1 set

                the key to "1".'
              maxProperties: 100
              additionalProperties:
                type: string
              example:
                '1': John Doe
                '2': trusted
                '99': recurring
            ship_to_method:
              type:
              - string
              - 'null'
              description: Shipping method for the order.
        cybersource-kcp:
          type:
          - object
          - 'null'
          description: Additional options for Cybersource KCP APM.
          properties:
            meta_key_merchant_id:
              type:
              - string
              - 'null'
              description: 'An override for the merchant ID configured for the connector,

                used in combination with meta keys.'
            merchant_defined_information:
              type: object
              description: 'This is a key-value object for merchant defined information. Each key needs to be a

                numeric string identifying the MDI field to set. For example, for field 1 set

                the key to "1".'
              maxProperties: 100
              additionalProperties:
                type: string
              example:
                '1': John Doe
                '2': trusted
                '99': recurring
            ship_to_method:
              type:
              - string
              - 'null'
              description: Shipping method for the order.
        cybersource-ideal:
          type:
          - object
          - 'null'
          description: Additional options for Cybersource iDeal APM.
          properties:
            meta_key_merchant_id:
              type:
              - string
              - 'null'
              description: 'An override for the merchant ID configured for the connector,

                used in combination with meta keys.'
            merchant_defined_information:
              type: object
              description: 'This is a key-value object for merchant defined information. Each key needs to be a

                numeric string identifying the MDI field to set. For example, for field 1 set

                the key to "1".'
              maxProperties: 100
              additionalProperties:
                type: string
              example:
                '1': John Doe
                '2': trusted
                '99': recurring
            ship_to_method:
              type:
              - string
              - 'null'
              description: Shipping method for the order.
        cybersource-anti-fraud:
          type:
          - object
          - 'null'
          description: Additional options for Cybersource Decision Manager (anti-fraud).
          properties:
            meta_key_merchant_id:
              type:
              - string
              - 'null'
              description: 'An override for the merchant ID configured for the connector,

                used in combination with meta keys.'
            merchant_defined_data:
              type: object
              description: 'This is a key-value object for merchant defined data. Each key needs to be a

                numeric string identifying the MDD field to set. For example, for field 1 set

                the key to "1".


                Please avoid fields "31", "48", "50"-"56" and "63"-"76" as these are

                auto-populated based on the transaction profile.'
              maxProperties: 100
              additionalProperties:
                type: string
              example:
                '1': John Doe
                '2': trusted
                '99': recurring
            shipping_method:
              type:
              - string
              - 'null'
              description: Shipping method for the order.
        givingblock-givingblock:
          type:
          - object
          - 'null'
          description: Additional options for Giving Block connector.
          properties:
            defaultCryptocurrency:
              type: string
              description: 'The default crypto currency to display on the hosted page

                presented by The Giving Block.'
              example: ETH
        forter-anti-fraud:
          type:
          - object
          - 'null'
          description: Additional options for Forter (anti-fraud).
          properties:
            delivery_type:
              type:
              - string
              - 'null'
              enum:
              - PHYSICAL
              - DIGITAL
              - HYBRID
              description: 'Value to populate the `deliveryType` field in `primaryDeliveryDetails`.


                Represents the type of delivery. This can be set to `PHYSICAL` for any

                type of shipped goods, `DIGITAL` for non-shipped goods (services,

                gift cards etc.), or `HYBRID` for others.'
            delivery_method:
              type:
              - string
              - 'null'
              description: 'Value to populate the `deliveryMethod` field in `primaryDeliveryDetails`.


                Represents the delivery method chosen by customer such as postal service,

                email, in game transfer, etc.'
            is_guest_buyer:
              type: boolean
              default: false
              description: 'Defines if this is a guest check-out. This will redact the `accountId` and

                `created` fields from the `accountOwner` details sent to Forter.'
            cart_items:
              type: array
              description: 'A list of Forter cart item objects. These will be merged into the `cart_items`

                passed to the transaction. Every cart item here will be merged with a cart item

                on the transaction with the same index.


                Together, these will augment the `cartItems` values sent to the Forter validation

                API.'
              items:
                type: object
                properties:
                  basic_item_data:
                    description: General data regarding item such as name, price, etc.
                    type: object
                    properties:
                      type:
                        type: string
                        maxLength: 12
                        example: TANGIBLE
                        enum:
                        - TANGIBLE
                        - NON_TANGIBLE
                        description: Tangible if physical item, non-tangible if any other product.
                  delivery_details:
                    description: General data regarding item such as name, price, etc.
                    type: object
                    properties:
                      delivery_type:
                        type:
                        - string
                        - 'null'
                        example: PHYSICAL
                        enum:
                        - PHYSICAL
                        - DIGITAL
                        - HYBRID
                        description: 'Value to populate the `deliveryType` field for this cart item. This overrides

                          the type set at the wider level.


                          Represents the type of delivery. This can be set to `PHYSICAL` for any

                          type of shipped goods, `DIGITAL` for non-shipped goods (services,

                          gift cards etc.), or `HYBRID` for others.'
                      delivery_method:
                        type: string
                        example: USPS - Ground Mail
                        description: 'Value to populate the `deliveryMethod` field for this cart item. This overrides

                          the method set at the wider level.


                          Represents the delivery method chosen by customer such as postal service,

                          email, in game transfer, etc.'
                  beneficiaries:
                    type: array
                    description: List of all entities receiving or using the purchased cart item.
                    items:
                      type: object
                      required:
                      - personal_details
                      properties:
                        personal_details:
                          description: 'Personal details are those which contribute to building up a picture

                            of the person as an individual, such as name, title, etc.'
                          type: object
                          properties:
                            first_name:
                              description: First name.
                              type: string
                              maxLength: 75
                              example: John
                            last_name:
                              description: Last name.
                              type: string
                              maxLength: 75
                              example: Smith
                            email:
                              description: Email address.
                              type: string
                              maxLength: 256
                              example: john@example.com
                        address:
                          description: Address details for the beneficiary.
                          type:
                          - object
                          - 'null'
                          required:
                          - country
                          properties:
                            country:
                              description: Country, two-letter ISO 3166-1 alpha 2 country code.
                              type: string
                              maxLength: 2
                              example: US
                            address1:
                              description: Street-level address. Required when full address details are available.
                              type:
                              - string
                              - 'null'
                              maxLength: 255
                              example: 235 Montgomery st.
                            address2:
                              description: Unit-level address.
                              type:
                              - string
                              - 'null'
                              maxLength: 255
                              example: Ste. 1110
                            zip:
                              description: Zipcode.
                              type:
                              - string
                              - 'null'
                              maxLength: 20
                              example: '94104'
                            region:
                              description: 'Top-level administrative subdivision - state/province/department/etc.

                                Can be either abbreviated format or full name (NY/New York).'
                              type:
                              - string
                              - 'null'
                              maxLength: 200
                              example: CA
                            company:
                              description: Company name.
                              type:
                              - string
                              - 'null'
                              maxLength: 255
                              example: Generic Corp. ltd.
                            city:
                              description: City. Required when full address details are available.
                              type:
                              - string
                              - 'null'
                              maxLength: 200
                              example: San Francisco
                        phone:
                          type: array
                          description: List of all phone numbers for the beneficiary.
                          items:
                            type: object
                            required:
                            - phone
                            properties:
                              phone:
                                description: Phone number including all country and local access codes.
                                type: string
                                maxLength: 25
                                example: '15557654321'
                        comments:
                          description: Comments to merchant or beneficiary written by customer.
                          type:
                          - object
                          - 'null'
                          properties:
                            user_comments_to_merchant:
                              description: Comments the customer left to the merchant.
                              type:
                              - string
                              - 'null'
                              maxLength: 600
                              example: Please wrap with care!!
                            message_to_beneficiary:
                              description: Comments the customer left to the beneficiary of the purchase made.
                              type:
                              - string
                              - 'null'
                              maxLength: 600
                              example: Enjoy the gift John!
                            merchant_comments:
                              description: Comments by the merchant.
                              type:
                              - string
                              - 'null'
                              maxLength: 600
                              example: Shipping delayed
            total_discount:
              description: 'The `totalDiscount` object that''s sent to Forter''s validation API.

                It represents the discount that was given to the customer.'
              type:
              - object
              - 'null'
              required:
              - coupon_code
              - discount_type
              properties:
                coupon_code_used:
                  type: string
                  maxLength: 150
                  example: FATHERSDAY2015
                  description: The coupon code used.
                discount_type:
                  type: string
                  maxLength: 250
                  example: COUPON
                  description: The discount type.
                coupon_discount_amount:
                  description: A monetary amount in USD or local currency.
                  type:
                  - object
                  - 'null'
                  required:
                  - coupon_code
                  - discount_type
                  properties:
                    amount_usd:
                      type: string
                      maxLength: 12
                      example: '99.95'
                      description: Transaction amount in USD.
                    amount_local_currency:
                      type: string
                      maxLength: 20
                      example: '105.55'
                      description: Transaction amount in currency chosen by the buyer.
                    currency:
                      type: string
                      maxLength: 3
                      example: CAD
                      description: Transaction currency chosen by the buyer, 3-letter ISO-4217 format currency code.
                coupon_discount_percent:
                  type:
                  - string
                  - 'null'
                  example: 20%
                  description: Coupon discount percentage.
        adyen-card:
          type:
          - object
          - 'null'
          description: 'Additional options to be passed through to Adyen when processing

            card transactions.'
          properties:
            additionalData:
              type: object
              description: 'A key-value object representing additional data to be passed

                to Adyen.'
              additionalProperties:
                type: string
              example:
                riskdata.operatorCode: operatorCode,
                riskdata.operatorCountry: operatorCountry
            autoRescue:
              type: boolean
              default: false
              description: Enabled Adyen's auto-rescue feature.
            maxDaysToRescue:
              type:
              - integer
              - 'null'
              default: null
              description: 'Defines the number of days to auto-retry a payment for if `autoRescue`

                is enabled.'
            autoRescueScenario:
              type:
              - string
              - 'null'
              default: null
              description: Defines the Adyen auto-rescue test scenario to invoke.
        adyen-sepa:
          type:
          - object
          - 'null'
          description: 'Additional options to be passed through to Adyen when processing

            SEPA transactions.'
          properties:
            autoRescue:
              type: boolean
              default: false
              description: Enabled Adyen's auto-rescue feature.
            maxDaysToRescue:
              type:
              - integer
              - 'null'
              default: null
              description: 'Defines the number of days to auto-retry a payment for if `autoRescue`

                is enabled.'
            autoRescueSepaScenario:
              type:
              - string
              - 'null'
              default: null
              description: Defines the Adyen auto-rescue test scenario to invoke.
            ownerName:
              type:
              - string
              - 'null'
              default: null
              description: Defines the type of chargeback that you want to simulate.
        paypal-paypal:
          type:
          - object
          - 'null'
          description: 'Additional options to be passed through to PayPal when processing

            transactions.'
          properties:
            additional_data:
              type: array
              description: 'An array with key-value objects representing additional

                data to be passed to PayPal.'
              items:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
              example:
              - key: test
                value: abc
        paypal-paypalpaylater:
          type:
          - object
          - 'null'
          description: 'Additional options to be passed through to PayPal when processing

            transactions.'
          properties:
            additional_data:
              type: array
              description: 'An array with key-value objects representing additional

                data to be passed to PayPal.'
              items:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
              example:
              - key: test
                value: abc
        powertranz-card:
          type:
          - object
          - 'null'
          description: 'Additional options to be passed through to Powertranz when processing

            transactions.'
          properties:
            skipThreeDSecure:
              type: boolean
              default: false
              description: 'Allows skipping of 3DS. Without this, every transaction will be sent

                via Powertranz''s 3DS server, even though 3DS might not be triggered.'
        stripe-card:
          type:
          - object
          - 'null'
          description: 'Additional options to be passed through to Stripe when processing

            transactions.'
          properties:
            error_on_requires_action:
              type: boolean
              default: false
              description: 'Defines if Stripe should automatically fail the payment if it

                requires two-factor authentication from the user.'
            stripe_connect:
              type:
              - object
              - 'null'
              description: Stripe Connect configuration options.
              properties:
                stripe_account:
                  type:
                  - string
                  - 'null'
                  description: The ID of the connected Stripe account to process for.
                application_fee_amount:
                  type:
                  - number
                  - 'null'
                  description: The application fee to charge when processing for a connected account.
                on_behalf_of:
                  type:
                  - string
                  - 'null'
                  description: The Stripe account ID that these funds are intended for.
                transfer_data_destination:
                  type:
                  - string
                  - 'null'
                  description: The Stripe account ID that these funds are to be transferred to.
        fiserv-card:
          type:
          - object
          - 'null'
          description: Additional options for Fiserv IPG payment gateway.
          properties:
            installmentOptions:
              type:
              - object
              - 'null'
              description: Fiserv installment options.
              properties:
                numberOfInstallments:
                  type:
                  - number
                  - 'null'
                  description: Number of installments for a sale transaction if the customer pays the total amount in multiple transactions.
                installmentsInterest:
                  type:
                  - boolean
                  - 'null'
                  description: Indicates whether the installment interest amount has been applied.
                installmentDelayMonths:
                  type:
                  - number
                  - 'null'
                  description: The number of months the first installment payment will be delayed.
                merchantAdviceCodeSupported:
