openapi: 3.2.0
info:
  title: Gr4vy Gift Cards API
  version: '1.0'
  description: 'Operations tagged Gift Cards across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Gift Cards
  description: 'In Gr4vy, a gift card represents a stored value card that can be used to pay for

    a transaction.'
paths:
  /buyers/gift-cards:
    get:
      operationId: list-buyer-gift-cards
      summary: List gift cards for buyer
      description: 'Returns a list of all stored, not-expired gift cards and

        their balances for a buyer in a summarized format. Any

        expired or empty gift cards will be automatically filtered

        out and removed from the list of returned cards.


        If we were not able to fetch the latest balance then all

        stored gift cards are returned.'
      tags:
      - Gift Cards
      parameters:
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: buyer_id
        description: 'Filters the results to only the items for which the `buyer` has an

          `id` that matches this value.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: buyer_external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that matches this value.'
      responses:
        '200':
          description: Returns a list of available gift cards for a buyer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCards--Summary'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /gift-cards:
    get:
      operationId: list-gift-cards
      summary: List gift cards
      description: Returns all stored gift cards.
      tags:
      - Gift Cards
      parameters:
      - schema:
          type: string
          example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
        in: query
        name: buyer_id
        description: 'Filters the results to only the items for which the `buyer` has an

          `id` that matches this value.'
      - schema:
          type: string
          example: user-12345
        in: query
        name: buyer_external_identifier
        description: 'Filters the results to only the items for which the `buyer` has an

          `external_identifier` that matches this value.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      responses:
        '200':
          description: Returns a list of gift cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCards'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      operationId: store-gift-card
      summary: Store gift card
      description: 'Stores a gift card.


        Vaulting a gift card stores and validate it against the active gift card

        service.


        It is only possible to store a gift card against a buyer if the same card is

        not already stored on the buyer and the gift card has not expired yet.


        Buyers by default can only have a maximum limit of 10 gift cards stored against

        them. Please contact our team to change this limit. To clear out any expired or

        empty gift cards, you can call the `GET /buyers/gift-cards` endpoint which will

        automatically archive any of those cards and allow new cards to be stored.'
      tags:
      - Gift Cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardStoreRequest'
      responses:
        '201':
          description: Returns the stored gift card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCard'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '409':
          description: Returns an error if duplicate resource has been found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409DuplicateRecord'
        '429':
          description: 'Returns an error if the same token is used for too many requests per minute.

            The exact rate limit differs per instance.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429TooManyRequests'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /gift-cards/{gift_card_id}:
    parameters:
    - schema:
        type: string
        format: uuid
        example: e6cdf979-87e2-4796-8ff6-9784d5aed893
      name: gift_card_id
      in: path
      required: true
      description: The unique ID of a stored gift card.
    get:
      operationId: get-gift-card
      summary: Get gift card
      description: Retrieves details of a stored gift card.
      tags:
      - Gift Cards
      responses:
        '200':
          description: Returns a stored gift card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCard'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-gift-card
      summary: Delete gift card
      description: Removes a stored gift card.
      tags:
      - Gift Cards
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /gift-cards/balances:
    post:
      summary: Verify and check gift card balances
      operationId: check-gift-card-balances
      description: 'Verify gift cards are enrolled and fetch their balances.


        This verifies a list of gift cards are enrolled for your gift card programme,

        if this feature is available via your gift card service. It then also fetches each card''s

        current balance.


        Duplicated gift card numbers are not supported. This includes both stored gift

        cards, as well as those directly provided via the request.'
      tags:
      - Gift Cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardBalancesRequest'
      responses:
        '200':
          description: 'Returns the balances for each of the gift cards. Balances are returned in the same

            order they are requested.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCards--Summary'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '429':
          description: 'Returns an error if the same token is used for too many requests per minute.

            The exact rate limit differs per instance.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429TooManyRequests'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /gift-cards/activations:
    post:
      tags:
      - Gift Cards
      summary: Activate a gift card
      description: Activate a physical gift card through the primary gift card service. Set `store` to `true` to also store the activated gift card.
      operationId: activate_gift_card
      security:
      - OAuth2PasswordBearer:
        - gift-cards.write
        - embed
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: A unique key that identifies this request. If supported by the gift card service, the value will be forwarded to make the activation idempotent. We recommend using V4 UUIDs, or another random string with enough entropy to avoid collisions.
          title: Idempotency-Key
        description: A unique key that identifies this request. If supported by the gift card service, the value will be forwarded to make the activation idempotent. We recommend using V4 UUIDs, or another random string with enough entropy to avoid collisions.
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardActivationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCard_2'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: create
      x-speakeasy-group: gift-cards.activations
  /gift-cards/issuances:
    post:
      tags:
      - Gift Cards
      summary: Issue a gift card
      description: Issue a new virtual gift card through the primary gift card service.
      operationId: issue_gift_card
      security:
      - OAuth2PasswordBearer:
        - gift-cards.write
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: A unique key forwarded to the gift card service to make the issuance idempotent.
          title: Idempotency-Key
        description: A unique key forwarded to the gift card service to make the issuance idempotent.
      - name: x-gr4vy-merchant-account-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the merchant account to use for this request.
          examples:
          - default
          title: X-Gr4Vy-Merchant-Account-Id
        description: The ID of the merchant account to use for this request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardIssuanceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardIssuance'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: The request was unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: The credentials were invalid or the caller did not have permission to act on the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405':
          description: The request method was not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
        '409':
          description: A duplicate record was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '425':
          description: The request was too early.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error425'
        '429':
          description: Too many requests were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: The server encountered an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-speakeasy-name-override: create
      x-speakeasy-group: gift-cards.issuances
components:
  schemas:
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    GiftCard:
      title: A gift card
      type: object
      description: A gift card stored for a buyer, or used in a transaction.
      x-tags:
      - Gift Cards
      properties:
        type:
          type: string
          description: The type of this resource.
          example: gift-card
          enum:
          - gift-card
        id:
          type: string
          format: uuid
          description: The ID of this gift card.
          example: e6cdf979-87e2-4796-8ff6-9784d5aed893
        merchant_account_id:
          type: string
          description: The unique ID for a merchant account.
          example: default
        service:
          $ref: '#/components/schemas/GiftCardService'
        bin:
          type: string
          description: The first 6 digits of the full gift card number.
          example: '412345'
        sub_bin:
          type: string
          description: The 3 digits after the `bin` of the full gift card number.
          example: '554'
        last4:
          type: string
          description: The last 4 digits for the gift card.
          example: '1234'
        expiration_date:
          type:
          - string
          - 'null'
          description: 'The date and time when this gift card expires. This is a full

            date/time and may be more accurate than the actual expiry date

            received by the gift card service.'
          format: date-time
          example: '2013-07-16T19:23:00.000+00:00'
        buyer:
          description: The optional buyer for which this payment method has been stored.
          allOf:
          - $ref: '#/components/schemas/Buyer'
        created_at:
          type: string
          description: The date and time when this gift card was created in our system.
          format: date-time
          example: '2013-07-16T19:23:00.000+00:00'
        updated_at:
          type: string
          description: The date and time when this gift card was last updated in our system.
          format: date-time
          example: '2013-07-16T19:23:00.000+00:00'
    Address:
      title: Address
      type: object
      description: An address for the buyer.
      x-tags:
      - Buyers
      properties:
        city:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
          description: The city for the address.
          example: London
        country:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          description: The country for the address in ISO 3166 format.
          example: GB
        postal_code:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 50
          description: The postal code or zip code for the address.
          example: '789123'
        state:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The state, county, or province for the address.
          example: Greater London
        state_code:
          type:
          - string
          - 'null'
          minLength: 4
          maxLength: 6
          description: 'The code of state, county, or province for the address in

            ISO 3166-2 format.'
          example: GB-LND
        house_number_or_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: 'The house number or name for the address. Not all payment

            services use this field but some do.'
          example: '10'
        line1:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The first line of the address.
          example: 10 Oxford Street
        line2:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: The second line of the address.
          example: New Oxford Court
        organization:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: 'The optional name of the company or organisation to add

            to the address.'
          example: Gr4vy
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Error429TooManyRequests:
      title: Too Many Requests Error
      type: object
      description: Too Many Requests Error (HTTP 429).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`too_many_requests`.'
          example: too_many_requests
          enum:
          - too_many_requests
        status:
          type: integer
          description: '`429`.'
          example: 429
          enum:
          - 429
        message:
          type: string
          description: Further details on the field that triggered the error.
          example: Too many requests
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
