openapi: 3.2.0
info:
  title: Gr4vy Reports API
  version: '1.0'
  description: 'Operations tagged Reports across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Reports
  description: 'In Gr4vy, a report represents the configuration details to extract or

    dump a set of data into a downloadable CSV file.'
paths:
  /report-executions:
    get:
      operationId: list-all-report-executions
      summary: List all report executions
      description: Returns a list of executions belonging to any report.
      tags:
      - Reports
      parameters:
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: string
          example: '2022-01-01T12:00:00+08:00'
        in: query
        name: created_at_gte
        description: 'Filters the results to report executions created after this ISO

          date-time string. The time zone must be included.


          Ensure that the date-time string is URL encoded, e.g.

          `2022-01-01T12:00:00+08:00` must be encoded as

          `2022-01-01T12%3A00%3A00%2B08%3A00`.'
      - schema:
          type: string
          format: string
          example: '2022-01-01T12:00:00+08:00'
        in: query
        name: created_at_lte
        description: 'Filters the results to report executions created before this ISO

          date-time string. The time zone must be included.


          Ensure that the date-time string is URL encoded, e.g.

          `2022-01-01T12:00:00+08:00` must be encoded as

          `2022-01-01T12%3A00%3A00%2B08%3A00`.'
      - schema:
          type: string
          example: Failed+Authorizations+042022
        in: query
        name: report_name
        description: 'Filters for executions of reports that have a matching

          `name` value. This filter is case-insensitive.


          Ensure that when necessary, the value you pass for this

          filter is URL encoded.'
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            example: succeeded
            enum:
            - dispatched
            - failed
            - pending
            - processing
            - succeeded
          example:
          - succeeded
          - failed
        description: 'Filters for report executions that have a matching `status` value.


          This filter accepts multiple values.'
      - schema:
          type: array
          items:
            type: string
            format: uuid
          example:
          - dba3bc4c-c5f2-477f-bfb0-abd61f89f979
        in: query
        name: creator_id
        description: 'Filters the results to only match the reports that their `creator_id`

          matches with any of the provided creator IDs.'
      responses:
        '200':
          description: Returns a list of report executions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutions'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /report-executions/{report_execution_id}:
    parameters:
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: report_execution_id
      in: path
      required: true
      description: The unique ID for a report execution.
    get:
      operationId: get-report-execution
      summary: Get report execution
      description: Retrieves the details of a single report execution.
      tags:
      - Reports
      responses:
        '200':
          description: Returns a report execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecution'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /reports:
    post:
      operationId: new-report
      summary: New report
      description: Creates a new report.
      tags:
      - Reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Returns the report that was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    get:
      operationId: list-reports
      summary: List reports
      description: Returns a list of reports.
      tags:
      - Reports
      parameters:
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          example: Failed+Authorizations+042022
        in: query
        name: name
        description: 'Filters for reports that have a matching `name` value.

          This filter is case-insensitive.


          Ensure that when necessary, the value you pass for this

          filter is URL encoded.'
      - schema:
          type: array
          items:
            type: string
            enum:
            - daily
            - monthly
            - once
            - weekly
          example:
          - once
          - monthly
        in: query
        name: schedule
        description: Filters for reports that have matching `schedule` values.
      - schema:
          type: boolean
          example: true
        in: query
        name: schedule_enabled
        description: Filters for reports that have a matching `schedule_enabled` value.
      responses:
        '200':
          description: Returns a list of reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reports'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /reports/{report_id}:
    parameters:
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: report_id
      in: path
      required: true
      description: The unique ID for a report.
    get:
      operationId: get-report
      summary: Get report
      description: Retrieves the details of a single report.
      tags:
      - Reports
      responses:
        '200':
          description: Returns a report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      operationId: update-report
      summary: Update report
      description: Updates a report. This is mostly used with scheduled reports.
      tags:
      - Reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUpdate'
      responses:
        '200':
          description: Returns the updated report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /reports/{report_id}/executions:
    parameters:
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: report_id
      in: path
      required: true
      description: The unique ID for a report.
    get:
      operationId: list-report-executions
      summary: List executions for report
      description: 'Returns a list of executions for a report. For a

        one-off report there will only be one, where for scheduled ones

        there may be more.'
      tags:
      - Reports
      parameters:
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      responses:
        '200':
          description: Returns a list of executions for a report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutions'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /reports/{report_id}/executions/{report_execution_id}/url:
    parameters:
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: report_id
      in: path
      required: true
      description: The unique ID for a report.
    - schema:
        type: string
        format: uuid
        example: 8724fd24-5489-4a5d-90fd-0604df7d3b83
      name: report_execution_id
      in: path
      required: true
      description: The unique ID for a report execution.
    post:
      operationId: generate-download-url
      summary: Generate report download URL
      description: 'Generates a temporary signed URL to download the result of a report

        execution.'
      tags:
      - Reports
      responses:
        '200':
          description: 'Returns the signed download URL of a report execution result and its

            expiration date and time.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExecutionUrl'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    TransactionRetriesReportSpec:
      title: Transaction Retries Report Specification
      type: object
      description: The specification of a transaction retries report.
      x-tags:
      - Reports
      required:
      - model
      - params
      properties:
        model:
          type: string
          description: 'The model (dataset) that the data used for the report is

            retrieved from.'
          example: transaction_retries
          enum:
          - transaction_retries
        params:
          type: object
          description: Parameters used to configure the report.
          properties:
            filters:
              type: object
              description: The filters for the report.
              example:
                created_at:
                  start: day_start
                  end: day_end
              properties:
                created_at:
                  type: object
                  description: The time window for when the data was created to filter by.
                  example:
                    start: day_start
                    end: day_end
                  properties:
                    start:
                      type: string
                      description: 'The starting boundary for when the data was created

                        as either a date-time or date-time placeholder value.'
                      example: day_start
                    end:
                      type: string
                      description: 'The ending boundary for when the data was created

                        as either a date-time or date-time placeholder value.'
                      example: day_end
    ReportExecutions:
      title: Report Executions
      type: object
      description: A list of report executions.
      x-tags:
      - Reports
      properties:
        items:
          type: array
          description: A list of report executions.
          items:
            $ref: '#/components/schemas/ReportExecution'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
    Report:
      title: Report
      type: object
      description: A report record.
      x-tags:
      - Reports
      allOf:
      - $ref: '#/components/schemas/ReportSummary'
      properties:
        created_at:
          type: string
          description: The date and time this report was created in our system.
          format: date-time
          example: '2013-07-16T19:23:00.000+00:00'
        updated_at:
          type: string
          format: date-time
          description: The date and time this report was last updated.
          example: '2013-07-16T19:23:00.000+00:00'
        next_execution_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The date and time this report will next be executed, provided

            that `schedule_enabled` is `true`. This value is null if this

            is a one-off report.'
          example: '2023-01-01T00:00:00.000+00:00'
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: The description of this report.
          example: Transactions that failed to authorize in April 2022
        schedule:
          type: string
          description: 'Specifies the schedule of this report.


            If this is a one-off report, this value is `once`.


            If this is a recurring report, this value is set to the

            frequency by which the report will be executed. For example, a

            `monthly` schedule means that this report will be periodically

            executed at the start of each month.


            Note that a `weekly` schedule means that the report is executed

            at the start of every Monday.'
          example: monthly
          enum:
          - daily
          - monthly
          - once
          - weekly
        schedule_enabled:
          type: boolean
          description: 'Indicates whether this report''s scheduling is enabled. This value

            can only be set to `true` if this is a recurring report.


            When this value is set to `true`, this report will be executed at

            the `next_execution_at` date and time.


            When this value is set to `false`, future executions of this

            report are paused until this value is set to `true` again.'
          example: true
        schedule_timezone:
          type: string
          description: 'The time zone in which the next execution will be scheduled. This

            value is used to calculate this report''s `next_execution_at` value

            and is only relevant if this is a recurring report. This time zone

            is also used to calculate the timestamp range for reports that use

            date-time placeholders. Date-time placeholders are dynamic

            timestamps that change with every report execution.'
        spec:
          type: object
          description: The specifications of this report.
          x-model-name: ReportSpec
          oneOf:
          - $ref: '#/components/schemas/DetailedSettlementReportSpec'
          - $ref: '#/components/schemas/TransactionRetriesReportSpec'
          - $ref: '#/components/schemas/TransactionsReportSpec'
        latest_execution:
          allOf:
          - $ref: '#/components/schemas/ReportExecutionSummary'
          description: Details of the latest execution of this report.
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ReportExecutionSummary:
      title: Report Execution Summary
      type: object
      description: A report execution summary.
      x-tags:
      - Reports
      properties:
        type:
          type: string
          description: The type of this resource. Is always `report-execution`.
          example: report-execution
          enum:
          - report-execution
        id:
          type: string
          example: fe26475d-ec3e-4884-9553-f7356683f7f9
          description: The unique identifier for this report execution.
          format: uuid
        created_at:
          type: string
          description: The date and time this report execution was created in our system.
          format: date-time
          example: '2013-07-16T19:23:00.000+00:00'
        updated_at:
          type: string
          format: date-time
          description: The date and time this report execution was last updated.
          example: '2013-07-16T19:23:00.000+00:00'
        status:
          type: string
          description: The status of this report execution.
          example: succeeded
          enum:
          - dispatched
          - failed
          - pending
          - processing
          - succeeded
        context:
          type: object
          description: 'Contains the context values used to compute the value of date-time

            placeholders such as `month_start` and `month_end` if present in

            the report''s specification. Date-time placeholders are dynamic

            timestamps that change with every report execution.'
          properties:
            reference_timestamp:
              type: string
              format: date-time
              description: 'The date and time used by the system as a reference point to

                compute date-time placeholders.'
              example: '2013-07-16T19:23:00.000+00:00'
            reference_timezone:
              type: string
              description: The time zone used to compute date-time placeholders.
              example: Europe/London
    TransactionsReportSpec:
      title: Transactions Report Specification
      type: object
      description: The specification of a transactions report.
      x-tags:
      - Reports
      required:
      - model
      - params
      properties:
        model:
          type: string
          description: 'The model (dataset) that the data used for the report is

            retrieved from.'
          example: transactions
          enum:
          - transactions
        params:
          type: object
          description: Parameters used to configure the report.
          properties:
            fields:
              type: array
              description: A list of fields for the report.
              items:
                type: string
                enum:
                - id
                - external_identifier
                - status
                - created_at
                - updated_at
                - authorized_at
                - captured_at
                - voided_at
                - amount
                - currency
                - captured_amount
                - refunded_amount
                - method
                - scheme
                - payment_service_transaction_id
                - payment_service_id
                - payment_service_definition_id
                - payment_service_display_name
                - auth_response_code
                - raw_response_code
                - raw_response_description
                - error_code
                - metadata
                - payment_source
                - is_subsequent_payment
                - merchant_initiated
                - three_d_secure_status
                - three_d_secure_eci
                - three_d_secure_auth_resp
                - three_d_secure_method
                - buyer_external_identifier
                - billing_details_first_name
                - billing_details_last_name
                - billing_details_email_address
                - billing_details_phone_number
                - billing_details_address_city
                - billing_details_address_country
                - billing_details_address_postal_code
                - billing_details_address_state
                - billing_details_address_state_code
                - billing_details_address_house_number_or_name
                - billing_details_address_line1
                - billing_details_address_line2
                - billing_details_address_organization
                - billing_details_tax_id
                - billing_details_tax_id_kind
                - authorized_amount
                - intent_outcome
                - gift_card_redemptions_amount
                - gift_card_redemption_refunds_amount
                - settled
                - settled_currency
                - settled_amount
              example:
              - id
              - external_identifier
            filters:
              type: object
              description: The filters for the report.
              example:
                status:
                - authorization_failed
              properties:
                status:
                  type: array
                  description: A list of statuses to filter by.
                  example:
                  - authorization_failed
                  items:
                    type: string
                    enum:
                    - processing
