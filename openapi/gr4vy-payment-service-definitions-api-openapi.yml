openapi: 3.2.0
info:
  title: Gr4vy Payment Service Definitions API
  version: '1.0'
  description: 'Operations tagged Payment Service Definitions across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Payment Service Definitions
  description: 'Payment service definitions describe the fields required for a payment

    service to be configured.'
paths:
  /payment-service-definitions:
    get:
      operationId: list-payment-service-definitions
      summary: List payment service definitions
      description: Returns a list of all available payment service definitions.
      tags:
      - Payment Service Definitions
      parameters:
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      responses:
        '200':
          description: Returns a list of payment service definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentServiceDefinitions'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-service-definitions/{payment_service_definition_id}:
    parameters:
    - schema:
        type: string
        example: stripe-card
      name: payment_service_definition_id
      in: path
      required: true
      description: The unique ID of the payment service definition.
    get:
      operationId: get-payment-service-definition
      summary: Get payment service definition
      description: Gets the definition for a payment service.
      tags:
      - Payment Service Definitions
      responses:
        '200':
          description: Returns a payment service definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentServiceDefinition'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-service-definitions/{payment_service_definition_id}/sessions:
    parameters:
    - schema:
        type: string
        example: stripe-card
      name: payment_service_definition_id
      in: path
      required: true
      description: The unique ID of the payment service definition.
    post:
      operationId: create-payment-service-definition-session
      summary: Create a session for a payment service
      description: 'Creates a session for a payment service. This endpoint directly

        passes the request through to the relevant payment service for processing,

        and so the schema will differ based on the service used.


        If the downstream service returns an error, this API will return a successful response

        with the status code in the response.'
      tags:
      - Payment Service Definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentServiceSessionRequest'
      responses:
        '200':
          description: Returns the response from the downstream service used to generate the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentServiceSession'
        '400':
          description: 'Returns an error if the request was badly formatted or missing required

            fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the referenced payment service definition does not exist or there is no active payment service configured for the definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    PaymentServiceSessionRequest:
      title: Payment Service Session Request
      type: object
      description: A request to generate a session for a payment session.
      x-tags:
      - Payment Services
      additionalProperties: true
    PaymentServiceSession:
      title: Payment Service Session
      type: object
      description: 'A session request for a payment session. This is an opaque object

        passed to the payment service.'
      x-tags:
      - Payment Services
      properties:
        type:
          type: string
          description: The type of this resource.
          example: payment-service-session
          enum:
          - payment-service-session
        status:
          type: string
          description: 'The status of the response.


            - `succeeded` - The session was successfully generated.

            - `failed` - The session could not be generated.'
          example: succeeded
          enum:
          - succeeded
          - failed
        code:
          type:
          - string
          - 'null'
          example: UNKNOWN_ERROR
          description: A generic error code that may be returned when the session could not be generated.
        status_code:
          type:
          - number
          - 'null'
          example: 200
          description: The HTTP status code received from the payment service.
        response_body:
          type:
          - object
          - 'null'
          description: The parsed JSON received from the payment service.
          additionalProperties: true
          example:
            data:
              customerType: EXISTING
              walletManagementUrl: https://example.com/session
            meta: {}
    Error401Unauthorized:
      title: Unauthorized Error
      type: object
      description: Unauthorized Error (HTTP 401).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: '`unauthorized`.'
          example: unauthorized
          enum:
          - unauthorized
        status:
          type: integer
          description: '`401`.'
          example: 401
          enum:
          - 401
        message:
          type: string
          description: No valid API authentication found.
          example: No valid API authentication found
          enum:
          - No valid API authentication found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    Error404NotFound:
      title: Not Found Error
      type: object
      description: Not Found Error (HTTP 404).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: The reason code for the error.
          example: not_found
          enum:
          - not_found
          - pending_creation
        status:
          type: integer
          description: '`404`.'
          example: 404
          enum:
          - 404
        message:
          type: string
          description: The human readable reason for the error.
          example: The resource could not be found
        details:
          type: array
          description: 'A list of detail objects that further clarify the reason for the error.

            Not every error supports more detail.'
          example: []
          items:
            $ref: '#/components/schemas/ErrorDetail'
    PaymentServiceDefinitionConfiguration:
      title: Payment Service Definition Context
      type: object
      description: Configuration items for the payment service.
      properties:
        approval_ui_height:
          type: string
          description: Height of the approval interface in either pixels or view height (vh).
          example: 300px
        approval_ui_width:
          type: string
          description: Width of the approval interface in either pixels or view width (vw).
          example: 300px
        approval_ui_target:
          type:
          - string
          - 'null'
          example: any
          description: The browser target that an approval URL must be opened in. If `any` or `null`, then there is no specific requirement.
          enum:
          - any
          - new_window
    PaymentServiceDefinition:
      title: Payment Service Definition
      type: object
      description: An available payment service that can be configured.
      x-tags:
      - Discovery
      properties:
        id:
          type: string
          description: The ID of the payment service. This is the underlying provider followed by a dash followed by the payment method ID.
          example: stripe-card
        type:
          type: string
          description: '`payment-service-definition`.'
          default: payment-service-definition
          example: payment-service-definition
          enum:
          - payment-service-definition
        display_name:
          type: string
          description: The display name of this service.
          example: Stripe
        method:
          description: The ID of the payment method that this services handles.
          type: string
          example: card
          enum:
          - affirm
          - afterpay
          - alipay
          - alipayhk
          - applepay
          - bacs
          - bancontact
          - banked
          - becs
          - bitpay
          - boleto
          - boost
          - card
          - cashapp
          - chaseorbital
          - checkout-session
          - clearpay
          - click-to-pay
          - dana
          - dcb
          - dlocal
          - ebanx
          - efecty
          - eps
          - everydaypay
          - gcash
          - gem
          - gemds
          - gift-card
          - giropay
          - givingblock
          - gocardless
          - googlepay
          - googlepay_pan_only
          - gopay
          - grabpay
          - id
          - ideal
          - kakaopay
          - kcp
          - klarna
          - latitude
          - latitudeds
          - laybuy
          - linepay
          - linkaja
          - maybankqrpay
          - mercadopago
          - multibanco
          - multipago
          - netbanking
          - network-token
          - oney_3x
          - oney_4x
          - oney_6x
          - oney_10x
          - oney_12x
          - ovo
          - oxxo
          - payid
          - paymaya
          - paypal
          - paypalpaylater
          - payto
          - venmo
          - pix
          - pse
          - rabbitlinepay
          - razorpay
          - scalapay
          - sepa
          - shopeepay
          - singteldash
          - smartpay
          - sofort
          - spei
          - stripedd
          - thaiqr
          - touchngo
          - truemoney
          - trustly
          - trustlyeurope
          - upi
          - vipps
          - waave
          - webpay
          - wechat
          - zippay
        fields:
          type: array
          description: A list of fields that need to be submitted when activating the payment. service.
          minItems: 1
          items:
            type: object
            description: 'A single field that needs to be submitted for a payment service when it

              is created.'
            properties:
              key:
                type: string
                example: private_api_key
                description: The key of a field that needs to be submitted.
              display_name:
                type: string
                example: Private API key
                description: The name to display for a field in the dashboard.
              required:
                type: boolean
                example: true
                description: Defines if this field is required when the service is created.
              format:
                type: string
                example: text
                description: Defines the type of input that needs to be rendered for this field.
                enum:
                - text
                - multiline
                - number
              secret:
                type: boolean
                example: true
                description: 'Defines if this field is secret. When `true` the field is not

                  returned when querying the payment service.'
        reporting_fields:
          type: array
          description: A list of fields that need to be submitted when enabling the payment service settlement reporting.
          minItems: 0
          items:
            type: object
            description: 'A single field that needs to be submitted for a payment service when the

              settlement reporting is being enabled for it.'
            properties:
              key:
                type: string
                example: username
                description: The key of a field that needs to be submitted.
              display_name:
                type: string
                example: Reporting Username
                description: The name to display for a field in the dashboard.
              required:
                type: boolean
                example: true
                description: Defines if this field is required when the reporting is being enabled.
              format:
                type: string
                example: text
                description: Defines the type of input that needs to be rendered for this field.
                enum:
                - text
                - multiline
                - number
              secret:
                type: boolean
                example: true
                description: 'Defines if this field is secret. When `true` the field is not

                  returned when querying the payment service.'
        supported_currencies:
          type: array
          description: A list of three-letter ISO currency codes that this service supports.
          items:
            type: string
            minLength: 3
            maxLength: 3
          minItems: 1
          example:
          - USD
          - GBP
          - EUR
        supported_countries:
          type: array
          description: A list of two-letter ISO country codes that this service supports.
          items:
            type: string
          minItems: 1
          example:
          - US
          - GB
          - DE
        mode:
          description: The mode of this payment service.
          type: string
          example: card
          enum:
          - card
          - redirect
          - applepay
          - googlepay
          - click-to-pay
          - checkout-session
        supported_features:
          type: object
          description: Features supported by the payment definition.
          properties:
            delayed_capture:
              type: boolean
              example: false
              description: 'Supports [capturing](#operation/capture-transaction) authorized

                transactions.'
            digital_wallets:
              type: boolean
              example: false
              description: 'Supports passing decrypted digital wallet (e.g. Apple Pay)

                tokens to the underlying processor.'
            network_tokens_default:
              type: boolean
              example: true
              description: Supports processing network tokens by default.
            network_tokens_toggle:
              type: boolean
              example: false
              description: Supports toggling processing of network tokens on or off.
            open_loop:
              type: boolean
              example: true
              description: 'Supports processing transactions with either raw PAN details or

                network tokens.'
            open_loop_toggle:
              type: boolean
              example: false
              description: Supports toggling processing as open-loop on or off.
            partial_refunds:
              type: boolean
              example: false
              description: 'Supports [partially refunding](#operation/refund-transaction) captured

                transactions.'
            payment_method_tokenization:
              type: boolean
              example: true
              description: Supports storing a payment method via tokenization.
            payment_method_tokenization_toggle:
              type: boolean
              example: false
              description: 'Supports toggling tokenization for a payment method on or off

                from the dashboard.'
            refunds:
              type: boolean
              example: true
              description: 'Supports [refunding](#operation/refund-transaction) captured

                transactions.'
            requires_webhook_setup:
              type: boolean
              example: true
              description: Requires merchant to set up `webhook_url` manually with provider.
            three_d_secure_hosted:
              type: boolean
              example: true
              description: Supports hosted 3-D Secure with a redirect.
            three_d_secure_pass_through:
              type: boolean
              example: false
              description: Supports passing 3-D Secure data to the underlying processor.
            verify_credentials:
              type: boolean
              example: false
              description: 'Supports verifying the credentials entered while setting up the

                underlying processor. This is for internal use only.'
            void:
              type: boolean
              example: true
              description: 'Supports [voiding](#operation/void-transaction) authorized

                transactions.'
        icon_url:
          type:
          - string
          - 'null'
          description: An icon to display for the payment service.
          example: https://cdn.gr4vy.app/stripe.svg
        configuration:
          $ref: '#/components/schemas/PaymentServiceDefinitionConfiguration'
    PaymentServiceDefinitions:
      title: Payment service definitions
      type: object
      description: A list of available payment services definitions.
      x-tags:
      - Discovery
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentServiceDefinition'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    Error409:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `duplicate_record`
          default: duplicate_record
          examples:
          - duplicate_record
        status:
          type: integer
          title: Status
          description: Always `409`.
          default: 409
          examples:
          - 409
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
          description: The ID of the conflicting resource.
          examples:
          - cdc70639-cb9c-4222-a73f-b8ce39f7821b
      additionalProperties: false
      type: object
      title: Error409
    Error400:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `bad_request`
          default: bad_request
          examples:
          - bad_request
        status:
          type: integer
          title: Status
          description: Always `400`.
          default: 400
          examples:
          - 400
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error400
    RequiredCheckoutFields:
      properties:
        required_fields:
          items:
            type: string
          type: array
          uniqueItems: true
          title: Required Fields
          description: A list of transaction fields that are required to process a payment for this service.
          examples:
          - - address.line1
            - address.country
            - address.city
            - address.postal_code
        conditions:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Conditions
          description: The conditions under which these fields are required
          examples:
          - country:
            - IN
      additionalProperties: false
      type: object
      required:
      - required_fields
      title: RequiredCheckoutFields
      description: A collection of checkout fields and the conditions under which they are required.
    PaymentServiceDefinitions_2:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PaymentServiceDefinition_2'
          type: array
          title: Items
          description: A list of items returned for this request.
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          description: The number of items for this page.
          default: 20
          examples:
          - 20
        next_cursor:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Next Cursor
          description: The cursor pointing at the next page of items.
          examples:
          - ZXhhbXBsZTE
        previous_cursor:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Previous Cursor
          description: The cursor pointing at the previous page of items.
          examples:
          - Xkjss7asS
      additionalProperties: false
      type: object
      required:
      - items
      title: PaymentServiceDefinitions
    ErrorDetail_2:
      properties:
        location:
          $ref: '#/components/schemas/ErrorLocation'
          description: The part of the request where the property can be found that caused the error.
          examples:
          - body
        pointer:
          anyOf:
          - type: string
            format: json-pointer
          - type: string
          title: Pointer
          description: A JSON pointer for the particular property that caused the error.
          examples:
          - /currency
        message:
          type: string
          title: Message
          description: A human-readdable explanation of the error.
          examples:
          - 'Unknown ISO 4217 currency code: USX'
        type:
          type: string
          title: Type
          description: The type of error that was raised for this property.
          examples:
          - value_error
      additionalProperties: false
      type: object
      required:
      - location
      - pointer
      - message
      - type
      title: ErrorDetail
    ErrorLocation:
      type: string
      enum:
      - query
      - body
      - path
      - header
      - unknown
      title: ErrorLocation
    Error504:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `gateway_timeout`
          default: gateway_timeout
          examples:
          - gateway_timeout
        status:
          type: integer
          title: Status
          default: 504
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Request could not be processed
          examples:
          - Request could not be processed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail_2'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error504
    Method:
      type: string
      enum:
      - abitab
