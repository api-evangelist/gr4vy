components:
  schemas:
    ThreeDSecureScenarioCreate:
      properties:
        conditions:
          $ref: '#/components/schemas/ThreeDSecureScenarioConditions'
          description: Conditions for the scenario.
          examples:
          - amount: 100
            card_number: '4242424242424242'
            email_address: john@example.com
            external_identifier: buyer-12345
            first_name: John
            last_name: Luhn
        outcome:
          $ref: '#/components/schemas/ThreeDSecureScenarioOutcome'
          description: Outcome for the scenario.
          examples:
          - authentication:
              transaction_status: C
            result:
              transaction_status: Y
            version: 2.3.1
          - authentication:
              transaction_status: N
            version: 2.3.1
      additionalProperties: false
      type: object
      required:
      - conditions
      - outcome
      title: ThreeDSecureScenarioCreate
    Error409:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `duplicate_record`
          default: duplicate_record
          examples:
          - duplicate_record
        status:
          type: integer
          title: Status
          description: Always `409`.
          default: 409
          examples:
          - 409
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
          description: The ID of the conflicting resource.
          examples:
          - cdc70639-cb9c-4222-a73f-b8ce39f7821b
      additionalProperties: false
      type: object
      title: Error409
    Error400:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `bad_request`
          default: bad_request
          examples:
          - bad_request
        status:
          type: integer
          title: Status
          description: Always `400`.
          default: 400
          examples:
          - 400
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Generic error
          examples:
          - Request failed validation
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error400
    ThreeDSecureScenarioConditions:
      properties:
        first_name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: First Name
          description: First name of the buyer to match.
          examples:
          - John
        last_name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Last Name
          description: Last name of the buyer to match.
          examples:
          - Luhn
        email_address:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Email Address
          description: Email address of the buyer to match.
          examples:
          - john@example.com
        amount:
          anyOf:
          - type: integer
            maximum: 99999999.0
            minimum: 0.0
          - type: 'null'
          title: Amount
          description: Amount of the transaction to match.
          examples:
          - 100
        external_identifier:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: External Identifier
          description: External identifier to match.
          examples:
          - buyer-12345
        card_number:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Card Number
          description: Card number to match.
          examples:
          - '4242424242424242'
      additionalProperties: false
      type: object
      title: ThreeDSecureScenarioConditions
    ThreeDSecureScenarioOutcomeResult:
      properties:
        transaction_status:
          type: string
          enum:
          - Y
          - N
          - timeout
          title: Transaction Status
          description: 3DS result.
          examples:
          - Y
          - N
          - timeout
      additionalProperties: false
      type: object
      required:
      - transaction_status
      title: ThreeDSecureScenarioOutcomeResult
    ErrorDetail:
      properties:
        location:
          $ref: '#/components/schemas/ErrorLocation'
          description: The part of the request where the property can be found that caused the error.
          examples:
          - body
        pointer:
          anyOf:
          - type: string
            format: json-pointer
          - type: string
          title: Pointer
          description: A JSON pointer for the particular property that caused the error.
          examples:
          - /currency
        message:
          type: string
          title: Message
          description: A human-readdable explanation of the error.
          examples:
          - 'Unknown ISO 4217 currency code: USX'
        type:
          type: string
          title: Type
          description: The type of error that was raised for this property.
          examples:
          - value_error
      additionalProperties: false
      type: object
      required:
      - location
      - pointer
      - message
      - type
      title: ErrorDetail
    ThreeDSecureScenarios:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ThreeDSecureScenario'
          type: array
          title: Items
          description: A list of items returned for this request.
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          description: The number of items for this page.
          default: 20
          examples:
          - 20
        next_cursor:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Next Cursor
          description: The cursor pointing at the next page of items.
          examples:
          - ZXhhbXBsZTE
        previous_cursor:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Previous Cursor
          description: The cursor pointing at the previous page of items.
          examples:
          - Xkjss7asS
      additionalProperties: false
      type: object
      required:
      - items
      title: ThreeDSecureScenarios
    ThreeDSecureScenarioOutcome:
      properties:
        version:
          anyOf:
          - type: string
            pattern: ^[12](\.\d+){0,2}$
          - type: 'null'
          title: Version
          description: The version of 3DS which will be simulated.
          examples:
          - 2.2.0
          - 2.3.1
        authentication:
          $ref: '#/components/schemas/ThreeDSecureScenarioOutcomeAuthentication'
          description: 3DS authentication value.
          examples:
          - transaction_status: C
        result:
          anyOf:
          - $ref: '#/components/schemas/ThreeDSecureScenarioOutcomeResult'
          - type: 'null'
          description: 3DS result value. Required if authentication status is "C".
          examples:
          - transaction_status: Y
      additionalProperties: false
      type: object
      required:
      - authentication
      title: ThreeDSecureScenarioOutcome
    ErrorLocation:
      type: string
      enum:
      - query
      - body
      - path
      - header
      - unknown
      title: ErrorLocation
    Error504:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `gateway_timeout`
          default: gateway_timeout
          examples:
          - gateway_timeout
        status:
          type: integer
          title: Status
          default: 504
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Request could not be processed
          examples:
          - Request could not be processed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error504
    Error502:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `bad_gateway`
          default: bad_gateway
          examples:
          - bad_gateway
        status:
          type: integer
          title: Status
          description: Always `502`.
          default: 502
          examples:
          - 502
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Request could not be processed
          examples:
          - Request could not be processed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error502
    Error500:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `server_error`
          default: server_error
          examples:
          - server_error
        status:
          type: integer
          title: Status
          description: Always `500`.
          default: 500
          examples:
          - 500
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: Request could not be processed
          examples:
          - Request could not be processed
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error500
    Error401:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `unauthorized`
          default: unauthorized
          examples:
          - unauthorized
        status:
          type: integer
          title: Status
          description: Always `401`.
          default: 401
          examples:
          - 401
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: No valid API authentication found
          examples:
          - No valid API authentication found
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error401
    Error404:
      properties:
        type:
          type: string
          const: error
          title: Type
          description: Always `error`.
          default: error
          examples:
          - error
        code:
          type: string
          title: Code
          description: Always `not_found`
          default: not_found
          examples:
          - not_found
        status:
          type: integer
          title: Status
          description: Always `404`.
          default: 404
          examples:
          - 404
        message:
          type: string
          title: Message
          description: A human readable message that provides more context to the error.
          default: The resource could not be found
          examples:
          - The resource could not be found
        details:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          title: Details
          description: A list of details that further ellaborate on the error.
          default: []
      additionalProperties: false
      type: object
      title: Error404
    ThreeDSecureScenarioUpdate:
      properties:
        conditions:
          anyOf:
          - $ref: '#/components/schemas/ThreeDSecureScenarioConditions'
          - type: 'null'
          description: Conditions for the scenario.
          examples:
