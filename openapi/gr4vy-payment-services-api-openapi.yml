openapi: 3.2.0
info:
  title: Gr4vy Payment Services API
  version: '1.0'
  description: 'Operations tagged Payment Services across 2 of this provider''s published API definitions: gr4vy-docs-v1-openapi.json, gr4vy-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.{id}.gr4vy.app
  x-speakeasy-server-id: sandbox
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
- url: https://api.{id}.gr4vy.app
  x-speakeasy-server-id: production
  variables:
    id:
      default: example
      description: The subdomain for your Gr4vy instance.
tags:
- name: Payment Services
  description: 'In Gr4vy, a payment service represents a configured payment provider

    (Stripe, PayPal, Adyen, etc) for a specific payment type (card, bitcoin,

    etc)


    The payment services API can be used to:


    * Provide Gr4vy with the payment credentials for a payment provider.

    * Set a display name for a payment provider.'
paths:
  /payment-services:
    get:
      operationId: list-payment-services
      summary: List payment services
      description: Lists the currently configured and activated payment services.
      tags:
      - Payment Services
      parameters:
      - schema:
          type: integer
          default: 20
          example: 1
          minimum: 1
          maximum: 100
          format: int32
        in: query
        name: limit
        description: Defines the maximum number of items to return for this request.
      - schema:
          type: string
          format: ''
          example: ZXhhbXBsZTE
        in: query
        name: cursor
        description: 'A cursor that identifies the page of results to return. This is used to

          paginate the results of this API.


          For the first page of results, this parameter can be left out.

          For additional pages, use the value returned by the API in

          the `next_cursor` field. Similarly the `previous_cursor` can be used to

          reverse backwards in the list.'
      - schema:
          type: string
          example: card
          enum:
          - affirm
          - afterpay
          - alipay
          - alipayhk
          - applepay
          - bacs
          - bancontact
          - banked
          - becs
          - bitpay
          - boleto
          - boost
          - card
          - cashapp
          - chaseorbital
          - checkout-session
          - clearpay
          - click-to-pay
          - dana
          - dcb
          - dlocal
          - ebanx
          - efecty
          - eps
          - everydaypay
          - gcash
          - gem
          - gemds
          - gift-card
          - giropay
          - givingblock
          - gocardless
          - googlepay
          - googlepay_pan_only
          - gopay
          - grabpay
          - id
          - ideal
          - kakaopay
          - kcp
          - klarna
          - latitude
          - latitudeds
          - laybuy
          - linepay
          - linkaja
          - maybankqrpay
          - mercadopago
          - multibanco
          - multipago
          - netbanking
          - network-token
          - oney_3x
          - oney_4x
          - oney_6x
          - oney_10x
          - oney_12x
          - ovo
          - oxxo
          - payid
          - paymaya
          - paypal
          - paypalpaylater
          - payto
          - venmo
          - pix
          - pse
          - rabbitlinepay
          - razorpay
          - scalapay
          - sepa
          - shopeepay
          - singteldash
          - smartpay
          - sofort
          - spei
          - stripedd
          - thaiqr
          - touchngo
          - truemoney
          - trustly
          - trustlyeurope
          - upi
          - vipps
          - waave
          - webpay
          - wechat
          - zippay
        in: query
        name: method
        description: 'Filters the results to only the items for which the `method` has been set to

          this value. For example `card`.'
      - schema:
          type: boolean
          example: true
          default: false
        in: query
        name: deleted
        description: 'Filters the results to only show items which have been deleted.

          By default, deleted items will not be returned.'
      responses:
        '200':
          description: Returns a list of payment services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentServices'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    post:
      summary: New payment service
      operationId: new-payment-service
      description: Adds a new payment service by providing a custom name and a value for each of the required fields.
      tags:
      - Payment Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentServiceRequest'
      responses:
        '201':
          description: Returns the created payment service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentService'
              examples:
                Stripe:
                  value:
                    type: payment-service
                    id: faaad066-30b4-4997-a438-242b0752d7e1
                    merchant_account_id: default
                    payment_service_definition_id: stripe
                    method: card
                    display_name: Stripe
                    status: pending
                    accepted_currencies:
                    - EUR
                    accepted_countries:
                    - DE
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-services/{payment_service_id}:
    parameters:
    - schema:
        type: string
        example: 46973e9d-88a7-44a6-abfe-be4ff0134ff4
      name: payment_service_id
      in: path
      required: true
      description: The ID of the payment service.
    get:
      operationId: get-payment-service
      summary: Get payment service
      description: Retrieves the details of a single configured payment service.
      tags:
      - Payment Services
      responses:
        '200':
          description: Returns a payment service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentService'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    put:
      operationId: update-payment-service
      summary: Update payment service
      description: Updates an existing payment service. Allows all fields to be changed except for the service ID.
      tags:
      - Payment Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentServiceUpdate'
      responses:
        '201':
          description: Returns the updated payment service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentService'
        '400':
          description: Returns an error if the request was badly formatted or missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    delete:
      operationId: delete-payment-service
      summary: Delete payment service
      description: Deletes a specific active payment service.
      tags:
      - Payment Services
      responses:
        '204':
          description: Returns an empty response.
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-services/{payment_service_id}/sessions:
    parameters:
    - schema:
        type: string
        example: 46973e9d-88a7-44a6-abfe-be4ff0134ff4
      name: payment_service_id
      in: path
      required: true
      description: The ID of the payment service.
    post:
      operationId: create-payment-service-session
      summary: Create a session for a payment service by ID
      description: 'Creates a session for a payment service. This endpoint directly

        passes the request through to the relevant payment service for processing,

        and so the schema will differ based on the service used.


        If the downstream service returns an error, this API will return a successful response

        with the status code in the response.'
      tags:
      - Payment Services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentServiceSessionRequest'
      responses:
        '200':
          description: Returns the response from the downstream service used to generate the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentServiceSession'
        '400':
          description: 'Returns an error if the request was badly formatted or missing required

            fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the referenced payment service does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
  /payment-services/verify:
    post:
      operationId: verify-payment-service
      summary: Verify payment service credentials
      description: Verifies a set of credentials against a payment service.
      tags:
      - Payment Services
      x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentServiceVerify'
      responses:
        '200':
          description: Returns 200 OK if credentials successfully verified.
        '400':
          description: Returns an error if the request was badly formatted, missing required fields, or if the provided credentials are invalid and failed verification against the payment service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400BadRequest'
        '401':
          description: Returns an error if no valid authentication was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Unauthorized'
        '404':
          description: Returns an error if the resource can not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404NotFound'
      security:
      - bearerAuth: []
    servers:
    - url: https://api.sandbox.{id}.gr4vy.app
      x-speakeasy-server-id: sandbox
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
    - url: https://api.{id}.gr4vy.app
      x-speakeasy-server-id: production
      variables:
        id:
          default: example
          description: The subdomain for your Gr4vy instance.
components:
  schemas:
    Error400BadRequest:
      title: Bad Request
      type: object
      description: Bad Request (HTTP 400).
      x-tags:
      - Errors
      properties:
        type:
          type: string
          description: '`error`.'
          enum:
          - error
          example: error
        code:
          type: string
          description: A short code that describes the reason for the error.
          example: bad_request
          enum:
          - bad_request
          - incorrect_json
          - invalid_credentials
        status:
          type: integer
          description: '`400`.'
          example: 400
          enum:
          - 400
        message:
          type: string
          description: A human-readable reason for the error.
          example: Missing '****' field
        details:
          type: array
          description: A list of detail objects that further clarify the reason for the error.
          items:
            $ref: '#/components/schemas/ErrorDetail'
    MerchantProfile:
      title: Merchant Profile
      type: object
      description: Merchant profile for the different card schemes.
      properties:
        amex:
          type:
          - object
          - 'null'
          description: Merchant profile for Amex.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileScheme'
        dankort:
          type:
          - object
          - 'null'
          description: Merchant profile for Dankort.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileScheme'
        discover:
          type:
          - object
          - 'null'
          description: Merchant profile for Discover.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileScheme'
        jcb:
          type:
          - object
          - 'null'
          description: Merchant profile for JCB.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileScheme'
        mastercard:
          type:
          - object
          - 'null'
          description: Merchant profile for Mastercard.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileScheme'
        unionpay:
          type:
          - object
          - 'null'
          description: Merchant profile for UnionPay.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileScheme'
        visa:
          type:
          - object
          - 'null'
          description: Merchant profile for Visa.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileScheme'
    PaymentServices:
      title: A list of active payment services
      type: object
      description: A list of active, configured payment services.
      x-tags:
      - Payment Services
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentService'
        limit:
          type: integer
          description: 'The limit applied to request. This represents the number of items that are at

            maximum returned by this request.'
          format: int32
          minimum: 1
          maximum: 100
          example: 1
          default: 20
        next_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: ZXhhbXBsZTE
          minLength: 1
          maxLength: 1000
        previous_cursor:
          type:
          - string
          - 'null'
          description: 'The cursor that represents the next page of results. Use the `cursor` query

            parameter to fetch this page of items.'
          example: null
          minLength: 1
          maxLength: 1000
    ErrorDetail:
      title: Error details
      description: Additional detail about the part of a request body that caused an issue.
      type: object
      x-tags:
      - Errors
      properties:
        location:
          type: string
          example: body
          description: The location where the error caused an issue.
          enum:
          - query
          - body
          - path
          - header
        type:
          type: string
          example: value_error.missing
          description: A unique identifier for the type of error that occurred.
        pointer:
          type: string
          example: /payment_method/number
          description: 'The exact item for which the validation did not succeed. This is a JSON

            pointer for request bodies, while for query, path, and header parameters

            it is the name of the parameter.'
        message:
          type: string
          example: field required
          description: A human readable message for this error detail.
    MerchantProfileSummary:
      title: Merchant Profile
      type: object
      description: Merchant profile for the different card schemes.
      properties:
        amex:
          type:
          - object
          - 'null'
          description: Merchant profile for Amex.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileSchemeSummary'
        dankort:
          type:
          - object
          - 'null'
          description: Merchant profile for Dankort.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileSchemeSummary'
        discover:
          type:
          - object
          - 'null'
          description: Merchant profile for Discover.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileSchemeSummary'
        jcb:
          type:
          - object
          - 'null'
          description: Merchant profile for JCB.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileSchemeSummary'
        mastercard:
          type:
          - object
          - 'null'
          description: Merchant profile for Mastercard.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileSchemeSummary'
        unionpay:
          type:
          - object
          - 'null'
          description: Merchant profile for UnionPay.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileSchemeSummary'
        visa:
          type:
          - object
          - 'null'
          description: Merchant profile for Visa.
          allOf:
          - $ref: '#/components/schemas/MerchantProfileSchemeSummary'
    MerchantProfileSchemeSummary:
      title: Merchant Profile (single scheme)
      type: object
      description: Merchant profile for a specific scheme.
      properties:
        merchant_acquirer_bin:
          type: string
          maxLength: 11
          description: Acquirer bin to use when calling 3DS through this scheme.
        merchant_url:
          type: string
          description: URL to send when calling 3DS through this scheme.
        merchant_acquirer_id:
          type: string
          maxLength: 35
          description: Merchant ID to use when calling 3DS through this scheme.
        merchant_name:
          type: string
          maxLength: 40
          description: Merchant name to use when calling 3DS through this scheme.
        merchant_country_code:
          type: string
          minLength: 3
          maxLength: 3
          description: Merchant country code to use when calling 3DS through this scheme.
        merchant_category_code:
          type: string
          maxLength: 4
          description: Merchant category code to use when calling 3DS through this scheme.
        created_at:
          type: string
          description: The date and time when this profile was created.
          format: date-time
          example: '2023-07-26T19:23:00.000+00:00'
    PaymentServiceUpdate:
      title: Payment Service (Update)
      type: object
      description: Request body for updating an active payment service.
      x-tags:
      - Request Bodies
      properties:
        display_name:
          type: string
          description: A custom name for the payment service. This will be shown in the Admin UI.
          example: Stripe (Main)
          minLength: 1
          maxLength: 50
        fields:
          type: array
          description: A list of fields, each containing a key-value pair for each field defined by the definition for this payment service e.g. for stripe-card `secret_key` is required and so must be sent within this field.
          items:
            type: object
            description: A key-value pair that represents a field defined in the definition for this payment service.
            required:
            - key
            - value
            properties:
              key:
                type: string
                description: The key of the field to set a value for.
                example: private_key
                minLength: 1
                maxLength: 50
              value:
                type: string
                description: The value of a field to set; you can unset optional fields by setting this to an empty string `""`.
                example: REDACTED_STRIPE_KEY
                minLength: 0
                maxLength: 5000
        reporting_fields:
          type: array
          description: The `reporting_fields` field should contain a list of key-value pairs. Each key-value pair represents a reporting field defined by the payment service. For example, when enabling settlement reporting for `nuvei-card`, the `ssh_username` field is required and must be included in `reporting_fields`.
          items:
            type: object
            description: A key-value pair that represents a reporting field defined in the definition for this payment service.
            required:
            - key
            - value
            properties:
              key:
                type: string
                description: The key of the field to set a value for.
                example: ssh_username
                minLength: 1
                maxLength: 50
              value:
                type: string
                description: The value of a field to set; you can unset optional fields by setting this to an empty string `""`.
                example: test_ssh_user
                minLength: 0
                maxLength: 5000
        accepted_countries:
          type: array
          description: A list of countries that this payment service needs to support in ISO two-letter code format.
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 2
          example:
          - US
          - GB
          - DE
        accepted_currencies:
          type: array
          description: A list of currencies that this payment service needs to support in ISO 4217 three-letter code format.
          minItems: 1
          items:
            type: string
            minLength: 3
            maxLength: 3
          example:
          - EUR
          - USD
          - GBP
        three_d_secure_enabled:
          type: boolean
          example: true
          default: false
          description: 'Defines if 3-D Secure is enabled for the service. This feature

            can only be enabled if the payment service definition supports

            the `three_d_secure_hosted` feature.

            This does not affect pass through 3-D Secure data.'
        merchant_profile:
          type:
          - object
          - 'null'
          description: 'Configuration for each supported card scheme.

            When updating a Payment Service, a key not being present will

            indicate no updates to be done on that scheme, whereas an object being

            sent as Null for a key will empty the configuration for that scheme.'
          allOf:
          - $ref: '#/components/schemas/MerchantProfile'
        active:
          type: boolean
          example: true
          default: true
          description: Defines if this service is currently active or not.
        open_loop:
          type:
          - boolean
          - 'null'
          example: true
          description: 'Defines if the service works as an open-loop service. This feature

            can only be enabled if the PSP is set up to accept previous scheme

            transaction IDs.


            If this value is set to `null`, it will be set to the value of

            `open_loop` in the payment service definition.


            If `open_loop_toggle` is `false` in the payment service definition,

            `open_loop` should either not be provided or set to `null`, or it

            will fail with a validation error.'
        payment_method_tokenization_enabled:
          type:
          - boolean
          - 'null'
          example: true
          description: 'Defines if tokenization is enabled for the service. This feature

            can only be enabled if the payment service is NOT set as `open_loop`

            and the PSP is set up to tokenize.'
        network_tokens_enabled:
          type:
          - boolean
          - 'null'
          example: true
          description: 'Defines if network tokens are enabled for the service. This feature

            can only be enabled if the payment service is set as `open_loop` and

            the PSP is set up to accept network tokens.


            If this value is set to `null`, it will be set to the value of

            `network_tokens_default` in the payment service definition.


            If `network_tokens_toggle` is `false` in the payment service definition,

            `network_tokens_enabled` should either not be provided or set to `null`,

            or it will fail with a validation error.'
        settlement_reporting_enabled:
          type: boolean
          example: true
          default: false
          description: 'Defines if settlement reporting is enabled for the service.

            This feature can only be enabled if the payment service

            definition supports the `settlement_reporting` feature.'
    PaymentServiceSession:
      title: Payment Service Session
      type: object
      description: 'A session request for a payment session. This is an opaque object

        passed to the payment service.'
      x-tags:
      - Payment Services
      properties:
        type:
          type: string
          description: The type of this resource.
          example: payment-service-session
          enum:
          - payment-service-session
        status:
          type: string
          description: 'The status of the response.


            - `succeeded` - The session was successfully generated.

            - `failed` - The session could not be generated.'
          example: succeeded
          enum:
          - succeeded
          - failed
        code:
          type:
          - string
          - 'null'
          example: UNKNOWN_ERROR
          description: A generic error code that may be returned when the session could not be generated.
        status_code:
          type:
          - number
          - 'null'
          example: 200
          description: The HTTP status code received from the payment service.
        response_body:
          type:
          - object
          - 'null'
          description: The parsed JSON received from the payment service.
          additionalProperties: true
          example:
            data:
              customerType: EXISTING
              walletManagementUrl: https://example.com/session
            meta: {}
    PaymentService:
      title: A payment service
      type: object
      description: An active, configured payment service.
      x-tags:
      - Payment Services
      properties:
        type:
          type: string
          description: The type of this resource.
