    PaymentServiceRequest:
      title: Payment Service (Create)
      type: object
      description: Request body for activating a payment service.
      x-tags:
      - Request Bodies
      required:
      - display_name
      - payment_service_definition_id
      - fields
      - accepted_currencies
      - accepted_countries
      properties:
        payment_service_definition_id:
          type: string
          description: The ID of the payment service to use.
          example: stripe-card
          minLength: 1
          maxLength: 50
        display_name:
          type: string
          description: A custom name for the payment service. This will be shown in the Admin UI.
          example: Stripe (Main)
          minLength: 1
          maxLength: 50
        fields:
          type: array
          description: A list of fields, each containing a key-value pair for each field defined by the definition for this payment service e.g. for stripe-card `secret_key` is required and so must be sent within this field.
          items:
            type: object
            description: A key-value pair that represents a field defined in the definition for this payment service.
            required:
            - key
            - value
            properties:
              key:
                type: string
                description: The key of the field to set a value for.
                example: private_key
                minLength: 1
                maxLength: 50
              value:
                type: string
                description: The value of a field to set.
                example: REDACTED_STRIPE_KEY
                minLength: 1
                maxLength: 5000
        reporting_fields:
          type: array
          description: The `reporting_fields` field should contain a list of key-value pairs. Each key-value pair represents a reporting field defined by the payment service. For example, when enabling settlement reporting for `nuvei-card`, the `ssh_username` field is required and must be included in `reporting_fields`.
          items:
            type: object
            description: A key-value pair that represents a reporting field defined in the definition for this payment service.
            required:
            - key
            - value
            properties:
              key:
                type: string
                description: The key of the field to set a value for.
                example: ssh_username
                minLength: 1
                maxLength: 50
              value:
                type: string
                description: The value of a field to set.
                example: test_ssh_user
                minLength: 1
                maxLength: 5000
        accepted_countries:
          type: array
          description: A list of countries that this payment service needs to support in ISO two-letter code format.
          minItems: 1
          items:
            type: string
            minLength: 2
            maxLength: 2
          example:
          - US
          - GB
          - DE
        accepted_currencies:
          type: array
          description: A list of currencies that this payment service needs to support in ISO 4217 three-letter code format.
          minItems: 1
          items:
            type: string
            minLength: 3
            maxLength: 3
          example:
          - EUR
          - USD
          - GBP
        three_d_secure_enabled:
          type: boolean
          example: true
          default: false
          description: 'Defines if 3-D Secure is enabled for the service. This feature

            can only be enabled if the payment service definition supports

            the `three_d_secure_hosted` feature.

            This does not affect pass through 3-D Secure data.'
        merchant_profile:
          type:
          - object
          - 'null'
          description: Configuration for each supported card scheme.
          allOf:
          - $ref: '#/components/schemas/MerchantProfile'
        active:
          type: boolean
          example: true
          default: true
          description: Defines if this service is currently active or not.
        open_loop:
          type:
          - boolean
          - 'null'
          example: true
          description: 'Defines if the service works as an open-loop service. This feature

            can only be enabled if the PSP is set up to accept previous scheme

            transaction IDs.


            If this value is not provided or is set to `null`, it will be set

            to the value of `open_loop` in the payment service definition.


            If `open_loop_toggle` is `false` in the payment service definition,

            `open_loop` should either not be provided or set to `null`, or it

            will fail with a validation error.'
        payment_method_tokenization_enabled:
          type:
          - boolean
          - 'null'
          example: true
          description: 'Defines if tokenization is enabled for the service. This feature

            can only be enabled if the payment service is NOT set as `open_loop`

            and the PSP is set up to tokenize.'
        network_tokens_enabled:
          type:
          - boolean
          - 'null'
          example: true
          description: 'Defines if network tokens are enabled for the service. This feature

            can only be enabled if the payment service is set as `open_loop` and

            the PSP is set up to accept network tokens.


            If this value is not provided or is set to `null`, it will be set

            to the value of `network_tokens_default` in the payment service

            definition.


            If `network_tokens_toggle` is `false` in the payment service definition,

            `network_tokens_enabled` should either not be provided or set to `null`,

            or it will fail with a validation error.'
        settlement_reporting_enabled:
          type: boolean
          example: true
          default: false
          description: 'Defines if settlement reporting is enabled for the service.

            This feature can only be enabled if the payment service

            definition supports the `settlement_reporting` feature.'
