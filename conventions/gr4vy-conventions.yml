reversibility:
  grade: documented
  note: Reversal operations exist for the money-moving surface, but the docs state no Gr4vy-level time window -
    refund/void windows are set by the downstream payment service (the refund_period_expired error code reports
    when a connector window has lapsed). No window is asserted here.
  surfaces:
  - write: create_transaction (authorization)
    reversal: void_transaction
    operationId: void_transaction
    window: null
    condition: before capture
    docs: https://docs.gr4vy.com/reference/transactions/void-transaction
  - write: create_transaction (pending)
    reversal: cancel_transaction
    operationId: cancel_transaction
    window: null
    condition: while the transaction is pending
    docs: https://docs.gr4vy.com/reference/transactions/cancel-transaction
  - write: capture_transaction
    reversal: create_transaction_refund / create_full_transaction_refund
    operationId: create_transaction_refund
    window: null
    docs: https://docs.gr4vy.com/reference/transactions/refund-transaction
  - write: add_payment_link
    reversal: expire_payment_link
    operationId: expire_payment_link
    window: null
  - write: create_payout
    reversal: null
    note: No reversal operation in the spec.
  - write: delete_* (buyers, payment methods, gift cards, etc.)
    reversal: null
    note: Deletes are permanent; no restore operation in the spec.
