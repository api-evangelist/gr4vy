description: Gr4vy normalises every connector (PSP) response into one error_code vocabulary on the transaction,
  grouped as core failures, connector declines and connector failures. The meaning column is the provider text and
  embeds the recommended action. simulator_amount is the amount that reproduces the code against the Gr4vy transaction
  simulator in sandbox.
envelope_field: transaction.error_code (with raw_response_code / raw_response_description carrying the untranslated
  connector values)
mask_as_generic: []
mask_note: The docs publish no list of codes to mask from buyers.
decline_code_count: 70
decline_codes:
- code: incomplete_buyer_approval
  category: Core failures
  meaning: Occurs when a buyer approval redirection times out, this normally means the buyer has closed the redirect
    page/popup without authenticating. This error code can take up to 10 minutes from the time the buyer closes
    the redirect page / popup to appear
- code: failed_buyer_approval
  category: Core failures
  meaning: Occurs when a buyer fails to authenticate through 3DS. This transaction can be attempted again
- code: missing_redirect_url
  category: Core failures
  meaning: Occurs when a transaction requires a redirect but was created without `payment_method.redirect_url`.
    Add the `payment_method.redirect_url` and retry
- code: flow_decline
  category: Core failures
  meaning: Occurs when a transaction is declined by a Flow rule. This could be due to fraud or an alternate system
    configuration declining the transaction
- code: all_attempts_skipped
  category: Core failures
  meaning: Occurs when a transaction fails because no outcome in the matched Flow rule can be used to process the
    transaction reliably. To avoid this, make sure to define there is a default suitable outcome for each possible
    transaction scenario
- code: canceled
  category: Core failures
  meaning: Occurs when a transaction is canceled, this means a previously triggered cancel action has finished successfully
