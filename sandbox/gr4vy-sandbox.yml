description: Every Gr4vy instance has a separate sandbox environment on its own infrastructure and hostname. The
  sandbox always connects to each payment service sandbox; production to the live API. Resources are not shared
  between environments.
modes:
- name: sandbox
  base_url: https://api.sandbox.{instance_id}.gr4vy.app
  notes: Separate infrastructure; connectors hit PSP sandboxes.
- name: production
  base_url: https://api.{instance_id}.gr4vy.app
  notes: Live.
key_formats:
  note: No key prefixes. Auth is a JWT signed with a per-environment API key-pair private key (.pem) created in
    the dashboard Integrations panel or over the API.
